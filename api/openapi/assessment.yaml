components:
  schemas:
    Homework:
      type: object
      description: Homework set for a class section.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        institutionId:
          type: string
          format: uuid
          description: Institution.
        academicYearId:
          type: string
          format: uuid
          description: Academic year.
        classSectionId:
          type: string
          format: uuid
          description: Class section.
        subjectId:
          type: string
          format: uuid
          description: Subject.
        assignedByStaffId:
          type: string
          format: uuid
          description: Teacher.
        description:
          type: string
          description: Instructions.
        attachmentFileId:
          type: string
          format: uuid
          description: Attachment.
        assignedOn:
          type: string
          format: date-time
          description: Assigned on.
        dueAt:
          type: string
          format: date-time
          description: Submission deadline.
        status:
          type: string
          enum:
          - draft
          - published
          x-extensible-enum: true
          description: Publication state. Changed only through the workflow operations.
          readOnly: true
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
