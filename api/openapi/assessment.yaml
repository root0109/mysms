            $ref: '#/components/schemas/ExamResult'
          description: Per-paper results.
      required:
      - examSessionId
    PublishMarksheetRequest:
      type: object
      properties:
        visibleToGuardians:
          type: boolean
          description: Whether guardians can see it.
    ResultCardList:
      type: object
      description: A page of ResultCard.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResultCard'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 / OIDC access token. Claims carry tenant_id, user_id, roles and an optional act-as (impersonation) subject.
    platformAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token of MySMS platform staff (audience mysms-platform-admin, MFA required). Only these operations may act across tenants; the target tenant is the resource being addressed.
