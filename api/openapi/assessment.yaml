openapi: 3.1.0
info:
  title: MySMS API — Assessment & Results
  version: 1.0.0
  description: Homework, assignments, exams, grading schemes, marksheets and results for institutional (official) assessment.
  license:
    name: Proprietary
    identifier: LicenseRef-MySMS
  contact:
    name: MySMS API team
    email: api@mysms.example
servers:
- url: https://api.mysms.example
  description: Production (replace with your domain)
security:
- bearerAuth: []
tags:
- name: Assignment
  description: Assignment aggregate.
- name: AssignmentSubmission
  description: AssignmentSubmission aggregate.
- name: AssignmentType
  description: AssignmentType aggregate.
- name: Exam
  description: Exam aggregate.
- name: ExamResult
  description: ExamResult aggregate.
- name: ExamSession
  description: ExamSession aggregate.
- name: ExamType
  description: ExamType aggregate.
- name: GradingBand
  description: GradingBand aggregate.
- name: GradingScheme
  description: GradingScheme aggregate.
- name: Homework
  description: Homework aggregate.
- name: HomeworkSubmission
  description: HomeworkSubmission aggregate.
- name: Marksheet
  description: Marksheet aggregate.
- name: MarksheetLine
  description: MarksheetLine aggregate.
- name: ResultTemplate
  description: ResultTemplate aggregate.
- name: Operation
  description: Long-running operations started in this module (reports, imports, exports, bulk generation); poll until done.
paths:
  /v1/assessment/homeworks:
    get:
      operationId: assessment.ListHomeworks
      summary: List Homeworks
      description: List Homeworks visible to the caller, with cursor pagination, filtering and ordering.
      tags:
      - Homework
      security:
      - bearerAuth: []
      x-permission: assessment.homework.read
      x-grpc:
        service: mysms.assessment.v1.HomeworkService
        method: ListHomeworks
      parameters:
      - $ref: ./common.yaml#/components/parameters/PageSize
      - $ref: ./common.yaml#/components/parameters/PageToken
      - $ref: ./common.yaml#/components/parameters/Filter
      - $ref: ./common.yaml#/components/parameters/OrderBy
      - $ref: ./common.yaml#/components/parameters/ReadMask
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeworkList'
        '400':
          $ref: ./common.yaml#/components/responses/400
        '401':
          $ref: ./common.yaml#/components/responses/401
        '403':
          $ref: ./common.yaml#/components/responses/403
        '404':
