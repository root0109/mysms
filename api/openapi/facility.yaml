      operationId: facility.ListFacilities
      summary: List Facilities
      description: List Facilities visible to the caller, with cursor pagination, filtering and ordering.
      tags:
      - Facility
      security:
      - bearerAuth: []
      x-permission: facility.facility.read
      x-grpc:
        service: mysms.facility.v1.FacilityService
