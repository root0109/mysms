        '429':
          $ref: ./common.yaml#/components/responses/429
        '500':
          $ref: ./common.yaml#/components/responses/500
    post:
      operationId: facility.CreateFacility
      summary: Create Facility
      description: Create a Facility. Supports Idempotency-Key and validateOnly.
      tags:
      - Facility
      security:
      - bearerAuth: []
      x-permission: facility.facility.create
