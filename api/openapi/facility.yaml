openapi: 3.1.0
info:
  title: MySMS API — Rooms & Facilities
  version: 1.0.0
  description: Rooms (classrooms, labs, exam halls), the facilities they offer and the assets they hold.
  license:
    name: Proprietary
    identifier: LicenseRef-MySMS
  contact:
    name: MySMS API team
    email: api@mysms.example
servers:
- url: https://api.mysms.example
  description: Production (replace with your domain)
security:
- bearerAuth: []
tags:
- name: AssetItem
  description: AssetItem aggregate.
- name: Facility
  description: Facility aggregate.
- name: Room
  description: Room aggregate.
paths:
  /v1/facility/facilities:
