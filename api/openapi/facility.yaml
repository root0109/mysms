        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    RoomAsset:
      type: object
      description: Asset held in a room.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        roomId:
          type: string
          format: uuid
          description: Room.
          readOnly: true
        assetItemId:
          type: string
          format: uuid
          description: Asset.
        tagCode:
          type: string
          maxLength: 40
          description: Asset tag / serial code.
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d+(\.\d+)?$
          description: Quantity.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - assetItemId
      - quantity
    RoomAssetUpdate:
      type: object
      description: Fields of RoomAsset that can be updated (partial update; see updateMask).
      properties:
        assetItemId:
          type: string
          format: uuid
          description: Asset.
        tagCode:
          type: string
          maxLength: 40
          description: Asset tag / serial code.
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d+(\.\d+)?$
          description: Quantity.
    RoomAssetList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomAsset'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 / OIDC access token. Claims carry tenant_id, user_id, roles and an optional act-as (impersonation) subject.
    platformAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token of MySMS platform staff (audience mysms-platform-admin, MFA required). Only these operations may act across tenants; the target tenant is the resource being addressed.
