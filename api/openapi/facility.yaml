      properties:
        sortOrder:
          type: integer
          format: int32
          description: Display order.
        isActive:
          type: boolean
          description: Whether offered for new picks.
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        institutionId:
          type: string
          format: uuid
          description: Institution.
        code:
          type: string
          maxLength: 40
          description: Asset code.
        name:
          type: string
          maxLength: 150
          description: Asset name.
        unitOfMeasure:
          type: string
          maxLength: 20
          description: Unit.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
