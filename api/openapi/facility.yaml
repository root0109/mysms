        institutionId:
          type: string
          format: uuid
          description: Institution.
        code:
          type: string
          maxLength: 40
          description: Asset code.
        name:
          type: string
          maxLength: 150
          description: Asset name.
        unitOfMeasure:
          type: string
          maxLength: 20
          description: Unit.
