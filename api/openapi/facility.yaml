components:
  schemas:
    Facility:
      type: object
      description: Facility type available in rooms (projector, smart board, AC...).
      properties:
        sortOrder:
          type: integer
          format: int32
          description: Display order.
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        institutionId:
          type: string
          format: uuid
          description: Institution.
        code:
          type: string
          maxLength: 30
          description: Facility code.
        name:
          type: string
          maxLength: 120
          description: Facility name.
        isActive:
          type: boolean
          description: Whether in use.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - institutionId
      - code
      - name
    FacilityUpdate:
      type: object
      description: Fields of Facility that can be updated (partial update; see updateMask).
      properties:
        sortOrder:
          type: integer
          format: int32
          description: Display order.
        institutionId:
          type: string
          format: uuid
          description: Institution.
        code:
          type: string
          maxLength: 30
          description: Facility code.
        name:
          type: string
          maxLength: 120
          description: Facility name.
        isActive:
          type: boolean
          description: Whether in use.
    FacilityList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    Room:
      type: object
      description: Room that can host sessions or exams.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        institutionId:
          type: string
          format: uuid
          description: Institution.
        code:
          type: string
          maxLength: 30
          description: Room code.
        name:
          type: string
          maxLength: 120
          description: Room name.
        roomType:
          type: string
          enum:
          - classroom
          - laboratory
          - hall
          - exam_hall
          - library
          - other
          x-extensible-enum: true
          description: Room type.
        capacity:
          type: integer
          format: int32
          description: Seating capacity.
        defaultCourseId:
          type: string
          format: uuid
          description: Course the room is normally allotted to.
        defaultBatchId:
          type: string
          format: uuid
          description: Batch the room is normally allotted to.
        defaultClassSectionId:
          type: string
          format: uuid
          description: Class section the room is normally allotted to.
        isActive:
          type: boolean
          description: Whether usable.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - institutionId
      - code
      - name
      - capacity
    RoomUpdate:
      type: object
      description: Fields of Room that can be updated (partial update; see updateMask).
      properties:
        institutionId:
          type: string
          format: uuid
          description: Institution.
        code:
          type: string
          maxLength: 30
          description: Room code.
        name:
          type: string
          maxLength: 120
          description: Room name.
        roomType:
          type: string
          enum:
          - classroom
          - laboratory
          - hall
          - exam_hall
          - library
          - other
          x-extensible-enum: true
          description: Room type.
        capacity:
          type: integer
          format: int32
          description: Seating capacity.
        defaultCourseId:
          type: string
          format: uuid
          description: Course the room is normally allotted to.
        defaultBatchId:
          type: string
          format: uuid
          description: Batch the room is normally allotted to.
        defaultClassSectionId:
          type: string
          format: uuid
          description: Class section the room is normally allotted to.
        isActive:
          type: boolean
          description: Whether usable.
    RoomList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Room'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    RoomFacility:
      type: object
      description: Facility available in a room and its quantity.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        roomId:
          type: string
          format: uuid
          description: Room.
          readOnly: true
        facilityId:
          type: string
          format: uuid
          description: Facility.
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d+(\.\d+)?$
          description: Quantity.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - facilityId
      - quantity
    RoomFacilityUpdate:
      type: object
      description: Fields of RoomFacility that can be updated (partial update; see updateMask).
      properties:
        facilityId:
          type: string
          format: uuid
          description: Facility.
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d+(\.\d+)?$
          description: Quantity.
    RoomFacilityList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomFacility'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    AssetItem:
      type: object
