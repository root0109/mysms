      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageTemplate'
      responses:
        '200':
          description: validateOnly — every check ran and nothing was persisted; the would-be resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplate'
        '201':
          description: Created
          headers:
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
            Location:
              description: URL of the new resource.
