openapi: 3.1.0
info:
  title: MySMS API — Communication & Community
  version: 1.0.0
  description: Message templates, outbound notifications/reminders, internal mailbox, in-app notifications, notices, events, magazines, chat, feedback threads, groups, tasks, class pages and social posts.
  license:
    name: Proprietary
    identifier: LicenseRef-MySMS
  contact:
    name: MySMS API team
    email: api@mysms.example
servers:
- url: https://api.mysms.example
  description: Production (replace with your domain)
security:
- bearerAuth: []
tags:
- name: AudienceGroup
  description: AudienceGroup aggregate.
- name: CalendarExport
  description: CalendarExport aggregate.
- name: ClassPage
  description: ClassPage aggregate.
- name: CommentReaction
  description: CommentReaction aggregate.
- name: ContentView
  description: ContentView aggregate.
- name: Conversation
  description: Conversation aggregate.
- name: Event
  description: Event aggregate.
- name: FeedbackThread
  description: FeedbackThread aggregate.
- name: InAppNotification
  description: InAppNotification aggregate.
- name: Magazine
  description: Magazine aggregate.
- name: MailboxMessage
  description: MailboxMessage aggregate.
- name: MessageTemplate
  description: MessageTemplate aggregate.
- name: Notice
  description: Notice aggregate.
- name: NoticeBackground
  description: NoticeBackground aggregate.
- name: NotificationChannel
  description: NotificationChannel aggregate.
- name: NotificationPreferenceSet
  description: NotificationPreferenceSet aggregate.
- name: NotificationType
  description: NotificationType aggregate.
- name: OutboundMessage
  description: OutboundMessage aggregate.
- name: PageCategory
  description: PageCategory aggregate.
- name: Post
  description: Post aggregate.
- name: Task
  description: Task aggregate.
- name: Operation
  description: Long-running operations started in this module (reports, imports, exports, bulk generation); poll until done.
