components:
  schemas:
    MessageTemplate:
      type: object
      description: Reusable message template for e-mail, SMS, push or in-app messages.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        institutionId:
          type: string
          format: uuid
          description: Institution (NULL = tenant-wide).
        channel:
          type: string
          enum:
          - email
          - sms
          - push
          - in_app
          x-extensible-enum: true
          description: Delivery channel.
        code:
          type: string
          maxLength: 80
          description: Template key used by the application.
        name:
          type: string
          maxLength: 150
          description: Template name.
        subject:
          type: string
          description: Subject (e-mail).
        body:
          type: string
          description: Body with placeholders.
        externalTemplateId:
          type: string
          maxLength: 80
          description: External provider-registered template id (e.g. SMS DLT template id).
        isActive:
          type: boolean
          description: Whether usable.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - channel
      - name
    MessageTemplateUpdate:
      type: object
      description: Fields of MessageTemplate that can be updated (partial update; see updateMask).
      properties:
        institutionId:
          type: string
          format: uuid
          description: Institution (NULL = tenant-wide).
        channel:
          type: string
          enum:
          - email
          - sms
          - push
          - in_app
          x-extensible-enum: true
          description: Delivery channel.
        code:
          type: string
          maxLength: 80
          description: Template key used by the application.
        name:
          type: string
          maxLength: 150
          description: Template name.
        subject:
          type: string
          description: Subject (e-mail).
        body:
          type: string
          description: Body with placeholders.
        externalTemplateId:
          type: string
          maxLength: 80
          description: External provider-registered template id (e.g. SMS DLT template id).
        isActive:
          type: boolean
          description: Whether usable.
    MessageTemplateList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageTemplate'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    OutboundMessage:
      type: object
      description: Queued SMS / e-mail / push message (notifications, reminders, broadcasts) and its delivery state.
      properties:
        templateParams:
          type: array
          items:
            type: string
          description: Ordered values for provider-side SMS/WhatsApp templates.
          readOnly: true
        actionUrl:
          type: string
          description: Deep link the message points at.
          readOnly: true
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        institutionId:
          type: string
          format: uuid
          description: Institution.
        academicYearId:
          type: string
          format: uuid
          description: Academic year.
        messageKind:
          type: string
          enum:
          - notification
          - reminder
          - broadcast
          x-extensible-enum: true
          description: Kind.
        channel:
          type: string
          enum:
          - sms
          - email
          - push
          - web_push
          x-extensible-enum: true
          description: Channel.
