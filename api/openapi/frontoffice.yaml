          type: string
          format: uuid
          description: Student visited.
        relationToStudent:
          type: string
          maxLength: 60
          description: Relation to that student.
        relatedPersonName:
          type: string
          maxLength: 150
          description: Name of the related person.
        visitorCount:
          type: integer
          format: int32
          description: Number of visitors.
        purpose:
          type: string
          maxLength: 255
          description: Purpose.
        hostStaffId:
          type: string
          format: uuid
          description: Staff member met.
        visitDate:
          type: string
          format: date
          description: Date.
        entryTime:
          type: string
          format: time
          pattern: ^\d{2}:\d{2}(:\d{2})?$
          description: Entry time.
        exitTime:
          type: string
          format: time
          pattern: ^\d{2}:\d{2}(:\d{2})?$
          description: Exit time.
