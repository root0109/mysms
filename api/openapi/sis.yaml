- name: SubjectRegistration
  description: SubjectRegistration aggregate.
- name: StudentLeaveRequest
  description: StudentLeaveRequest aggregate.
- name: Operation
  description: Long-running operations started in this module (reports, imports, exports, bulk generation); poll until done.
