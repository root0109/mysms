components:
  schemas:
    StudentLeaveRequest:
      type: object
      description: Leave requested for a student (by a guardian or staff), approved by staff; approved leave explains absences in attendance.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        studentId:
          type: string
          format: uuid
          description: Student the leave is for.
        academicYearId:
          type: string
          format: uuid
          description: Academic year the leave falls in.
        fromDate:
          type: string
          format: date
          description: First day of leave.
        toDate:
          type: string
          format: date
          description: Last day of leave.
        dayPart:
          type: string
          enum:
          - full_day
          - first_half
          - second_half
          x-extensible-enum: true
          description: Which part of the day.
        reason:
          type: string
          maxLength: 500
          description: Stated reason.
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - cancelled
          x-extensible-enum: true
          description: Changed by the decide ops.
          readOnly: true
        requestedByUserId:
          type: string
          format: uuid
          description: User who filed the request.
          readOnly: true
        decidedByUserId:
          type: string
          format: uuid
          description: Staff user who decided it.
          readOnly: true
        decidedAt:
          type: string
          format: date-time
          description: When it was decided.
          readOnly: true
        decisionNote:
          type: string
          maxLength: 300
          description: Note recorded with the decision.
          readOnly: true
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - studentId
      - fromDate
      - toDate
    StudentLeaveRequestUpdate:
      type: object
      description: Fields of StudentLeaveRequest that can be updated (partial update; see updateMask).
      properties:
        studentId:
          type: string
          format: uuid
          description: Student the leave is for.
        academicYearId:
          type: string
          format: uuid
          description: Academic year the leave falls in.
        fromDate:
          type: string
          format: date
          description: First day of leave.
        toDate:
          type: string
          format: date
          description: Last day of leave.
        dayPart:
          type: string
          enum:
          - full_day
          - first_half
          - second_half
          x-extensible-enum: true
          description: Which part of the day.
        reason:
          type: string
          maxLength: 500
          description: Stated reason.
    StudentLeaveRequestList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StudentLeaveRequest'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    StudentCategory:
      type: object
      description: Student category for fees/quotas (e.g. General, Staff Ward, Scholarship).
      properties:
        sortOrder:
          type: integer
          format: int32
          description: Display order.
        isActive:
          type: boolean
          description: Whether offered for new picks.
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        institutionId:
          type: string
          format: uuid
          description: Institution.
        code:
          type: string
          maxLength: 30
          description: Category code.
        name:
          type: string
          maxLength: 120
          description: Category name.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - institutionId
      - code
      - name
    StudentCategoryUpdate:
      type: object
      description: Fields of StudentCategory that can be updated (partial update; see updateMask).
      properties:
        sortOrder:
          type: integer
          format: int32
          description: Display order.
        isActive:
          type: boolean
          description: Whether offered for new picks.
        institutionId:
          type: string
          format: uuid
          description: Institution.
        code:
          type: string
          maxLength: 30
          description: Category code.
        name:
          type: string
          maxLength: 120
          description: Category name.
    StudentCategoryList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StudentCategory'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    Student:
      type: object
      description: A student of an institution. One row per person per institution.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        personId:
          type: string
          format: uuid
          description: Person.
        userId:
          type: string
          format: uuid
          description: Student login account.
        institutionId:
          type: string
          format: uuid
          description: Institution.
        admissionNumber:
          type: string
          maxLength: 30
          description: Admission / registration number.
        admissionDate:
          type: string
          format: date
          description: Date of admission.
        joiningDate:
          type: string
          format: date
          description: First attendance date.
        studentCategoryId:
          type: string
          format: uuid
          description: Category.
        governmentStudentId:
          type: string
          maxLength: 40
          description: External government education-registry id (e.g. EMIS/UDISE+ PEN).
        bonafideCertificateNumber:
          type: string
          maxLength: 40
          description: Number of the last bonafide certificate issued.
        status:
          type: string
          enum:
          - active
          - inactive
          - alumni
          - withdrawn
          - transferred
