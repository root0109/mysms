      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAccount'
      responses:
        '200':
          description: validateOnly — every check ran and nothing was persisted; the would-be resource.
          content:
            application/json:
              schema:
