          type: boolean
          description: A second factor must be completed before tokens are usable.
        mfaToken:
          type: string
          description: Short-lived token to pass to iam.CompleteMfa together with the code. Present only when mfaRequired is true.
    Me:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserAccount'
        person:
          $ref: ./people.yaml#/components/schemas/Person
        roles:
          type: array
          items:
            $ref: ./common.yaml#/components/schemas/RoleGrant
          description: Role grants with scope.
        permissions:
          type: array
          items:
            type: string
            description: Effective permission codes.
          description: Effective permission codes.
        institutions:
          type: array
          items:
            $ref: ./org.yaml#/components/schemas/Institution
          description: Institutions the user can act in.
        studentIds:
          type: array
          items:
            type: string
            format: uuid
            description: Student records of this person.
          description: Student records of this person.
        staffIds:
          type: array
          items:
            type: string
            format: uuid
            description: Staff records of this person.
          description: Staff records of this person.
        guardianId:
          type: string
          format: uuid
          description: Guardian record of this person.
        activeRole:
          $ref: ./common.yaml#/components/schemas/RoleGrant
      required:
      - user
    ApiTokenCreated:
      type: object
      properties:
        token:
          type: string
          description: The secret token. Returned only in this response; store it securely.
        authToken:
          $ref: '#/components/schemas/AuthToken'
      required:
      - token
      - authToken
    SwitchRoleResult:
      type: object
      properties:
        tokens:
          $ref: ./common.yaml#/components/schemas/TokenPair
        me:
          $ref: '#/components/schemas/Me'
      required:
      - tokens
      - me
    RecoveryCodes:
      type: object
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
          description: One-time recovery codes; shown once.
    RegenerateRecoveryCodesRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 12
          description: Current TOTP/OTP or a recovery code.
      required:
      - code
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 / OIDC access token. Claims carry tenant_id, user_id, roles and an optional act-as (impersonation) subject.
    platformAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token of MySMS platform staff (audience mysms-platform-admin, MFA required). Only these operations may act across tenants; the target tenant is the resource being addressed.
