openapi: 3.1.0
info:
  title: MySMS API — Identity & Access
  version: 1.0.0
  description: Login accounts, roles, permissions, scoped role grants, tokens and devices. A person (people.person) may own one account per tenant.
  license:
    name: Proprietary
    identifier: LicenseRef-MySMS
  contact:
    name: MySMS API team
    email: api@mysms.example
servers:
- url: https://api.mysms.example
  description: Production (replace with your domain)
security:
- bearerAuth: []
tags:
- name: Auth
  description: Sign-in, tokens, MFA and session operations.
- name: Permission
  description: Permission aggregate.
- name: Role
  description: Role aggregate.
- name: UserAccount
  description: UserAccount aggregate.
- name: Operation
  description: Long-running operations started in this module (reports, imports, exports, bulk generation); poll until done.
- name: SettingDefinition
  description: SettingDefinition catalogue.
- name: SettingValue
  description: SettingValue aggregate.
paths:
