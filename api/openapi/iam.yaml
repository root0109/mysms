        '409':
          $ref: ./common.yaml#/components/responses/409
        '412':
          $ref: ./common.yaml#/components/responses/412
        '428':
          $ref: ./common.yaml#/components/responses/428
        '500':
          $ref: ./common.yaml#/components/responses/500
  /v1/iam/me/settings:
    get:
      operationId: iam.ListMySettings
      summary: The caller's effective settings
      description: Every setting with the caller's effective value, its source scope and whether it is locked (user > class section > primary department > institution > tenant > default; a lock at a broader scope wins). Settings users may not change are included only for callers who administer settings at one of their allowed scopes, and sourceScopeId only for tenant-wide administrators or the caller's own values.
      tags:
      - UserAccount
      security:
      - bearerAuth: []
      x-permission: iam.setting.read_mine
      x-grpc:
        service: mysms.iam.v1.UserAccountService
        method: ListMySettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveSettingList'
        '400':
          $ref: ./common.yaml#/components/responses/400
        '401':
          $ref: ./common.yaml#/components/responses/401
        '403':
          $ref: ./common.yaml#/components/responses/403
        '404':
          $ref: ./common.yaml#/components/responses/404
        '409':
          $ref: ./common.yaml#/components/responses/409
        '422':
          $ref: ./common.yaml#/components/responses/422
        '429':
          $ref: ./common.yaml#/components/responses/429
        '500':
          $ref: ./common.yaml#/components/responses/500
  /v1/iam/me/settings/{settingKey}:
    put:
      operationId: iam.SetMySetting
      summary: Set one of the caller's own settings
      description: Sets the caller's user-level value. Rejected with 409 when a broader scope locks the setting and 422 when the value does not fit the setting or the setting is not user-editable.
      tags:
      - UserAccount
      security:
      - bearerAuth: []
      x-permission: iam.setting.update_mine
      x-grpc:
        service: mysms.iam.v1.UserAccountService
        method: SetMySetting
      parameters:
      - name: settingKey
        in: path
        required: true
        description: The setting.
        schema:
          type: string
          maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMySettingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveSetting'
        '400':
          $ref: ./common.yaml#/components/responses/400
        '401':
          $ref: ./common.yaml#/components/responses/401
        '403':
          $ref: ./common.yaml#/components/responses/403
        '404':
          $ref: ./common.yaml#/components/responses/404
        '409':
          $ref: ./common.yaml#/components/responses/409
        '422':
          $ref: ./common.yaml#/components/responses/422
        '429':
          $ref: ./common.yaml#/components/responses/429
        '500':
          $ref: ./common.yaml#/components/responses/500
    delete:
      operationId: iam.ResetMySetting
      summary: Reset one of the caller's own settings
      description: Removes the caller's user-level value, so the broader scopes apply again.
      tags:
      - UserAccount
      security:
      - bearerAuth: []
      x-permission: iam.setting.update_mine
      x-grpc:
        service: mysms.iam.v1.UserAccountService
        method: ResetMySetting
      parameters:
      - name: settingKey
        in: path
        required: true
        description: The setting.
        schema:
          type: string
          maxLength: 100
      responses:
        '204':
          description: Reset; the broader scopes apply.
        '400':
          $ref: ./common.yaml#/components/responses/400
        '401':
          $ref: ./common.yaml#/components/responses/401
        '403':
          $ref: ./common.yaml#/components/responses/403
        '404':
          $ref: ./common.yaml#/components/responses/404
        '409':
          $ref: ./common.yaml#/components/responses/409
        '422':
          $ref: ./common.yaml#/components/responses/422
        '429':
          $ref: ./common.yaml#/components/responses/429
        '500':
          $ref: ./common.yaml#/components/responses/500
components:
  schemas:
    SetMySettingRequest:
      type: object
      description: The caller's own value for a setting.
      required: [value]
      properties:
        value:
          type: string
          maxLength: 500
          description: The value, as text in the setting's type.
    EffectiveSettingList:
      type: object
      description: The caller's effective settings.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveSetting'
    EffectiveSetting:
      type: object
      description: The caller's effective value of one setting and where it comes from.
      required: [settingKey, value, sourceScope, locked, userEditable]
      properties:
        settingKey:
          type: string
          maxLength: 100
          description: The setting.
        value:
          type: string
          maxLength: 500
          description: Effective value.
        sourceScope:
          type: string
          enum: [default, tenant, institution, department, class_section, user]
          description: Level the value comes from.
        sourceScopeId:
          type: string
          format: uuid
          description: Institution, department, class section or user the value comes from.
        locked:
          type: boolean
          description: A broader scope locked the value; the caller cannot change it.
        userEditable:
          type: boolean
          description: The caller may set this setting for themselves (when not locked).
    SettingValue:
      type: object
      description: 'A setting''s value at one scope. Effective value for a user: the most specific of user > class section > primary department > institution > tenant > default, unless a broader scope locks it.'
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        scopeType:
          type: string
          enum:
          - tenant
          - institution
          - department
          - class_section
          - user
          x-extensible-enum: true
          description: Level the value applies to.
        scopeId:
          type: string
          format: uuid
          description: Institution, department, class section or user account the value applies to; absent for tenant.
        settingKey:
          type: string
          maxLength: 100
          description: The setting (SettingDefinition.settingKey).
        value:
          type: string
          maxLength: 500
          description: The value, as text in the setting's type.
        isLocked:
          type: boolean
          description: Narrower scopes (and users) cannot override it.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - scopeType
      - settingKey
      - value
    SettingValueUpdate:
      type: object
      description: Fields of SettingValue that can be updated (partial update; see updateMask).
      properties:
        value:
          type: string
          maxLength: 500
          description: The value, as text in the setting's type.
        isLocked:
          type: boolean
          description: Narrower scopes (and users) cannot override it.
    SettingValueList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SettingValue'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    SettingDefinition:
      type: object
      description: 'A setting the product offers (theme, density, language...), with its type, allowed values, default, the scopes it may be set at and whether users may change it themselves. Product catalogue: read-only through the API.'
      properties:
        allowedValues:
          type: array
          items:
            type: string
          description: Allowed values of a choice setting.
          readOnly: true
        allowedScopes:
          type: array
          items:
            type: string
            enum: [tenant, institution, department, class_section, user]
          description: Scopes at which a value may be set.
          readOnly: true
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        settingKey:
          type: string
          maxLength: 100
          description: Stable key, e.g. ui.theme.
          readOnly: true
        category:
          type: string
          maxLength: 60
          description: Grouping on the settings screens, e.g. appearance.
          readOnly: true
        valueType:
          type: string
          enum:
          - string
          - boolean
          - integer
          - choice
          x-extensible-enum: true
          description: Type of the value.
          readOnly: true
        defaultValue:
          type: string
          maxLength: 500
          description: Value when no scope sets one.
          readOnly: true
        minValue:
          type: integer
          format: int32
          description: Smallest allowed value (integer settings).
          readOnly: true
        maxValue:
          type: integer
          format: int32
          description: Largest allowed value (integer settings).
          readOnly: true
        userEditable:
          type: boolean
          description: Whether users may set it for themselves.
          readOnly: true
        description:
          type: string
          description: What the setting changes.
          readOnly: true
        sortOrder:
          type: integer
          format: int32
          description: Display order within its category.
          readOnly: true
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - settingKey
      - valueType
    SettingDefinitionList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SettingDefinition'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    MfaCredential:
      type: object
      description: One enrolled second factor (no secret material).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        credentialType:
          type: string
          enum: [totp, sms, email, recovery_codes]
          x-extensible-enum: true
          description: Factor kind.
          readOnly: true
        label:
          type: string
          description: User-facing label (device name, phone tail).
          readOnly: true
        verifiedAt:
          type: string
          format: date-time
          description: When enrollment was proven with a valid code.
          readOnly: true
        lastUsedAt:
          type: string
          format: date-time
          description: Last successful use.
          readOnly: true
        isActive:
          type: boolean
          description: Whether usable at sign-in.
          readOnly: true
    MfaCredentialList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MfaCredential'
    EnrollMfaRequest:
      type: object
      properties:
        credentialType:
          type: string
          enum: [totp, sms, email]
          x-extensible-enum: true
          description: Factor kind to enroll.
        label:
          type: string
          maxLength: 100
          description: User-facing label (device name, phone tail).
        target:
          type: string
          maxLength: 150
          description: Phone number or e-mail for OTP factors.
      required:
      - credentialType
    MfaEnrollment:
      type: object
      description: Enrollment material. The secret appears only once, here.
      properties:
        mfaToken:
          type: string
          description: Short-lived token to pass to iam.CompleteMfa with the first valid code, which verifies the enrollment.
        mfaCredentialId:
          type: string
          format: uuid
          description: Credential being enrolled.
        secret:
          type: string
          description: TOTP shared secret (base32), present for totp only; shown once.
        otpauthUrl:
          type: string
          description: otpauth:// URL for authenticator apps, present for totp only.
        recoveryCodes:
          type: array
          items:
            type: string
          description: One-time recovery codes; shown once.
      required:
      - mfaCredentialId
    CompleteMfaRequest:
      type: object
      properties:
        mfaToken:
          type: string
          description: Token from Login (or from EnrollMfa verification).
        code:
          type: string
          maxLength: 12
          description: Current TOTP/OTP or a recovery code.
      required:
      - mfaToken
      - code
    DisableMfaRequest:
      type: object
      properties:
        mfaCredentialId:
          type: string
          format: uuid
          description: Credential to disable.
        code:
          type: string
          maxLength: 12
          description: Current code or recovery code proving possession.
      required:
      - mfaCredentialId
      - code
    UserAccount:
      type: object
      description: A login account. Holds credentials and verification state only; personal data lives in people.person.
      properties:
        userType:
          type: string
          enum: [admin, teacher, student, guardian, staff, librarian, accountant, alumni]
          x-extensible-enum: true
          description: 'Default persona hint used for routing after login. Never used for authorisation: permissions come only from roles.'
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        personId:
          type: string
          format: uuid
          description: Person this account belongs to (NULL for service accounts).
        username:
          type: string
          maxLength: 150
          description: Login name, unique per tenant ignoring case (optional when the user logs in by e-mail or mobile).
        email:
          type: string
          maxLength: 320
          description: Login / notification e-mail, unique per tenant ignoring case.
        mobileNo:
          type: string
          maxLength: 20
          description: Login / notification mobile number.
        status:
          type: string
          enum:
          - active
          - inactive
          - locked
          - exited
          x-extensible-enum: true
          description: Account state. Changed only through the workflow operations.
          readOnly: true
        emailVerifiedAt:
          type: string
          format: date-time
          description: When the e-mail was verified.
          readOnly: true
        mobileVerifiedAt:
          type: string
          format: date-time
          description: When the mobile number was verified.
          readOnly: true
        mustResetPassword:
          type: boolean
          description: Force a password change at next login.
          readOnly: true
        referredByUserId:
          type: string
          format: uuid
          description: Account that created / referred this account.
        termsAcceptedAt:
          type: string
          format: date-time
          description: When the user accepted the terms of use.
          readOnly: true
        locale:
          type: string
          maxLength: 10
          description: Preferred UI locale.
        timezone:
          type: string
          maxLength: 64
          description: Preferred time zone.
        lastLoginAt:
          type: string
          format: date-time
          description: Last successful login.
          readOnly: true
        accountExpiresAt:
          type: string
          format: date-time
          description: Account stops working after this time (fixed-term students, guests).
        failedLoginCount:
          type: integer
          format: int32
          description: Consecutive failed sign-ins (lock-out after the configured limit).
          readOnly: true
        lastLoginRoleId:
          type: string
          format: uuid
          description: Role the user last worked in (restored at next sign-in).
          readOnly: true
        registeredAt:
          type: string
          format: date-time
          description: Self-registration time.
          readOnly: true
        joinedOn:
          type: string
          format: date
          description: Date the user joined the institution.
        externalRef:
          type: string
          maxLength: 100
          description: External system reference (SIS / HR integration key).
        signature:
          type: string
          description: Signature appended to discussion posts.
        useSignature:
          type: boolean
          description: Append the signature by default.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - username
    UserAccountUpdate:
      type: object
      description: Fields of UserAccount that can be updated (partial update; see updateMask).
      properties:
        userType:
          type: string
          enum: [admin, teacher, student, guardian, staff, librarian, accountant, alumni]
          x-extensible-enum: true
          description: 'Default persona hint used for routing after login. Never used for authorisation: permissions come only from roles.'
        personId:
          type: string
          format: uuid
          description: Person this account belongs to (NULL for service accounts).
        username:
          type: string
          maxLength: 150
          description: Login name, unique per tenant ignoring case (optional when the user logs in by e-mail or mobile).
        email:
          type: string
          maxLength: 320
          description: Login / notification e-mail, unique per tenant ignoring case.
        mobileNo:
          type: string
          maxLength: 20
          description: Login / notification mobile number.
        referredByUserId:
          type: string
          format: uuid
          description: Account that created / referred this account.
        locale:
          type: string
          maxLength: 10
          description: Preferred UI locale.
        timezone:
          type: string
          maxLength: 64
          description: Preferred time zone.
        joinedOn:
          type: string
          format: date
          description: Date the user joined the institution.
        externalRef:
          type: string
          maxLength: 100
          description: External system reference (SIS / HR integration key).
        signature:
          type: string
          description: Signature appended to discussion posts.
        useSignature:
          type: boolean
          description: Append the signature by default.
    UserAccountList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserAccount'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    Role:
      type: object
      description: Named set of permissions. NULL tenant = platform-defined role available to every tenant.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        code:
          type: string
          maxLength: 80
          description: Role code, e.g. principal, class_teacher, lms_course_creator, lms_evaluator.
        displayName:
          type: string
          maxLength: 120
          description: Display name.
        description:
          type: string
          description: Purpose of the role.
        isSystem:
          type: boolean
          description: Platform-managed role that tenants cannot edit.
        isActive:
          type: boolean
          description: Role can be granted.
        authorityLevel:
          type: integer
          format: int32
          description: Rank used to decide which roles a user may grant or manage (lower = more authority).
        parentRoleId:
          type: string
          format: uuid
          description: Parent role (inherits its permissions).
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - code
    RoleUpdate:
      type: object
      description: Fields of Role that can be updated (partial update; see updateMask).
      properties:
        code:
          type: string
          maxLength: 80
          description: Role code, e.g. principal, class_teacher, lms_course_creator, lms_evaluator.
        displayName:
          type: string
          maxLength: 120
          description: Display name.
        description:
          type: string
          description: Purpose of the role.
        isSystem:
          type: boolean
          description: Platform-managed role that tenants cannot edit.
        isActive:
          type: boolean
          description: Role can be granted.
        authorityLevel:
          type: integer
          format: int32
          description: Rank used to decide which roles a user may grant or manage (lower = more authority).
        parentRoleId:
          type: string
          format: uuid
          description: Parent role (inherits its permissions).
    RoleList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    Permission:
      type: object
      description: Atomic permission checked by the application.
      properties:
        id:
