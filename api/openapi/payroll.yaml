        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        code:
          type: string
          maxLength: 40
          description: Component key used in formulas.
        name:
          type: string
          maxLength: 120
          description: Component name.
        componentType:
          type: string
          enum:
          - earning
