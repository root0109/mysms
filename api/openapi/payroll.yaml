components:
  schemas:
    StaffBankAccount:
      type: object
      description: Bank account salary is paid into. The account number is write-only and displayed masked.
      properties:
        accountNumber:
          type: string
          writeOnly: true
          description: Account number; stored encrypted, never returned.
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        staffId:
          type: string
          format: uuid
          description: Staff member.
        accountHolderName:
          type: string
          maxLength: 200
          description: Name on the account.
        accountNumberMasked:
          type: string
          maxLength: 20
          description: Masked display form (last 4).
          readOnly: true
        ifscCode:
          type: string
          maxLength: 20
          description: Bank routing code.
        bankName:
          type: string
          maxLength: 120
          description: Bank.
        branchName:
          type: string
          maxLength: 150
          description: Branch.
        isPrimary:
          type: boolean
          description: Account currently used for disbursement.
        isActive:
          type: boolean
          description: Whether usable.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - staffId
      - accountHolderName
    StaffBankAccountUpdate:
      type: object
      description: Fields of StaffBankAccount that can be updated (partial update; see updateMask).
      properties:
        accountNumber:
          type: string
          writeOnly: true
          description: Account number; stored encrypted, never returned.
        staffId:
          type: string
          format: uuid
          description: Staff member.
        accountHolderName:
          type: string
          maxLength: 200
          description: Name on the account.
        ifscCode:
          type: string
          maxLength: 20
          description: Bank routing code.
        bankName:
          type: string
          maxLength: 120
          description: Bank.
        branchName:
          type: string
          maxLength: 150
          description: Branch.
        isPrimary:
          type: boolean
          description: Account currently used for disbursement.
        isActive:
          type: boolean
          description: Whether usable.
    StaffBankAccountList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffBankAccount'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    PayComponent:
      type: object
      description: Earning or deduction component (Basic, HRA, PF...).
