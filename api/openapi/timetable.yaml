openapi: 3.1.0
info:
  title: MySMS API — Timetable
  version: 1.0.0
  description: Period definitions and scheduled teaching sessions.
  license:
    name: Proprietary
    identifier: LicenseRef-MySMS
  contact:
    name: MySMS API team
    email: api@mysms.example
servers:
- url: https://api.mysms.example
  description: Production (replace with your domain)
security:
- bearerAuth: []
tags:
- name: Period
  description: Period aggregate.
- name: Session
  description: Session aggregate.
- name: Operation
  description: Long-running operations started in this module (reports, imports, exports, bulk generation); poll until done.
paths:
  /v1/timetable/periods:
