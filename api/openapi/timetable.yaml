components:
  schemas:
    Period:
      type: object
      description: Named teaching period with a start time and duration.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        institutionId:
          type: string
          format: uuid
          description: Institution.
        name:
          type: string
          maxLength: 60
          description: Period name.
        startTime:
          type: string
          format: time
          pattern: ^\d{2}:\d{2}(:\d{2})?$
          description: Start time.
        durationMinutes:
          type: string
          format: decimal
          pattern: ^-?\d+(\.\d+)?$
          description: Duration in minutes.
        sequence:
          type: integer
          format: int32
          description: Order in the day.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - institutionId
      - name
      - startTime
    PeriodUpdate:
      type: object
      description: Fields of Period that can be updated (partial update; see updateMask).
      properties:
        institutionId:
          type: string
          format: uuid
          description: Institution.
        name:
          type: string
          maxLength: 60
          description: Period name.
        startTime:
          type: string
          format: time
          pattern: ^\d{2}:\d{2}(:\d{2})?$
          description: Start time.
        durationMinutes:
          type: string
          format: decimal
          pattern: ^-?\d+(\.\d+)?$
          description: Duration in minutes.
        sequence:
          type: integer
          format: int32
          description: Order in the day.
    PeriodList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Period'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    Session:
      type: object
      description: Scheduled teaching session (one class meeting).
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        institutionId:
          type: string
          format: uuid
          description: Institution.
        periodId:
          type: string
          format: uuid
          description: Period.
        startAt:
          type: string
          format: date-time
          description: Start.
        endAt:
          type: string
          format: date-time
          description: End.
        weekday:
          type: integer
          format: int32
          description: ISO weekday (1 = Monday).
        classSectionId:
          type: string
          format: uuid
          description: Class section (K-12).
        courseId:
          type: string
          format: uuid
          description: Course (higher education).
        batchId:
          type: string
          format: uuid
          description: Batch (higher education).
        subjectId:
          type: string
          format: uuid
          description: Subject taught.
        staffId:
          type: string
          format: uuid
          description: Teacher.
        roomId:
          type: string
          format: uuid
          description: Room.
        title:
          type: string
          maxLength: 150
          description: Display title.
        sessionType:
          type: string
          maxLength: 30
          description: Session type (lecture, lab, tutorial...).
        color:
          type: integer
          format: int32
          description: Calendar colour index.
        status:
          type: string
          enum:
          - draft
          - confirmed
          - done
          - cancelled
          x-extensible-enum: true
          description: Session state. Changed only through the workflow operations.
          readOnly: true
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - institutionId
      - startAt
      - endAt
      - subjectId
      - staffId
    SessionUpdate:
