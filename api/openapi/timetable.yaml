      operationId: timetable.ListPeriods
      summary: List Periods
      description: List Periods visible to the caller, with cursor pagination, filtering and ordering.
      tags:
      - Period
      security:
      - bearerAuth: []
      x-permission: timetable.period.read
      x-grpc:
        service: mysms.timetable.v1.PeriodService
        method: ListPeriods
      parameters:
      - $ref: ./common.yaml#/components/parameters/PageSize
      - $ref: ./common.yaml#/components/parameters/PageToken
      - $ref: ./common.yaml#/components/parameters/Filter
      - $ref: ./common.yaml#/components/parameters/OrderBy
      - $ref: ./common.yaml#/components/parameters/ReadMask
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodList'
        '400':
          $ref: ./common.yaml#/components/responses/400
        '401':
          $ref: ./common.yaml#/components/responses/401
        '403':
          $ref: ./common.yaml#/components/responses/403
