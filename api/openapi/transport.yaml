components:
  schemas:
    Route:
      type: object
      description: Transport route served by a vehicle.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        institutionId:
          type: string
          format: uuid
          description: Institution.
        academicYearId:
          type: string
          format: uuid
          description: Year the route runs.
        name:
          type: string
          maxLength: 120
          description: Route name.
        vehicleNumber:
          type: string
          maxLength: 30
          description: Vehicle registration number.
        startTime:
          type: string
          format: time
          pattern: ^\d{2}:\d{2}(:\d{2})?$
          description: Departure time.
        endTime:
          type: string
          format: time
          pattern: ^\d{2}:\d{2}(:\d{2})?$
          description: Arrival time.
        isActive:
          type: boolean
          description: Whether running.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
