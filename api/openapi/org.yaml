openapi: 3.1.0
info:
  title: MySMS API — Organisation & Calendar
  version: 1.0.0
  description: Institutions (schools, colleges, campuses), their departments, academic years and terms.
  license:
    name: Proprietary
    identifier: LicenseRef-MySMS
  contact:
    name: MySMS API team
    email: api@mysms.example
servers:
- url: https://api.mysms.example
  description: Production (replace with your domain)
security:
- bearerAuth: []
tags:
- name: AcademicYear
  description: AcademicYear aggregate.
- name: AttributeDefinition
  description: AttributeDefinition aggregate.
- name: Department
  description: Department aggregate.
- name: Holiday
  description: Holiday aggregate.
- name: Institution
  description: Institution aggregate.
- name: InstitutionType
  description: InstitutionType aggregate.
paths:
  /v1/org/institutions:
    get:
      operationId: org.ListInstitutions
      summary: List Institutions
      description: List Institutions visible to the caller, page by page, with filtering and sorting.
      tags:
      - Institution
      security:
      - bearerAuth: []
      x-permission: org.institution.read
      x-grpc:
        service: mysms.org.v1.InstitutionService
        method: ListInstitutions
      parameters:
      - $ref: ./common.yaml#/components/parameters/Page
      - $ref: ./common.yaml#/components/parameters/Size
      - $ref: ./common.yaml#/components/parameters/Cursor
      - $ref: ./common.yaml#/components/parameters/Filter
      - $ref: ./common.yaml#/components/parameters/Sort
      - $ref: ./common.yaml#/components/parameters/ReadMask
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingInfoInstitution'
        '400':
          $ref: ./common.yaml#/components/responses/400
        '401':
          $ref: ./common.yaml#/components/responses/401
        '403':
          $ref: ./common.yaml#/components/responses/403
        '404':
          $ref: ./common.yaml#/components/responses/404
        '429':
          $ref: ./common.yaml#/components/responses/429
        '500':
          $ref: ./common.yaml#/components/responses/500
    post:
      operationId: org.CreateInstitution
      summary: Create Institution
      description: Create a Institution. Supports Idempotency-Key and validateOnly.
      tags:
      - Institution
      security:
      - bearerAuth: []
      x-permission: org.institution.create
      x-grpc:
        service: mysms.org.v1.InstitutionService
        method: CreateInstitution
      parameters:
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      - $ref: ./common.yaml#/components/parameters/ValidateOnly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Institution'
      responses:
        '200':
          description: validateOnly — every check ran and nothing was persisted; the would-be resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institution'
        '201':
          description: Created
          headers:
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
            Location:
              description: URL of the new resource.
              schema:
