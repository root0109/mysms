components:
  schemas:
    Institution:
      type: object
      description: A school, college, campus or training centre operated by a tenant. Institutions can be nested (group → campus).
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        parentInstitutionId:
          type: string
          format: uuid
          description: Parent institution for multi-campus groups.
        code:
          type: string
          maxLength: 30
          description: Institution code, unique within the tenant.
        name:
          type: string
          maxLength: 200
          description: Institution name.
        slug:
          type: string
          maxLength: 200
          description: URL-safe name used for public pages and sub-domains.
        institutionType:
          type: string
          enum:
          - school
          - college
          - university
          - coaching_centre
          - training_centre
          x-extensible-enum: true
          description: Kind of institution.
        email:
          type: string
          maxLength: 320
          description: Official e-mail.
        phone:
          type: string
          maxLength: 20
          description: Official phone.
        addressLine1:
          type: string
          maxLength: 255
          description: Street address line 1.
        addressLine2:
          type: string
          maxLength: 255
          description: Street address line 2.
        cityId:
          type: string
          format: uuid
          description: City.
        stateProvinceId:
          type: string
          format: uuid
          description: State / province.
        countryId:
          type: string
          format: uuid
          description: Country.
        postalCode:
          type: string
          maxLength: 12
          description: Postal / PIN code.
        timezone:
          type: string
          maxLength: 64
          description: Time zone if different from the tenant.
        currencyId:
          type: string
          format: uuid
          description: Operating currency if different from the tenant.
        logoFileId:
          type: string
          format: uuid
          description: Logo image.
        signatureFileId:
          type: string
          format: uuid
          description: Authorised signatory's signature used on certificates.
        accreditation:
          type: string
          description: Accreditation statement printed on certificates.
        approvalAuthority:
          type: string
          description: Approving / affiliating authority.
        status:
          type: string
          enum:
          - active
          - inactive
          x-extensible-enum: true
          description: Institution state.
        institutionTypeId:
          type: string
          format: uuid
          description: Configurable unit type (drives which attributes are captured).
        themeId:
          type: string
          format: uuid
          description: Visual theme of the institution's portal and apps.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
