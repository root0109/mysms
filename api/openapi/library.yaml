components:
  schemas:
    MediaType:
      type: object
      description: Kind of library item (book, journal, DVD...).
      properties:
        sortOrder:
          type: integer
          format: int32
          description: Display order.
        isActive:
          type: boolean
          description: Whether offered for new picks.
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        code:
          type: string
          maxLength: 30
          description: Code.
        name:
          type: string
          maxLength: 120
          description: Name.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - code
      - name
    MediaTypeUpdate:
      type: object
      description: Fields of MediaType that can be updated (partial update; see updateMask).
      properties:
        sortOrder:
          type: integer
          format: int32
          description: Display order.
        isActive:
          type: boolean
          description: Whether offered for new picks.
        code:
          type: string
          maxLength: 30
          description: Code.
        name:
          type: string
          maxLength: 120
          description: Name.
    MediaTypeList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaType'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
