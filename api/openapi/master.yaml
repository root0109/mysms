          maxLength: 60
          description: Currency name.
        symbol:
          type: string
          maxLength: 8
          description: Display symbol.
        minorUnits:
          type: integer
          format: int32
          description: Number of decimal places.
        isActive:
          type: boolean
          description: Whether usable.
    CurrencyList:
