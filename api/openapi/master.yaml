openapi: 3.1.0
info:
  title: MySMS API — Master Data
  version: 1.0.0
  description: Global, tenant-independent master tables (geography, currency) shared by every module.
  license:
    name: Proprietary
    identifier: LicenseRef-MySMS
  contact:
    name: MySMS API team
    email: api@mysms.example
servers:
- url: https://api.mysms.example
  description: Production (replace with your domain)
security:
- bearerAuth: []
tags:
- name: City
  description: City aggregate.
- name: Country
  description: Country aggregate.
- name: Currency
  description: Currency aggregate.
- name: StateProvince
  description: StateProvince aggregate.
paths:
  /v1/master/countries:
    get:
      operationId: master.ListCountries
      summary: List Countries
      description: List Countries visible to the caller, with cursor pagination, filtering and ordering. Guests (no token) receive published rows only, with internal fields omitted (guest projection).
      tags:
      - Country
      security:
      - {}
      - bearerAuth: []
      x-permission: master.country.read
      x-grpc:
        service: mysms.master.v1.CountryService
        method: ListCountries
      parameters:
      - $ref: ./common.yaml#/components/parameters/PageSize
      - $ref: ./common.yaml#/components/parameters/PageToken
      - $ref: ./common.yaml#/components/parameters/Filter
      - $ref: ./common.yaml#/components/parameters/OrderBy
      - $ref: ./common.yaml#/components/parameters/ReadMask
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryList'
        '400':
          $ref: ./common.yaml#/components/responses/400
        '401':
          $ref: ./common.yaml#/components/responses/401
        '403':
          $ref: ./common.yaml#/components/responses/403
        '404':
          $ref: ./common.yaml#/components/responses/404
        '429':
          $ref: ./common.yaml#/components/responses/429
        '500':
          $ref: ./common.yaml#/components/responses/500
    post:
      operationId: master.CreateCountry
      summary: Create Country
      description: Create a Country. Supports validateOnly. Master data is global and has no idempotency store; a retried create is detected by the unique natural key and answered with 409.
      tags:
      - Country
      security:
      - platformAdminAuth: []
      x-permission: master.country.create
      x-grpc:
        service: mysms.master.v1.CountryService
        method: CreateCountry
      parameters:
      - $ref: ./common.yaml#/components/parameters/ValidateOnly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Country'
      responses:
        '200':
          description: validateOnly — every check ran and nothing was persisted; the would-be resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
        '201':
          description: Created
          headers:
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
            Location:
              description: URL of the new resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
        '400':
          $ref: ./common.yaml#/components/responses/400
        '401':
          $ref: ./common.yaml#/components/responses/401
        '403':
          $ref: ./common.yaml#/components/responses/403
        '404':
          $ref: ./common.yaml#/components/responses/404
        '409':
          $ref: ./common.yaml#/components/responses/409
        '422':
          $ref: ./common.yaml#/components/responses/422
        '429':
          $ref: ./common.yaml#/components/responses/429
        '500':
          $ref: ./common.yaml#/components/responses/500
