components:
  schemas:
    Country:
      type: object
      description: Country master (ISO 3166-1).
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        iso2:
          type: string
          maxLength: 2
          description: ISO 3166-1 alpha-2 code.
        iso3:
          type: string
          maxLength: 3
          description: ISO 3166-1 alpha-3 code.
        name:
          type: string
          maxLength: 120
          description: Country name.
        shortName:
          type: string
          maxLength: 60
          description: Short/common name.
        phonePrefix:
          type: string
          maxLength: 8
          description: International dialling prefix, e.g. +91.
        sortOrder:
          type: integer
          format: int32
          description: Display order in pick-lists.
        isActive:
          type: boolean
          description: Whether the country is selectable.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - name
    CountryUpdate:
      type: object
      description: Fields of Country that can be updated (partial update; see updateMask).
      properties:
        iso2:
          type: string
          maxLength: 2
          description: ISO 3166-1 alpha-2 code.
        iso3:
          type: string
          maxLength: 3
          description: ISO 3166-1 alpha-3 code.
        name:
          type: string
          maxLength: 120
          description: Country name.
        shortName:
          type: string
          maxLength: 60
          description: Short/common name.
        phonePrefix:
          type: string
          maxLength: 8
          description: International dialling prefix, e.g. +91.
        sortOrder:
          type: integer
          format: int32
          description: Display order in pick-lists.
        isActive:
          type: boolean
          description: Whether the country is selectable.
    CountryList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Country'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    StateProvince:
      type: object
      description: First-level administrative division of a country.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        countryId:
          type: string
          format: uuid
          description: Country the state belongs to.
        code:
          type: string
          maxLength: 10
          description: Official subdivision code (ISO 3166-2 suffix).
        name:
          type: string
          maxLength: 120
          description: State / province name.
        isActive:
          type: boolean
          description: Whether selectable.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - countryId
      - name
    StateProvinceUpdate:
      type: object
      description: Fields of StateProvince that can be updated (partial update; see updateMask).
      properties:
        countryId:
          type: string
          format: uuid
          description: Country the state belongs to.
        code:
          type: string
          maxLength: 10
          description: Official subdivision code (ISO 3166-2 suffix).
        name:
          type: string
          maxLength: 120
          description: State / province name.
        isActive:
          type: boolean
          description: Whether selectable.
    StateProvinceList:
      type: object
      required:
      - items
      properties:
        items:
