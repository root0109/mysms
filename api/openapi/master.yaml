      properties:
        countryId:
          type: string
          format: uuid
          description: Country of the city.
        stateProvinceId:
          type: string
          format: uuid
          description: State / province of the city.
        name:
          type: string
          maxLength: 120
          description: City name.
        isActive:
          type: boolean
          description: Whether selectable.
    CityList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    Currency:
      type: object
      description: Currency master (ISO 4217).
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        code:
          type: string
          maxLength: 3
          description: ISO 4217 code, e.g. INR, USD.
        name:
          type: string
          maxLength: 60
          description: Currency name.
        symbol:
          type: string
          maxLength: 8
          description: Display symbol.
        minorUnits:
          type: integer
          format: int32
          description: Number of decimal places.
        isActive:
          type: boolean
          description: Whether usable.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
