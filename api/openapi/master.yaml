            application/json:
              schema:
                $ref: '#/components/schemas/Country'
        '400':
          $ref: ./common.yaml#/components/responses/400
        '401':
          $ref: ./common.yaml#/components/responses/401
        '403':
          $ref: ./common.yaml#/components/responses/403
        '404':
          $ref: ./common.yaml#/components/responses/404
        '409':
          $ref: ./common.yaml#/components/responses/409
        '412':
          $ref: ./common.yaml#/components/responses/412
        '422':
          $ref: ./common.yaml#/components/responses/422
        '428':
          $ref: ./common.yaml#/components/responses/428
        '429':
          $ref: ./common.yaml#/components/responses/429
        '500':
          $ref: ./common.yaml#/components/responses/500
    delete:
      operationId: master.DeleteCountry
      summary: Delete Country
      description: Soft delete (sets deleted_at).
      tags:
      - Country
      security:
      - platformAdminAuth: []
      x-permission: master.country.delete
      x-grpc:
        service: mysms.master.v1.CountryService
        method: DeleteCountry
      parameters:
      - name: countryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Country id.
      - $ref: ./common.yaml#/components/parameters/IfMatch
      responses:
        '204':
