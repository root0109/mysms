      description: List Designations visible to the caller, with cursor pagination, filtering and ordering.
      tags:
      - Designation
      security:
      - bearerAuth: []
      x-permission: hr.designation.read
      x-grpc:
        service: mysms.hr.v1.DesignationService
        method: ListDesignations
      parameters:
      - $ref: ./common.yaml#/components/parameters/PageSize
      - $ref: ./common.yaml#/components/parameters/PageToken
      - $ref: ./common.yaml#/components/parameters/Filter
      - $ref: ./common.yaml#/components/parameters/OrderBy
      - $ref: ./common.yaml#/components/parameters/ReadMask
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignationList'
        '400':
          $ref: ./common.yaml#/components/responses/400
        '401':
          $ref: ./common.yaml#/components/responses/401
        '403':
