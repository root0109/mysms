components:
  schemas:
    LeaveBalance:
      type: object
      description: Leave entitlement and usage for one staff member, leave type and year; updated when applications are approved.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        staffId:
          type: string
          format: uuid
          description: Staff member.
        leaveTypeId:
          type: string
          format: uuid
          description: Leave type.
        academicYearId:
          type: string
          format: uuid
          description: Year the balance is tracked for.
        entitledDays:
          type: string
          format: decimal
          pattern: ^-?\d+(\.\d+)?$
          description: Days granted for the year.
        usedDays:
          type: string
          format: decimal
          pattern: ^-?\d+(\.\d+)?$
          description: Days consumed by approved applications.
          readOnly: true
        carriedForwardDays:
          type: string
          format: decimal
          pattern: ^-?\d+(\.\d+)?$
          description: Days carried in from the previous year.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - staffId
      - leaveTypeId
      - entitledDays
    LeaveBalanceUpdate:
      type: object
      description: Fields of LeaveBalance that can be updated (partial update; see updateMask).
      properties:
        staffId:
          type: string
          format: uuid
          description: Staff member.
        leaveTypeId:
          type: string
          format: uuid
          description: Leave type.
        academicYearId:
          type: string
          format: uuid
          description: Year the balance is tracked for.
        entitledDays:
          type: string
          format: decimal
          pattern: ^-?\d+(\.\d+)?$
          description: Days granted for the year.
        carriedForwardDays:
          type: string
          format: decimal
          pattern: ^-?\d+(\.\d+)?$
          description: Days carried in from the previous year.
    LeaveBalanceList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeaveBalance'
        nextPageToken:
          type: string
          description: Cursor for the next page; empty on the last page.
        totalSize:
          type: integer
          format: int32
          description: Total matching items (may be approximate for large sets).
    Designation:
      type: object
      description: Staff designation catalogue (Principal, Teacher, Accountant, Driver...).
