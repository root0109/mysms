      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Designation'
      responses:
        '200':
          description: validateOnly — every check ran and nothing was persisted; the would-be resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Designation'
        '201':
          description: Created
          headers:
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
