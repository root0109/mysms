openapi: 3.1.0
info:
  title: MySMS API — Workforce / HR
  version: 1.0.0
  description: Staff records, designations, departments, subject competencies, leave types and leave applications.
  license:
    name: Proprietary
    identifier: LicenseRef-MySMS
  contact:
    name: MySMS API team
    email: api@mysms.example
servers:
- url: https://api.mysms.example
  description: Production (replace with your domain)
security:
- bearerAuth: []
tags:
- name: Designation
  description: Designation aggregate.
- name: LeaveApplication
  description: LeaveApplication aggregate.
- name: LeaveType
  description: LeaveType aggregate.
- name: Staff
  description: Staff aggregate.
- name: LeaveBalance
  description: LeaveBalance aggregate.
paths:
  /v1/hr/designations:
