components:
  schemas:
    PaymentAllocation:
      type: object
      description: One slice of a payment settling an invoice or a fee due. Ledger row — never updated; reversed by a refund.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        invoiceId:
          type: string
          format: uuid
          description: Invoice this slice settles.
          readOnly: true
        studentFeeDueId:
          type: string
          format: uuid
          description: Fee due this slice settles.
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^\d+(\.\d+)?$
          description: Allocated amount.
          readOnly: true
        currencyId:
          type: string
          format: uuid
          description: Currency of the slice (always the payment currency).
          readOnly: true
    PaymentGatewayAccount:
      type: object
      description: Payment-gateway merchant account configured by a tenant (per institution when needed). Secrets are write-only; reads return masked forms.
      properties:
        keySecret:
          type: string
          writeOnly: true
          description: API key secret; stored encrypted, never returned.
        webhookSecret:
          type: string
          writeOnly: true
          description: Webhook signing secret; stored encrypted, never returned.
        keySecretMasked:
          type: string
          readOnly: true
          description: Masked display form of the key secret.
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        institutionId:
          type: string
          format: uuid
          description: Institution (absent = tenant-wide).
        gatewayName:
          type: string
          maxLength: 60
          description: Gateway identifier (razorpay, stripe, payu...).
        displayName:
          type: string
          maxLength: 150
          description: Admin-facing name of this account.
        merchantId:
          type: string
          maxLength: 120
          description: Merchant/account id at the gateway.
        keyId:
          type: string
          maxLength: 120
          description: API key id (public part).
        currencyId:
          type: string
          format: uuid
          description: Settlement currency.
        isDefault:
          type: boolean
          description: Default account for the tenant/institution.
        isActive:
          type: boolean
          description: Whether usable for new payments.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - gatewayName
      - displayName
    PaymentGatewayAccountUpdate:
      type: object
      description: Fields of PaymentGatewayAccount that can be updated (partial update; see updateMask).
      properties:
        keySecret:
          type: string
          writeOnly: true
          description: API key secret; stored encrypted, never returned.
        webhookSecret:
          type: string
          writeOnly: true
          description: Webhook signing secret; stored encrypted, never returned.
        institutionId:
          type: string
