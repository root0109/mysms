openapi: 3.1.0
info:
  title: MySMS API — Fees & Payments
  version: 1.0.0
  description: Fee heads, fee plans with installments, student dues, invoices, coupons and payments (student fees, LMS purchases, admissions). Separate from SaaS subscriptions and payroll.
  license:
    name: Proprietary
    identifier: LicenseRef-MySMS
  contact:
    name: MySMS API team
    email: api@mysms.example
servers:
- url: https://api.mysms.example
  description: Production (replace with your domain)
security:
- bearerAuth: []
tags:
- name: Coupon
  description: Coupon aggregate.
- name: FeeHead
  description: FeeHead aggregate.
- name: FeePlan
  description: FeePlan aggregate.
- name: FeePlanInstallmentComponent
  description: FeePlanInstallmentComponent aggregate.
- name: Invoice
  description: Invoice aggregate.
- name: Payment
  description: Payment aggregate.
- name: StudentFeeDue
  description: StudentFeeDue aggregate.
- name: AcquisitionSource
  description: AcquisitionSource aggregate.
- name: FeeStructure
  description: FeeStructure aggregate.
- name: FeeConcession
  description: FeeConcession aggregate.
- name: Refund
  description: Refund aggregate.
- name: PaymentGatewayAccount
  description: PaymentGatewayAccount aggregate.
- name: Operation
  description: Long-running operations started in this module (reports, imports, exports, bulk generation); poll until done.
paths:
