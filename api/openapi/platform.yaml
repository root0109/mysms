openapi: 3.1.0
info:
  title: MySMS API — Platform & Tenancy
  version: 1.0.0
  description: SaaS tenancy, subscription plans, shared files, tags, notes, audit trail and global settings.
  license:
    name: Proprietary
    identifier: LicenseRef-MySMS
  contact:
    name: MySMS API team
    email: api@mysms.example
servers:
- url: https://api.mysms.example
  description: Production (replace with your domain)
security:
- bearerAuth: []
tags:
- name: AuditLog
  description: AuditLog aggregate.
- name: DeletionLog
  description: DeletionLog aggregate.
- name: EntityAttachment
  description: EntityAttachment aggregate.
- name: EntityNote
  description: EntityNote aggregate.
- name: FileObject
  description: FileObject aggregate.
- name: ReservedKeyword
  description: ReservedKeyword aggregate.
- name: SaasPlan
  description: SaasPlan aggregate.
- name: SalesEnquiry
  description: SalesEnquiry aggregate.
- name: StorageQuota
  description: StorageQuota aggregate.
- name: SystemSetting
  description: SystemSetting aggregate.
- name: Tag
  description: Tag aggregate.
- name: TagAssignment
  description: TagAssignment aggregate.
- name: Tenant
  description: Tenant aggregate.
- name: TenantSubscription
  description: TenantSubscription aggregate.
- name: Theme
  description: Theme aggregate.
- name: UploadPolicy
  description: UploadPolicy aggregate.
- name: Operation
  description: Long-running operations started in this module (reports, imports, exports, bulk generation); poll until done.
paths:
  /v1/platform/tenants:
    get:
      operationId: platform.ListTenants
      summary: List Tenants
      description: List Tenants visible to the caller, with cursor pagination, filtering and ordering.
      tags:
      - Tenant
      security:
      - platformAdminAuth: []
      x-permission: platform.tenant.read
      x-grpc:
        service: mysms.platform.v1.TenantService
        method: ListTenants
      parameters:
      - $ref: ./common.yaml#/components/parameters/PageSize
      - $ref: ./common.yaml#/components/parameters/PageToken
      - $ref: ./common.yaml#/components/parameters/Filter
      - $ref: ./common.yaml#/components/parameters/OrderBy
      - $ref: ./common.yaml#/components/parameters/ReadMask
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
        '400':
          $ref: ./common.yaml#/components/responses/400
        '401':
          $ref: ./common.yaml#/components/responses/401
        '403':
          $ref: ./common.yaml#/components/responses/403
        '404':
          $ref: ./common.yaml#/components/responses/404
        '429':
          $ref: ./common.yaml#/components/responses/429
        '500':
          $ref: ./common.yaml#/components/responses/500
    post:
      operationId: platform.CreateTenant
      summary: Create Tenant
      description: Create a Tenant. Supports Idempotency-Key and validateOnly.
      tags:
      - Tenant
      security:
      - platformAdminAuth: []
      x-permission: platform.tenant.create
      x-grpc:
        service: mysms.platform.v1.TenantService
        method: CreateTenant
      parameters:
      - $ref: ./common.yaml#/components/parameters/IdempotencyKey
      - $ref: ./common.yaml#/components/parameters/ValidateOnly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tenant'
      responses:
        '200':
          description: validateOnly — every check ran and nothing was persisted; the would-be resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '201':
          description: Created
          headers:
            ETag:
              $ref: ./common.yaml#/components/headers/ETag
            Location:
              description: URL of the new resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: ./common.yaml#/components/responses/400
        '401':
          $ref: ./common.yaml#/components/responses/401
        '403':
          $ref: ./common.yaml#/components/responses/403
        '404':
