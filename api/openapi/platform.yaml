    FileObject:
      type: object
      description: Every stored file (documents, images, videos, attachments). Other tables reference files through *_file_id.
      properties:
        status:
          type: string
          enum: [pending, available, quarantined, deleted]
          x-extensible-enum: true
          description: 'Lifecycle: pending (upload started), available, quarantined (failed scanning), deleted (storage reclaimed).'
          readOnly: true
        scannedAt:
          type: string
          format: date-time
          description: When malware/content scanning finished.
          readOnly: true
        uploadedByUserId:
          type: string
          format: uuid
          description: User who uploaded the file.
          readOnly: true
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        fileName:
          type: string
          maxLength: 255
          description: Stored file name.
        originalName:
          type: string
          maxLength: 255
          description: Name of the file as uploaded.
        mimeType:
          type: string
          maxLength: 150
          description: MIME type.
        sizeBytes:
          type: string
          format: int64
          pattern: ^-?[0-9]+$
          description: File size in bytes.
        checksumSha256:
          type: string
          maxLength: 64
          description: SHA-256 of the content.
        ownerEntityType:
          type: string
          maxLength: 80
          description: Polymorphic owner type (table name) when the file belongs to one record.
        ownerEntityId:
          type: string
          format: uuid
          description: Polymorphic owner record id (pairs with owner_entity_type).
        collectionName:
          type: string
          maxLength: 80
          description: Logical collection within the owner, e.g. avatar, gallery.
        sortOrder:
          type: integer
          format: int32
          description: Order within the collection.
        fileKind:
          type: string
          enum:
          - document
          - presentation
          - spreadsheet
          - pdf
          - image
          - audio
          - video
          - archive
          - package
          - ebook
          - other
          x-extensible-enum: true
          description: Kind of file (from the fixed content-type catalogue), used for icons, viewers and processing.
        isShared:
          type: boolean
          description: Shared with a group of users (readable beyond the owner).
        processingStatus:
          type: string
          enum:
          - none
          - pending
          - in_progress
          - succeeded
          - failed
          x-extensible-enum: true
          description: State of post-upload processing (package extraction, document-to-e-book conversion, video transcoding).
        processingAttempts:
          type: integer
          format: int32
          description: Processing attempts so far.
        processingError:
          type: string
          description: Last processing error.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - fileName
      - sizeBytes
