      properties:
        paymentId:
          type: string
          format: uuid
          description: Payment row created in finance.
        redirectUrl:
          type: string
          description: Hosted payment page.
        gatewayOrderId:
          type: string
          description: Gateway order id for client SDKs.
        gatewayPublicKey:
          type: string
          description: Publishable key for client SDKs.
      required:
      - paymentId
    Tenant:
      type: object
      description: A customer organisation (school group, trust, single school or training company) that owns all of its data.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        code:
          type: string
          maxLength: 50
          description: Short unique tenant code used in URLs and logins.
        name:
          type: string
          maxLength: 200
          description: Display name.
        legalName:
          type: string
          maxLength: 200
          description: Registered legal name.
        status:
          type: string
          enum:
          - active
          - suspended
          - closed
          x-extensible-enum: true
          description: Tenant lifecycle state.
        primaryEmail:
          type: string
          maxLength: 320
          description: Main contact e-mail.
        primaryPhone:
          type: string
          maxLength: 20
          description: Main contact phone.
        countryId:
          type: string
          format: uuid
          description: Country of registration.
        defaultCurrencyId:
          type: string
          format: uuid
          description: Default currency for fees and payments.
        timezone:
          type: string
          maxLength: 64
          description: IANA time zone, e.g. Asia/Kolkata.
        locale:
          type: string
          maxLength: 10
          description: Default locale.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - code
      - name
