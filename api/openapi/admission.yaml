components:
  schemas:
    EnrollApplicantResult:
      type: object
      description: Outcome of enrolling an applicant. The admission module records the enrollment and emits events; the student record itself lives in sis.
      properties:
        application:
          $ref: '#/components/schemas/Application'
        studentId:
          type: string
          format: uuid
          description: Student created in sis (fetch via sis when needed).
        operation:
          $ref: ./common.yaml#/components/schemas/Operation
      required:
      - application
      - studentId
    AdmissionCycle:
      type: object
      description: An admission window for a program, course or grade in an academic year.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        institutionId:
          type: string
          format: uuid
          description: Institution.
        name:
          type: string
          maxLength: 150
          description: Cycle name.
        admissionBasis:
          type: string
          enum:
          - program
          - course
          - grade_level
          x-extensible-enum: true
          description: What applicants apply for.
        programId:
          type: string
          format: uuid
          description: Program (basis = program).
        courseId:
          type: string
          format: uuid
          description: Course (basis = course).
        gradeLevelId:
          type: string
          format: uuid
          description: Grade (basis = grade_level).
        academicYearId:
          type: string
          format: uuid
          description: Academic year.
        academicTermId:
          type: string
          format: uuid
          description: Term.
        startDate:
          type: string
          format: date
          description: Opens.
        endDate:
          type: string
          format: date
          description: Closes.
        minApplications:
          type: integer
          format: int32
          description: Minimum applications to run the cycle.
        maxApplications:
          type: integer
          format: int32
          description: Seat / application cap.
        minimumAgeYears:
          type: integer
          format: int32
          description: Minimum age at admission.
        applicationFeeHeadId:
          type: string
          format: uuid
          description: Fee head charged on application.
        status:
          type: string
          enum:
          - draft
          - confirmed
          - open
          - admission
          - closed
          - cancelled
          x-extensible-enum: true
          description: Cycle state. Changed only through the workflow operations.
          readOnly: true
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - institutionId
      - name
      - startDate
    AdmissionCycleUpdate:
      type: object
      description: Fields of AdmissionCycle that can be updated (partial update; see updateMask).
      properties:
        institutionId:
          type: string
          format: uuid
          description: Institution.
        name:
          type: string
          maxLength: 150
          description: Cycle name.
        admissionBasis:
          type: string
          enum:
          - program
          - course
          - grade_level
          x-extensible-enum: true
          description: What applicants apply for.
        programId:
          type: string
          format: uuid
          description: Program (basis = program).
        courseId:
          type: string
          format: uuid
          description: Course (basis = course).
        gradeLevelId:
          type: string
          format: uuid
          description: Grade (basis = grade_level).
        academicYearId:
          type: string
          format: uuid
          description: Academic year.
        academicTermId:
          type: string
          format: uuid
          description: Term.
        startDate:
          type: string
          format: date
          description: Opens.
        endDate:
          type: string
          format: date
          description: Closes.
        minApplications:
          type: integer
          format: int32
          description: Minimum applications to run the cycle.
        maxApplications:
          type: integer
          format: int32
          description: Seat / application cap.
        minimumAgeYears:
          type: integer
          format: int32
          description: Minimum age at admission.
        applicationFeeHeadId:
          type: string
          format: uuid
          description: Fee head charged on application.
    PagingInfoAdmissionCycle:
      type: object
      description: A page of AdmissionCycle, with the links to the other pages.
      required:
      - data
      - paging
      properties:
        data:
          type: array
          description: Data retrieved in the paginated request.
          items:
            $ref: '#/components/schemas/AdmissionCycle'
        paging:
          $ref: ./common.yaml#/components/schemas/NavigationInfo
    AdmissionCycleFee:
      type: object
      description: Course fee head charged when admission is confirmed in a cycle.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        admissionCycleId:
          type: string
          format: uuid
          description: Cycle.
          readOnly: true
        courseId:
          type: string
          format: uuid
          description: Course.
        feeHeadId:
          type: string
          format: uuid
          description: Fee head.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - courseId
    AdmissionCycleFeeUpdate:
      type: object
      description: Fields of AdmissionCycleFee that can be updated (partial update; see updateMask).
      properties:
        courseId:
          type: string
          format: uuid
          description: Course.
        feeHeadId:
          type: string
          format: uuid
          description: Fee head.
    PagingInfoAdmissionCycleFee:
      type: object
      description: A page of AdmissionCycleFee, with the links to the other pages.
      required:
      - data
      - paging
      properties:
        data:
