        maxUnitLoad:
          type: string
          format: decimal
          pattern: ^-?\d+(\.\d+)?$
          description: Maximum credit load per term.
        imageFileId:
          type: string
          format: uuid
          description: Program image.
        isActive:
          type: boolean
          description: Whether offered.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
