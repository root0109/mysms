openapi: 3.1.0
info:
  title: MySMS API — Academic Structure
  version: 1.0.0
  description: Programs, courses, batches, grade levels, sections, class sections, subjects and their offerings, teaching assignments, curriculum units and lesson plans. Serves both K-12 (grade/section)
    and higher education (program/course/batch).
  license:
    name: Proprietary
    identifier: LicenseRef-MySMS
  contact:
    name: MySMS API team
    email: api@mysms.example
servers:
- url: https://api.mysms.example
  description: Production (replace with your domain)
security:
- bearerAuth: []
tags:
- name: Batch
  description: Batch aggregate.
- name: ClassSection
  description: ClassSection aggregate.
- name: Course
  description: Course aggregate.
- name: CurriculumUnit
  description: CurriculumUnit aggregate.
- name: GradeLevel
  description: GradeLevel aggregate.
- name: LessonPlan
  description: LessonPlan aggregate.
- name: Program
  description: Program aggregate.
- name: ProgramLevel
  description: ProgramLevel aggregate.
- name: Section
  description: Section aggregate.
- name: Subject
  description: Subject aggregate.
- name: TeachingAssignment
  description: TeachingAssignment aggregate.
