components:
  schemas:
    ProgramLevel:
      type: object
      description: Level of a program (Certificate, Diploma, UG, PG, Doctorate).
      properties:
        code:
          type: string
          maxLength: 40
          description: Stable key used by imports, integrations and seed scripts.
        sortOrder:
          type: integer
          format: int32
          description: Display order.
        isActive:
          type: boolean
          description: Whether offered for new picks.
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        name:
          type: string
          maxLength: 80
          description: Level name.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - name
    ProgramLevelUpdate:
      type: object
      description: Fields of ProgramLevel that can be updated (partial update; see updateMask).
      properties:
        code:
          type: string
          maxLength: 40
          description: Stable key used by imports, integrations and seed scripts.
        sortOrder:
          type: integer
          format: int32
          description: Display order.
        isActive:
          type: boolean
          description: Whether offered for new picks.
        name:
          type: string
          maxLength: 80
          description: Level name.
    ProgramLevelList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
