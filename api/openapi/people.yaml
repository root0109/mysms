    ConsentRecord:
      type: object
      description: Consent given (or withdrawn) for processing a person's data for one purpose; for minors the consent is given by a guardian. Current consent = latest row per person and purpose with withdrawn_at
        NULL.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        personId:
          type: string
          format: uuid
          description: Person the data belongs to.
          readOnly: true
        givenByPersonId:
          type: string
          format: uuid
          description: Person who gave the consent (the person, or a guardian for a minor).
        purpose:
          type: string
          enum:
          - data_processing
          - photo_video_publication
          - public_profile
          - marketing
          - third_party_sharing
          - sms_whatsapp_messages
          - biometric_data
          x-extensible-enum: true
          description: What the consent covers.
        policyVersion:
          type: string
          maxLength: 30
          description: Version of the privacy notice / consent text shown.
        grantedAt:
          type: string
          format: date-time
          description: When consent was given.
        withdrawnAt:
          type: string
          format: date-time
          description: When consent was withdrawn (NULL = in force).
        channel:
          type: string
          enum:
          - web
          - mobile_app
          - paper_form
          - email
          - in_person
          x-extensible-enum: true
          description: How consent was captured.
        recordedByUserId:
          type: string
          format: uuid
          description: Staff who recorded a paper / in-person consent.
        evidenceFileId:
          type: string
          format: uuid
          description: Signed form or other evidence.
        ipAddress:
          type: string
          description: Client address for online consent.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - givenByPersonId
      - purpose
      - policyVersion
      - grantedAt
      - channel
    PagingInfoConsentRecord:
