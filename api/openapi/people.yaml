components:
  schemas:
    MyPersonUpdate:
      type: object
      description: Fields of their own Person a user may change themselves (partial update; see updateMask). Names, identity and statutory fields are changed by administrators with people.UpdatePerson. The profile photo follows once uploads (platform.CreateUploadUrl) are served, so a user can only set a file they uploaded.
      properties:
        primaryEmail:
          type: string
          maxLength: 320
          description: Personal e-mail.
        primaryPhone:
          type: string
          maxLength: 20
          description: Personal phone.
        alternatePhone:
          type: string
          maxLength: 20
          description: Alternate phone.
        workPhone:
          type: string
          maxLength: 30
          description: Office / work phone.
        websiteUrl:
          type: string
          maxLength: 500
          description: Personal web page.
        aboutMe:
          type: string
          description: Short self-description shown on the profile.
        motherTongue:
          type: string
          maxLength: 60
          description: Mother tongue.
    Honorific:
      type: object
      description: Name prefix such as Mr, Ms, Dr.
      properties:
        code:
          type: string
          maxLength: 40
          description: Stable key used by imports, integrations and seed scripts.
        sortOrder:
          type: integer
          format: int32
          description: Display order.
        isActive:
          type: boolean
          description: Whether offered for new picks.
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        name:
          type: string
          maxLength: 40
          description: Full form, e.g. Doctor.
        shortcut:
          type: string
          maxLength: 10
          description: Abbreviation, e.g. Dr.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - name
    HonorificUpdate:
      type: object
      description: Fields of Honorific that can be updated (partial update; see updateMask).
      properties:
        code:
          type: string
          maxLength: 40
          description: Stable key used by imports, integrations and seed scripts.
        sortOrder:
          type: integer
          format: int32
          description: Display order.
        isActive:
          type: boolean
          description: Whether offered for new picks.
        name:
          type: string
          maxLength: 40
          description: Full form, e.g. Doctor.
        shortcut:
          type: string
          maxLength: 10
          description: Abbreviation, e.g. Dr.
    PagingInfoHonorific:
      type: object
      description: A page of Honorific, with the links to the other pages.
      required:
      - data
      - paging
      properties:
        data:
          type: array
          description: Data retrieved in the paginated request.
          items:
            $ref: '#/components/schemas/Honorific'
        paging:
          $ref: ./common.yaml#/components/schemas/NavigationInfo
    Person:
      type: object
      description: A human being. Shared identity for student, guardian, staff, applicant and student roles.
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        honorificId:
          type: string
          format: uuid
          description: Name prefix.
        firstName:
          type: string
          maxLength: 100
          description: Given name.
        middleName:
          type: string
          maxLength: 100
          description: Middle name.
        lastName:
          type: string
          maxLength: 100
          description: Family name.
        displayName:
          type: string
          maxLength: 255
          description: Full name as displayed.
        dateOfBirth:
          type: string
          format: date
          description: Date of birth.
        gender:
          type: string
          enum:
          - male
          - female
          - other
          - undisclosed
          x-extensible-enum: true
          description: Gender.
        bloodGroup:
          type: string
          enum:
          - A+
          - A-
          - B+
          - B-
          - O+
          - O-
          - AB+
          - AB-
          - A1+
          - A1-
          - B1+
          - B1-
          - A1B+
          - A1B-
          x-extensible-enum: true
          description: Blood group.
        maritalStatus:
          type: string
          enum:
          - single
          - married
          - divorced
          - widowed
          x-extensible-enum: true
          description: Marital status.
        birthPlace:
          type: string
          maxLength: 120
          description: Place of birth.
        nativePlace:
          type: string
          maxLength: 120
          description: Native place / hometown.
        nationalityCountryId:
          type: string
          format: uuid
          description: Nationality.
        motherTongue:
          type: string
          maxLength: 60
          description: Mother tongue.
        religion:
          type: string
          maxLength: 60
          description: Religion (optional, for statutory reporting).
        socialCategory:
          type: string
          maxLength: 30
          description: Government social category used for statutory reporting (e.g. GEN, OBC, SC, ST).
        socialSubCategory:
          type: string
          maxLength: 60
          description: Sub-category.
        nationalIdType:
          type: string
          maxLength: 30
          description: Type of national id (e.g. AADHAAR, SSN, PASSPORT).
        nationalId:
          type: string
          description: 'Plain value, input only: stored encrypted and never returned. National id number, encrypted at rest.'
          writeOnly: true
        nationalIdMasked:
          type: string
          description: Masked form for display, e.g. "••••1234". Output only.
          readOnly: true
        visaInfo:
          type: string
          maxLength: 100
          description: Visa / residence-permit details.
        primaryEmail:
          type: string
          maxLength: 320
          description: Personal e-mail.
        primaryPhone:
          type: string
          maxLength: 20
          description: Personal phone.
        alternatePhone:
          type: string
          maxLength: 20
          description: Alternate phone.
        photoFileId:
          type: string
          format: uuid
          description: Profile photo.
        remarks:
          type: string
          description: Free-text notes about the person.
        workPhone:
          type: string
          maxLength: 30
          description: Office / work phone.
        websiteUrl:
          type: string
          maxLength: 500
          description: Personal web page.
        aboutMe:
          type: string
          description: Short self-description shown on the profile.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
