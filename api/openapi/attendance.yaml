    identifier: LicenseRef-MySMS
  contact:
    name: MySMS API team
    email: api@mysms.example
servers:
- url: https://api.mysms.example
  description: Production (replace with your domain)
security:
- bearerAuth: []
tags:
- name: AbsenceReason
  description: AbsenceReason aggregate.
- name: AttendanceRegister
  description: AttendanceRegister aggregate.
- name: AttendanceSheet
  description: AttendanceSheet aggregate.
- name: AttendanceType
  description: AttendanceType aggregate.
- name: StaffAttendance
  description: StaffAttendance aggregate.
