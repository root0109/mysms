components:
  schemas:
    StaffAttendance:
      type: object
      description: Daily attendance of staff (manual, biometric import or bulk import).
      properties:
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        staffId:
          type: string
          format: uuid
          description: Staff member the day belongs to.
        attendanceDate:
          type: string
          format: date
          description: Attendance day.
        status:
          type: string
          enum:
          - present
          - absent
          - half_day
          - late
          - on_leave
          - holiday
          x-extensible-enum: true
          description: Day status.
        checkInAt:
          type: string
          format: date-time
          description: Clock-in time when captured.
        checkOutAt:
          type: string
          format: date-time
          description: Clock-out time when captured.
        source:
          type: string
          enum:
          - manual
          - biometric
          - import
          x-extensible-enum: true
          description: How the row was captured.
          readOnly: true
        leaveApplicationId:
          type: string
          format: uuid
          description: Approved leave application that explains an on_leave day.
        recordedByUserId:
          type: string
          format: uuid
          description: User who recorded or corrected the day.
          readOnly: true
        remark:
          type: string
          maxLength: 300
          description: Free-text remark.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - staffId
      - attendanceDate
      - status
    StaffAttendanceUpdate:
      type: object
      description: Fields of StaffAttendance that can be updated (partial update; see updateMask).
