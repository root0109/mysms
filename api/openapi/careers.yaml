components:
  schemas:
    FunctionArea:
      type: object
      description: Job function catalogue (Engineering, Sales...).
      properties:
        code:
          type: string
          maxLength: 40
          description: Stable key used by imports, integrations and seed scripts.
        sortOrder:
          type: integer
          format: int32
          description: Display order.
        isActive:
          type: boolean
          description: Whether offered for new picks.
        id:
          type: string
          format: uuid
          description: Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback).
          readOnly: true
        name:
          type: string
          maxLength: 120
          description: Function.
        createTime:
          type: string
          format: date-time
          description: Row creation time.
          readOnly: true
        createdBy:
          type: string
          format: uuid
          description: User account that created the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: Last update time.
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          description: User account that last updated the row (audit reference to iam.user_account; not FK-constrained).
          readOnly: true
        etag:
          type: string
          readOnly: true
          description: Entity tag (row version); send back in If-Match / etag.
      required:
      - name
    FunctionAreaUpdate:
      type: object
      description: Fields of FunctionArea that can be updated (partial update; see updateMask).
      properties:
        code:
