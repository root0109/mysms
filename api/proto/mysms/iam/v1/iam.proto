// Either a completed sign-in (tokens + user) or an MFA challenge (mfa_required + mfa_token only).
message LoginResult {
  // Issued tokens. Required.
  mysms.common.v1.TokenPair tokens = 1;
  // Authenticated account. Required.
  UserAccount user = 2;
  // A second factor must be completed before tokens are usable.
  optional bool mfa_required = 3;
  // Short-lived token for CompleteMfa; present only when mfa_required is true.
  optional string mfa_token = 4;
}

message Me {
  // Current account. Required.
  UserAccount user = 1;
  // Linked person.
  mysms.people.v1.Person person = 2;
  // Role grants with scope.
  repeated mysms.common.v1.RoleGrant roles = 3;
  // Effective permission codes.
  repeated string permissions = 4;
  // Institutions the user can act in.
  repeated mysms.org.v1.Institution institutions = 5;
  // Student records of this person. [UUID]
  repeated string student_ids = 6;
  // Staff records of this person. [UUID]
  repeated string staff_ids = 7;
  // Guardian record of this person. [UUID]
  optional string guardian_id = 8;
  // Role the caller is currently acting in (see SwitchRole); permissions are those of this role.
  mysms.common.v1.RoleGrant active_role = 9;
}

message ApiTokenCreated {
  // The secret token. Returned only in this response; store it securely. Required.
  string token = 1;
  // Token record (hash only). Required.
  AuthToken auth_token = 2;
}

message SwitchRoleResult {
  // New tokens carrying the active role; the old access token stops working. Required.
  mysms.common.v1.TokenPair tokens = 1;
  // Caller with the new active role and its permissions. Required.
  Me me = 2;
}

message EnrollMfaRequest {
  // Factor kind to enroll: totp, sms or email.
  string credential_type = 1;
  // User-facing label (device name, phone tail).
  optional string label = 2;
  // Phone number or e-mail for OTP factors.
  optional string target = 3;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 4;
}
message EnrollMfaResponse {
  // Credential being enrolled. [UUID]
  string mfa_credential_id = 1;
  // TOTP shared secret (base32), present for totp only; shown once.
  optional string secret = 2;
  // otpauth:// URL for authenticator apps.
  optional string otpauth_url = 3;
  // One-time recovery codes; shown once.
  repeated string recovery_codes = 4;
  // Short-lived token to pass to CompleteMfa with the first valid code, which verifies the enrollment.
  optional string mfa_token = 5;
}
message CompleteMfaRequest {
  // Token from Login (or from EnrollMfa verification).
  string mfa_token = 1;
  // Current TOTP/OTP or a recovery code.
  string code = 2;
}
message CompleteMfaResponse {
  LoginResult result = 1;
}
message DisableMfaRequest {
  // Credential to disable. [UUID]
  string mfa_credential_id = 1;
  // Current code or recovery code proving possession.
  string code = 2;
}
message DisableMfaResponse {
}

// One enrolled second factor (no secret material). Output only.
message MfaCredential {
  // Credential id. [UUID] Output only.
  string id = 1;
  // Factor kind: totp, sms, email or recovery_codes. Output only.
  string credential_type = 2;
  // User-facing label. Output only.
  optional string label = 3;
  // When enrollment was proven with a valid code. Output only.
  google.protobuf.Timestamp verified_at = 4;
  // Last successful use. Output only.
  google.protobuf.Timestamp last_used_at = 5;
  // Whether usable at sign-in. Output only.
  bool is_active = 6;
}
message ListMfaCredentialsRequest {
}
message ListMfaCredentialsResponse {
  repeated MfaCredential items = 1;
}
message RegenerateRecoveryCodesRequest {
  // Current TOTP/OTP or a recovery code.
  string code = 1;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 2;
}
message RegenerateRecoveryCodesResponse {
  // One-time recovery codes; shown once.
  repeated string recovery_codes = 1;
}

message GetOperationRequest {
  // Path parameter operationId.
  string operation_id = 1;
}

message GetOperationResponse {
  mysms.common.v1.Operation result = 1;
}

message ListOperationsRequest {
  // Filter by kind.
  optional string kind = 1;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 4;
  // Fields 2 (page_size), 3 (page_token) replaced by pageable: one-based pages, repeated sort
  // criteria and a cursor carried by the response's pagination.
  reserved 2, 3;
  reserved "page_size", "page_token";
}

message ListOperationsResponse {
  repeated mysms.common.v1.Operation items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 3;
  // Fields 2 (next_page_token) replaced by pagination; lists no longer count their
  // rows.
  reserved 2;
  reserved "next_page_token";
}

message CancelOperationRequest {
  // Path parameter operationId.
  string operation_id = 1;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 2;
}

message CancelOperationResponse {
  mysms.common.v1.Operation result = 1;
}

// A setting the product offers (theme, density, language...), with its type, allowed values, default, the scopes it may be set at and whether users may change it themselves. Product catalogue: read-only through the API.
message SettingDefinition {
  // Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback). [UUID] Output only.
  string id = 1;
  // Stable key, e.g. ui.theme. Output only.
  optional string setting_key = 2;
  // Grouping on the settings screens, e.g. appearance. Output only.
  optional string category = 3;
  // Type of the value. Output only.
  optional string value_type = 4;
  // Value when no scope sets one. Output only.
  optional string default_value = 5;
  // Smallest allowed value (integer settings). Output only.
  optional int32 min_value = 6;
  // Largest allowed value (integer settings). Output only.
  optional int32 max_value = 7;
  // Whether users may set it for themselves. Output only.
  optional bool user_editable = 8;
  // What the setting changes. Output only.
  optional string description = 9;
  // Display order within its category. Output only.
  optional int32 sort_order = 10;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 11;
  // User account that created the row (audit reference). [UUID] Output only.
  optional string created_by = 12;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 13;
  // User account that last updated the row (audit reference). [UUID] Output only.
  optional string updated_by = 14;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 15;
  // Allowed values of a choice setting. Output only.
  repeated string allowed_values = 16;
  // Scopes at which a value may be set. Output only.
  repeated string allowed_scopes = 17;
}

message ListSettingDefinitionsRequest {
  // Filter expression (AIP-160 subset).
  string filter = 3;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 5;
  // Fields 1 (page_size), 2 (page_token), 4 (order_by) replaced by pageable: one-based pages, repeated sort
  // criteria and a cursor carried by the response's pagination.
  reserved 1, 2, 4;
  reserved "page_size", "page_token", "order_by";
}
message ListSettingDefinitionsResponse {
  repeated SettingDefinition items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 4;
  // Fields 2 (next_page_token), 3 (total_size) replaced by pagination; lists no longer count their
  // rows.
  reserved 2, 3;
  reserved "next_page_token", "total_size";
}

message GetSettingDefinitionRequest {
  // SettingDefinition id (UUID).
  string id = 1;
}
message GetSettingDefinitionResponse {
  SettingDefinition setting_definition = 1;
}

// SettingDefinitionService: operations on the SettingDefinition aggregate.
service SettingDefinitionService {
  // List SettingDefinitions.
  rpc ListSettingDefinitions(ListSettingDefinitionsRequest) returns (ListSettingDefinitionsResponse);
  // Get SettingDefinition.
  rpc GetSettingDefinition(GetSettingDefinitionRequest) returns (GetSettingDefinitionResponse);
}

// A setting's value at one scope. Effective value for a user: the most specific of user > class section > primary department > institution > tenant > default, unless a broader scope locks it.
message SettingValue {
  // Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback). [UUID] Output only.
  string id = 1;
  // Level the value applies to.
  string scope_type = 2;
  // Institution, department, class section or user account the value applies to; absent for tenant. [UUID]
  optional string scope_id = 3;
  // The setting (SettingDefinition.settingKey).
  string setting_key = 4;
  // The value, as text in the setting's type.
  string value = 5;
  // Narrower scopes (and users) cannot override it.
  optional bool is_locked = 6;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 7;
  // User account that created the row (audit reference). [UUID] Output only.
  optional string created_by = 8;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 9;
  // User account that last updated the row (audit reference). [UUID] Output only.
  optional string updated_by = 10;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 11;
}

message ListSettingValuesRequest {
  // Filter expression (AIP-160 subset).
  string filter = 3;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 5;
  // Fields 1 (page_size), 2 (page_token), 4 (order_by) replaced by pageable: one-based pages, repeated sort
  // criteria and a cursor carried by the response's pagination.
  reserved 1, 2, 4;
  reserved "page_size", "page_token", "order_by";
}
message ListSettingValuesResponse {
  repeated SettingValue items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 4;
  // Fields 2 (next_page_token), 3 (total_size) replaced by pagination; lists no longer count their
  // rows.
  reserved 2, 3;
  reserved "next_page_token", "total_size";
}

message GetSettingValueRequest {
  // SettingValue id (UUID).
  string id = 1;
}
message GetSettingValueResponse {
  SettingValue setting_value = 1;
}

message CreateSettingValueRequest {
  SettingValue setting_value = 1;
  // Idempotency key (UUID); retries with the same key return the original result.
  string request_id = 2;
  // Validate without persisting.
  bool validate_only = 3;
}
message CreateSettingValueResponse {
  SettingValue setting_value = 1;
}

message UpdateSettingValueRequest {
  // Resource with id and etag set.
  SettingValue setting_value = 1;
  // Fields to update; empty = all fields present.
  google.protobuf.FieldMask update_mask = 2;
  // Validate without persisting.
  bool validate_only = 3;
}
message UpdateSettingValueResponse {
  SettingValue setting_value = 1;
}

message DeleteSettingValueRequest {
  // SettingValue id (UUID).
  string id = 1;
  // ETag from the last read.
  string etag = 2;
}
message DeleteSettingValueResponse {
}

// SettingValueService: operations on the SettingValue aggregate.
service SettingValueService {
  // List SettingValues.
  rpc ListSettingValues(ListSettingValuesRequest) returns (ListSettingValuesResponse);
  // Get SettingValue.
  rpc GetSettingValue(GetSettingValueRequest) returns (GetSettingValueResponse);
  // Create SettingValue.
  rpc CreateSettingValue(CreateSettingValueRequest) returns (CreateSettingValueResponse);
  // Update SettingValue.
  rpc UpdateSettingValue(UpdateSettingValueRequest) returns (UpdateSettingValueResponse);
  // Soft-delete SettingValue.
  rpc DeleteSettingValue(DeleteSettingValueRequest) returns (DeleteSettingValueResponse);
}

// The caller's effective value of one setting and where it comes from.
message EffectiveSetting {
  // The setting.
  string setting_key = 1;
  // Effective value.
  string value = 2;
  // Level the value comes from: default, tenant, institution, department, class_section or user.
  string source_scope = 3;
  // Institution, department, class section or user the value comes from. [UUID]
  optional string source_scope_id = 4;
  // A broader scope locked the value.
  bool locked = 5;
  // The caller may set it for themselves (when not locked).
  bool user_editable = 6;
}
message ListMySettingsRequest {
}
message ListMySettingsResponse {
  repeated EffectiveSetting items = 1;
}
message SetMySettingRequest {
  // The setting.
  string setting_key = 1;
  // The value, as text in the setting's type.
  string value = 2;
}
message SetMySettingResponse {
  EffectiveSetting setting = 1;
}
message ResetMySettingRequest {
  // The setting.
  string setting_key = 1;
}
