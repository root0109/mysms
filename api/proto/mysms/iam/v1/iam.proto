  // Client platform.
  Platform platform = 4;
  // Push-notification token (FCM/APNs/Web Push). Input only; never returned.
  optional string push_token = 5;
  // Last activity from this device.
  google.protobuf.Timestamp last_seen_at = 6;
  // Whether pushes are sent to this device.
  bool is_active = 7;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 8;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 9;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 10;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 11;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 12;
  // Allowed values of platform; REST/JSON uses the lowercase value shown in each comment.
  enum Platform {
    PLATFORM_UNSPECIFIED = 0;
    // "android"
    PLATFORM_ANDROID = 1;
    // "ios"
    PLATFORM_IOS = 2;
    // "web"
    PLATFORM_WEB = 3;
  }
}

