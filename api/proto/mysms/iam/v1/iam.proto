  google.protobuf.Timestamp last_used_at = 9;
  // When revoked / consumed.
  google.protobuf.Timestamp revoked_at = 10;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 11;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 12;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 13;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 14;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 15;
  // Allowed values of token_type; REST/JSON uses the lowercase value shown in each comment.
  enum TokenType {
    TOKEN_TYPE_UNSPECIFIED = 0;
    // "api"
    TOKEN_TYPE_API = 1;
    // "remember_me"
    TOKEN_TYPE_REMEMBER_ME = 2;
    // "one_time_login"
    TOKEN_TYPE_ONE_TIME_LOGIN = 3;
    // "email_verification"
    TOKEN_TYPE_EMAIL_VERIFICATION = 4;
    // "mobile_verification"
    TOKEN_TYPE_MOBILE_VERIFICATION = 5;
    // "password_reset"
    TOKEN_TYPE_PASSWORD_RESET = 6;
    // "refresh"
    TOKEN_TYPE_REFRESH = 7;
  }
}

// Registered device / browser for push notifications.
message UserDevice {
