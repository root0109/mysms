// Background import or export of a course or cohort package (native or IMS Common Cartridge).
message ImportExportJob {
  // Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback). [UUID] Output only.
  string id = 1;
  // Institution the job runs for. [UUID]
  optional string institution_id = 2;
  // Import or export.
  Direction direction = 3;
  // Package format.
  PackageFormat package_format = 4;
  // Whether a course template or a cohort (class) is transferred.
  Scope scope = 5;
  // Course imported into / exported from. [UUID]
  optional string course_id = 6;
  // Cohort imported into / exported from. [UUID]
  optional string cohort_id = 7;
  // Chapter (folder) the imported content is placed in. [UUID]
  optional string target_chapter_id = 8;
  // Also add imported items to the shared content repository.
  bool add_to_repository = 9;
  // Package file (uploaded for import, produced by export). [UUID]
  optional string package_file_id = 10;
  // User who requested the job. [UUID]
  string requested_by = 11;
  // Request date. [ISO-8601 date (YYYY-MM-DD)]
  string requested_on = 12;
  // Date the worker started the job. [ISO-8601 date (YYYY-MM-DD)]
  optional string started_on = 13;
  // Job state. Changed only through the workflow operations. Output only.
  Status status = 14;
  // Restore state of an exported cohort archive.
  optional UnarchiveStatus unarchive_status = 15;
  // Error details.
  optional string error_log = 16;
  // Cohort code recorded in the package.
  optional string cohort_code = 17;
  // Cohort start date recorded in the package. [ISO-8601 date (YYYY-MM-DD)]
  optional string cohort_start_date = 18;
  // Course code recorded in the package.
  optional string course_code = 19;
  // Course version recorded in the package.
  optional string course_version = 20;
  // Course title recorded in the package.
  optional string course_title = 21;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 22;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 23;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 24;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 25;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 26;
  // Allowed values of direction; REST/JSON uses the lowercase value shown in each comment.
  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    // "import"
    DIRECTION_IMPORT = 1;
    // "export"
    DIRECTION_EXPORT = 2;
  }
  // Allowed values of package_format; REST/JSON uses the lowercase value shown in each comment.
  enum PackageFormat {
    PACKAGE_FORMAT_UNSPECIFIED = 0;
    // "native"
    PACKAGE_FORMAT_NATIVE = 1;
    // "common_cartridge"
    PACKAGE_FORMAT_COMMON_CARTRIDGE = 2;
    // "cohort_archive"
    PACKAGE_FORMAT_COHORT_ARCHIVE = 3;
  }
  // Allowed values of scope; REST/JSON uses the lowercase value shown in each comment.
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    // "course"
    SCOPE_COURSE = 1;
    // "cohort"
    SCOPE_COHORT = 2;
  }
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "pending"
    STATUS_PENDING = 1;
    // "in_progress"
    STATUS_IN_PROGRESS = 2;
    // "complete"
    STATUS_COMPLETE = 3;
    // "error"
    STATUS_ERROR = 4;
    // "cancelled"
    STATUS_CANCELLED = 5;
  }
  // Allowed values of unarchive_status; REST/JSON uses the lowercase value shown in each comment.
  enum UnarchiveStatus {
    UNARCHIVE_STATUS_UNSPECIFIED = 0;
    // "pending"
    UNARCHIVE_STATUS_PENDING = 1;
    // "in_progress"
    UNARCHIVE_STATUS_IN_PROGRESS = 2;
    // "complete"
    UNARCHIVE_STATUS_COMPLETE = 3;
    // "error"
    UNARCHIVE_STATUS_ERROR = 4;
  }
}
