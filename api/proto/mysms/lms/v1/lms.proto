  // List PlagiarismReports.
  rpc ListPlagiarismReports(ListPlagiarismReportsRequest) returns (ListPlagiarismReportsResponse);
  // Get PlagiarismReport.
  rpc GetPlagiarismReport(GetPlagiarismReportRequest) returns (GetPlagiarismReportResponse);
  // Send a submitted file to the plagiarism provider.
  rpc SubmitForPlagiarismCheck(SubmitForPlagiarismCheckRequest) returns (SubmitForPlagiarismCheckResponse);
  // Signed link to the provider report viewer.
  rpc GetPlagiarismReportLink(GetPlagiarismReportLinkRequest) returns (GetPlagiarismReportLinkResponse);
  // Provider callback when a similarity report is ready. Authenticated by the provider signature over the raw body with the account's shared secret (tenant and account resolved from the stored provider submission id); requests outside a 5-minute replay window are rejected; processed idempotently.
  rpc ReceivePlagiarismWebhook(ReceivePlagiarismWebhookRequest) returns (ReceivePlagiarismWebhookResponse);
}

