  rpc CreateDriveItem(CreateDriveItemRequest) returns (CreateDriveItemResponse);
  // Update DriveItem.
  rpc UpdateDriveItem(UpdateDriveItemRequest) returns (UpdateDriveItemResponse);
  // Soft-delete DriveItem.
  rpc DeleteDriveItem(DeleteDriveItemRequest) returns (DeleteDriveItemResponse);
  // List DriveItemShares.
  rpc ListDriveItemShares(ListDriveItemSharesRequest) returns (ListDriveItemSharesResponse);
  // Create DriveItemShare.
  rpc CreateDriveItemShare(CreateDriveItemShareRequest) returns (CreateDriveItemShareResponse);
  // Update DriveItemShare.
  rpc UpdateDriveItemShare(UpdateDriveItemShareRequest) returns (UpdateDriveItemShareResponse);
  // Soft-delete DriveItemShare.
  rpc DeleteDriveItemShare(DeleteDriveItemShareRequest) returns (DeleteDriveItemShareResponse);
  // Share a drive item with users.
  rpc ShareDriveItem(ShareDriveItemRequest) returns (ShareDriveItemResponse);
}

// OperationService: long-running operations started in this module.
service OperationService {
  // Live status of a long-running operation started in this module.
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  // Long-running operations of this module started by the caller.
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
  // Request cancellation of a running operation started in this module.
  rpc CancelOperation(CancelOperationRequest) returns (CancelOperationResponse);
}

message GetOperationRequest {
  // Path parameter operationId.
  string operation_id = 1;
}

message GetOperationResponse {
  mysms.common.v1.Operation result = 1;
}

message ListOperationsRequest {
  // Filter by kind.
  optional string kind = 1;
  // Page size.
  optional int32 page_size = 2;
  // Page token.
  optional string page_token = 3;
}

message ListOperationsResponse {
  repeated mysms.common.v1.Operation items = 1;
  // Cursor for the next page (paged queries).
  string next_page_token = 2;
}

message CancelOperationRequest {
  // Path parameter operationId.
  string operation_id = 1;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 2;
}

message CancelOperationResponse {
  mysms.common.v1.Operation result = 1;
}
