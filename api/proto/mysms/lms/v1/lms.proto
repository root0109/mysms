// ImportExportJobService: operations on the ImportExportJob aggregate.
service ImportExportJobService {
  // List ImportExportJobs.
  rpc ListImportExportJobs(ListImportExportJobsRequest) returns (ListImportExportJobsResponse);
  // Get ImportExportJob.
  rpc GetImportExportJob(GetImportExportJobRequest) returns (GetImportExportJobResponse);
  // Create ImportExportJob.
  rpc CreateImportExportJob(CreateImportExportJobRequest) returns (CreateImportExportJobResponse);
  // Cancel a pending job.
  rpc CancelImportExportJob(CancelImportExportJobRequest) returns (CancelImportExportJobResponse);
  // Restore an archived cohort from its export.
  rpc RestoreCohortArchive(RestoreCohortArchiveRequest) returns (RestoreCohortArchiveResponse);
  // Download the export package or the import error log.
  rpc GetJobPackage(GetJobPackageRequest) returns (GetJobPackageResponse);
}
// AccessLogService: operations on the AccessLog aggregate.
service AccessLogService {
  // List AccessLogs.
  rpc ListAccessLogs(ListAccessLogsRequest) returns (ListAccessLogsResponse);
  // Get AccessLog.
  rpc GetAccessLog(GetAccessLogRequest) returns (GetAccessLogResponse);
}
// DriveItemService: operations on the DriveItem aggregate.
service DriveItemService {
  // List DriveItems.
  rpc ListDriveItems(ListDriveItemsRequest) returns (ListDriveItemsResponse);
