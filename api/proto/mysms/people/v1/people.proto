  optional string ip_address = 11;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 12;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 13;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 14;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 15;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 16;
  // Allowed values of purpose; REST/JSON uses the lowercase value shown in each comment.
  enum Purpose {
    PURPOSE_UNSPECIFIED = 0;
    // "data_processing"
    PURPOSE_DATA_PROCESSING = 1;
    // "photo_video_publication"
    PURPOSE_PHOTO_VIDEO_PUBLICATION = 2;
    // "public_profile"
    PURPOSE_PUBLIC_PROFILE = 3;
    // "marketing"
    PURPOSE_MARKETING = 4;
    // "third_party_sharing"
    PURPOSE_THIRD_PARTY_SHARING = 5;
    // "sms_whatsapp_messages"
    PURPOSE_SMS_WHATSAPP_MESSAGES = 6;
    // "biometric_data"
    PURPOSE_BIOMETRIC_DATA = 7;
  }
  // Allowed values of channel; REST/JSON uses the lowercase value shown in each comment.
  enum Channel {
    CHANNEL_UNSPECIFIED = 0;
    // "web"
    CHANNEL_WEB = 1;
    // "mobile_app"
    CHANNEL_MOBILE_APP = 2;
    // "paper_form"
    CHANNEL_PAPER_FORM = 3;
    // "email"
    CHANNEL_EMAIL = 4;
    // "in_person"
    CHANNEL_IN_PERSON = 5;
  }
}

