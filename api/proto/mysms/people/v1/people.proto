  string given_by_person_id = 3;
  // What the consent covers.
  Purpose purpose = 4;
  // Version of the privacy notice / consent text shown.
  string policy_version = 5;
  // When consent was given.
  google.protobuf.Timestamp granted_at = 6;
  // When consent was withdrawn (NULL = in force).
  google.protobuf.Timestamp withdrawn_at = 7;
  // How consent was captured.
  Channel channel = 8;
  // Staff who recorded a paper / in-person consent. [UUID]
  optional string recorded_by_user_id = 9;
  // Signed form or other evidence. [UUID]
  optional string evidence_file_id = 10;
