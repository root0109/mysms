// File-upload limits per role and feature (maximum size, allowed extensions).
message UploadPolicy {
  // Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback). [UUID] Output only.
  string id = 1;
  // Role the limit applies to (NULL = everyone). [UUID]
  optional string role_id = 2;
  // Feature area (assignments, quiz media, profile picture...).
  string module_code = 3;
  // Specific operation within the feature (e.g. create_question_image).
  optional string operation_code = 4;
  // Maximum file size in bytes (NULL = platform default).
  optional int64 max_size_bytes = 5;
  // Comma-separated allowed extensions (NULL = platform default list).
  optional string allowed_extensions = 6;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 7;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
