  string id = 1;
  // Tag family, e.g. general, post, library_media, lms_course.
  string tag_type = 2;
  // Tag label.
  string name = 3;
  // URL-safe tag key.
  string slug = 4;
  // Localised name/slug values keyed by locale.
  google.protobuf.Value translations = 5;
  // Display order.
  optional int32 sort_order = 6;
  // Short code (e.g. subject tag code).
  optional string code = 12;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 7;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 8;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 9;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 10;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 11;
}

