// Immutable audit trail of changes and actions.
message AuditLog {
  // Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback). [UUID] Output only.
  string id = 1;
  // Log channel / category.
  optional string log_name = 2;
  // Human-readable action description.
  string description = 3;
  // Event name, e.g. created, updated, deleted.
  optional string event = 4;
  // Polymorphic subject table name.
  optional string subject_type = 5;
  // Polymorphic subject record id. [UUID]
  optional string subject_id = 6;
  // Polymorphic actor type (normally iam.user_account).
  optional string causer_type = 7;
  // Polymorphic actor record id. [UUID]
  optional string causer_id = 8;
  // Before/after values and context.
  google.protobuf.Value properties = 9;
  // Logical id grouping entries written in one operation. [UUID]
  optional string batch_id = 10;
  // Client IP.
  optional string ip_address = 11;
  // When the action happened.
  google.protobuf.Timestamp occurred_at = 12;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 13;
}

