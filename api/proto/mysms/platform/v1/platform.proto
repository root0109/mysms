// Inbound enquiry / demo request from a prospective customer.
message SalesEnquiry {
  // Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback). [UUID] Output only.
  string id = 1;
  // Person making the enquiry.
  string contact_name = 2;
  // Contact e-mail.
  string email = 3;
  // Contact phone.
  string phone = 4;
  // School / organisation name.
  string organisation_name = 5;
  // Contact's role.
  string designation = 6;
  // How the enquiry arrived (web, phone, event).
  optional string channel = 7;
  // Enquiry text.
  optional string message = 8;
  // Sales follow-up state.
  Status status = 9;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 10;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 11;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 12;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 13;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 14;
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "new"
    STATUS_NEW = 1;
    // "contacted"
    STATUS_CONTACTED = 2;
    // "qualified"
    STATUS_QUALIFIED = 3;
    // "converted"
    STATUS_CONVERTED = 4;
    // "closed"
    STATUS_CLOSED = 5;
  }
}

