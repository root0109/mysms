  optional string updated_by = 10;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 11;
}

// Tombstone of a hard-deleted row, so offline clients and integrations can remove it in delta sync. Soft-deleted rows are synced through deleted_at instead.
message DeletionLog {
  // Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback). [UUID] Output only.
  string id = 1;
  // Table of the deleted row (schema.table).
  string entity_type = 2;
  // Polymorphic id of the deleted row. [UUID]
  string entity_id = 3;
  // Cohort context, used to route the tombstone to the right devices. [UUID]
  optional string cohort_id = 4;
  // When the row was deleted.
  google.protobuf.Timestamp deleted_at_ts = 5;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 6;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 7;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 8;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 9;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 10;
}

