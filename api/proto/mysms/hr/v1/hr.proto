  string etag = 20;
  // Allowed values of day_part; REST/JSON uses the lowercase value shown in each comment.
  enum DayPart {
    DAY_PART_UNSPECIFIED = 0;
    // "full_day"
    DAY_PART_FULL_DAY = 1;
    // "forenoon"
    DAY_PART_FORENOON = 2;
    // "afternoon"
    DAY_PART_AFTERNOON = 3;
  }
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "pending"
    STATUS_PENDING = 1;
    // "approved"
    STATUS_APPROVED = 2;
    // "rejected"
    STATUS_REJECTED = 3;
    // "cancelled"
    STATUS_CANCELLED = 4;
    // "completed"
    STATUS_COMPLETED = 5;
  }
}

// Leave entitlement and usage for one staff member, leave type and year; updated when applications are approved.
message LeaveBalance {
  // Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback). [UUID] Output only.
  string id = 1;
  // Staff member. [UUID]
  string staff_id = 2;
  // Leave type. [UUID]
  string leave_type_id = 3;
  // Year the balance is tracked for. [UUID]
  optional string academic_year_id = 4;
  // Days granted for the year. [Decimal string]
  string entitled_days = 5;
  // Days consumed by approved applications. [Decimal string] Output only.
  optional string used_days = 6;
  // Days carried in from the previous year. [Decimal string]
  optional string carried_forward_days = 7;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 8;
  // User account that created the row (audit reference). [UUID] Output only.
  optional string created_by = 9;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 10;
  // User account that last updated the row (audit reference). [UUID] Output only.
  optional string updated_by = 11;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 12;
}

message ListLeaveBalancesRequest {
  // Page size (1-500, default 50).
  int32 page_size = 1;
  // Cursor from next_page_token.
  string page_token = 2;
  // Filter expression (AIP-160 subset).
  string filter = 3;
  // Ordering, e.g. "create_time desc".
  string order_by = 4;
}
message ListLeaveBalancesResponse {
  repeated LeaveBalance items = 1;
  // Cursor for the next page; empty on the last page.
  string next_page_token = 2;
  // Total matching items.
  int32 total_size = 3;
}

message GetLeaveBalanceRequest {
  // LeaveBalance id (UUID).
  string id = 1;
}
message GetLeaveBalanceResponse {
  LeaveBalance leave_balance = 1;
}

message CreateLeaveBalanceRequest {
  LeaveBalance leave_balance = 1;
  // Idempotency key (UUID); retries with the same key return the original result.
  string request_id = 2;
  // Validate without persisting.
  bool validate_only = 3;
}
message CreateLeaveBalanceResponse {
  LeaveBalance leave_balance = 1;
}

message UpdateLeaveBalanceRequest {
  // Resource with id and etag set.
  LeaveBalance leave_balance = 1;
  // Fields to update; empty = all fields present.
  google.protobuf.FieldMask update_mask = 2;
  // Validate without persisting.
  bool validate_only = 3;
}
message UpdateLeaveBalanceResponse {
  LeaveBalance leave_balance = 1;
}

// LeaveBalanceService: operations on the LeaveBalance aggregate.
service LeaveBalanceService {
  // List LeaveBalances.
  rpc ListLeaveBalances(ListLeaveBalancesRequest) returns (ListLeaveBalancesResponse);
  // Get LeaveBalance.
  rpc GetLeaveBalance(GetLeaveBalanceRequest) returns (GetLeaveBalanceResponse);
  // Create LeaveBalance.
  rpc CreateLeaveBalance(CreateLeaveBalanceRequest) returns (CreateLeaveBalanceResponse);
  // Update LeaveBalance.
  rpc UpdateLeaveBalance(UpdateLeaveBalanceRequest) returns (UpdateLeaveBalanceResponse);
}
