// Invoice raised to a student / guardian / user (fees, library fines, purchases): the REST contract's Invoice schema of
// library, field for field the same as mysms.finance.v1.Invoice (same numbers), so library's contract stands alone.
message Invoice {
  // Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback). [UUID] Output only.
  string id = 1;
  // Institution. [UUID]
  optional string institution_id = 2;
  // Invoice number.
  string invoice_number = 3;
  // Billed student. [UUID]
  optional string student_id = 4;
  // Billed user (guardian / student). [UUID]
  optional string bill_to_user_id = 5;
  // Name on the invoice.
  string bill_to_name = 6;
  // Invoice date. [ISO-8601 date (YYYY-MM-DD)]
  string invoice_date = 7;
  // Due date. [ISO-8601 date (YYYY-MM-DD)]
  optional string due_date = 8;
  // Currency. [UUID]
  string currency_id = 9;
  // Sum of line amounts. [Decimal string]
  string subtotal = 10;
  // Discounts. [Decimal string]
  string discount_total = 11;
  // Taxes. [Decimal string]
  string tax_total = 12;
  // Grand total. [Decimal string]
  string total = 13;
  // Paid so far. [Decimal string]
  string amount_paid = 14;
  // State. Changed only through the workflow operations. Output only.
  Status status = 15;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 16;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 17;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 18;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 19;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 20;
  // invoice or credit_note. A posted invoice is never edited; corrections are credit notes. Output only.
  InvoiceType invoice_type = 21;
  // Invoice a credit note corrects. [UUID] Output only.
  optional string credit_for_invoice_id = 22;
  // When the invoice became a posted (immutable) document. Output only.
  google.protobuf.Timestamp posted_at = 23;
  // When it was cancelled (allowed only while draft). Output only.
  google.protobuf.Timestamp cancelled_at = 24;
  // Rendered PDF of the issued document. [UUID] Output only.
  optional string document_file_id = 25;
  // Allowed values of invoice_type; REST/JSON uses the lowercase value shown in each comment.
  enum InvoiceType {
    INVOICE_TYPE_UNSPECIFIED = 0;
    // "invoice"
    INVOICE_TYPE_INVOICE = 1;
    // "credit_note"
    INVOICE_TYPE_CREDIT_NOTE = 2;
  }
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "draft"
    STATUS_DRAFT = 1;
    // "posted"
    STATUS_POSTED = 2;
    // "partially_paid"
    STATUS_PARTIALLY_PAID = 3;
    // "paid"
    STATUS_PAID = 4;
    // "cancelled"
    STATUS_CANCELLED = 5;
  }
}

