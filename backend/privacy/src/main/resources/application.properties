# The privacy service's configuration (JAVA-CODING-RULES §2.1). Every value is a default over an
# environment variable of DEPLOYMENT.md §4: an operator's application.properties beside the jar, environment
# variables, system properties and the command line override any of it. In the monolith, app combines this file
# with every other module's and sets the process-wide keys in its own application.properties.

spring.application.name=privacy
spring.threads.virtual.enabled=true
server.port=${PORT:8080}
server.shutdown=graceful
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# authentication (auth-client): the OIDC issuer has no default, a service refuses to start without it; the OpenAPI
# document and Swagger UI stay closed unless the operator opens them
mysms.auth.issuer=${MYSMS_AUTH_ISSUER}
mysms.auth.jwk-set-uri=${MYSMS_AUTH_JWK_SET_URI:}
mysms.auth.api-docs=${MYSMS_API_DOCS:false}
mysms.auth.modules[0]=privacy
# the deployed release, published with this module's API-permission catalogue (JAVA-CODING-RULES §16.2)
mysms.auth.release=${MYSMS_RELEASE:development}
# how often the catalogue is published again, so iam can retire what no running release serves (below iam's
# mysms.iam.api-permission.retire-after)
mysms.auth.catalogue-interval=${MYSMS_CATALOGUE_INTERVAL:6h}
# how long the permissions filter keeps a role's permission codes before asking iam again (a token issued after a
# role change refreshes it at once)
mysms.auth.role-cache-ttl=${MYSMS_ROLE_CACHE_TTL:PT1M}
# iam's role data, read by the permissions filter (auth-client) on a cache miss
grpc.client.iam-service.address=${MYSMS_IAM_GRPC_ADDRESS:dns:///identity-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_IDENTITY_SERVICE_PORT_RPC:9112}}
grpc.client.iam-service.negotiationType=PLAINTEXT
# service identity: where iam issues service tokens (blank = no service calls), and this module's client secret
mysms.auth.token-uri=${MYSMS_AUTH_TOKEN_URI:}
mysms.privacy.service-client.secret=${MYSMS_PRIVACY_SERVICE_CLIENT_SECRET:}

# gRPC server (JAVA-CODING-RULES §10.4): health on, reflection only when the operator opens it, REST's 10 MB body limit
grpc.server.port=${MYSMS_GRPC_SERVER_PORT:9112}
grpc.server.health-service-enabled=true
grpc.server.reflection-service-enabled=${MYSMS_GRPC_REFLECTION:false}
grpc.server.shutdown-grace-period=20s
grpc.server.max-inbound-message-size=10MB
# gRPC clients: every call waits at most this long when its stub sets no deadline
mysms.grpc.client.deadline=${MYSMS_GRPC_CLIENT_DEADLINE:10s}

# events: rabbitmq (default) | google-pubsub | in-process (one JVM) | none (tests only); a microservice publishes as
# its module's broker user (blank = mysms-<module>)
mysms.events.bus=${MYSMS_EVENTS_BUS:rabbitmq}
mysms.events.rabbitmq.uri=${MYSMS_RABBITMQ_URI:}
mysms.events.rabbitmq.publisher-user=${MYSMS_RABBITMQ_PUBLISHER_USER:}
mysms.events.google-pubsub.project-id=${MYSMS_EVENTS_GCP_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
mysms.events.google-pubsub.emulator-host=${PUBSUB_EMULATOR_HOST:}

# background work (core): monthly partitions of the module's database (DEPLOYMENT.md §5.6) and the scheduled-job
# runtime (ROADMAP ARC-4); a replica with jobs off leaves the module's scheduled runs to the others
mysms.partitions.enabled=${MYSMS_PARTITIONS_ENABLED:true}
mysms.partitions.interval=${MYSMS_PARTITIONS_INTERVAL:24h}
mysms.partitions.months-ahead=${MYSMS_PARTITIONS_MONTHS_AHEAD:3}
mysms.partitions.retention-months=${MYSMS_PARTITIONS_RETENTION_MONTHS:0}
mysms.jobs.enabled=${MYSMS_JOBS_ENABLED:true}
mysms.jobs.poll-interval=${MYSMS_JOBS_POLL_INTERVAL:1m}
mysms.jobs.lease=${MYSMS_JOBS_LEASE:30m}
mysms.jobs.batch-size=${MYSMS_JOBS_BATCH_SIZE:20}

# the age, in years, at which a person becomes an adult: privacy.subject's status and majority date
mysms.privacy.age-of-majority=${MYSMS_PRIVACY_AGE_OF_MAJORITY:18}
# how often each tenant's scheduled privacy jobs run (core JobRuntime): minors who came of age become adults, and
# consents past their valid_until expire
mysms.privacy.majority-job.interval=${MYSMS_PRIVACY_MAJORITY_JOB_INTERVAL:1h}
mysms.privacy.consent-expiry-job.interval=${MYSMS_PRIVACY_CONSENT_EXPIRY_JOB_INTERVAL:1h}
# the response deadline of a rights request per type, from its submission (ISO-8601 periods); the legal periods are
# to verify by counsel
mysms.privacy.rights.sla.access=${MYSMS_PRIVACY_RIGHTS_SLA_ACCESS:P30D}
mysms.privacy.rights.sla.correction=${MYSMS_PRIVACY_RIGHTS_SLA_CORRECTION:P30D}
mysms.privacy.rights.sla.grievance=${MYSMS_PRIVACY_RIGHTS_SLA_GRIEVANCE:P30D}
mysms.privacy.rights.sla.nomination=${MYSMS_PRIVACY_RIGHTS_SLA_NOMINATION:P30D}
mysms.privacy.rights.sla.erasure=${MYSMS_PRIVACY_RIGHTS_SLA_ERASURE:P30D}
mysms.privacy.rights.sla.export=${MYSMS_PRIVACY_RIGHTS_SLA_EXPORT:P30D}
mysms.privacy.rights.sla.withdraw-all=${MYSMS_PRIVACY_RIGHTS_SLA_WITHDRAW_ALL:P30D}
# the fulfilment of erasure and export requests (design §9.2): one task per module holding personal data, the first
# wave (stopping messages and sign-in) before the rest; a task unanswered this long after its dispatch is dispatched
# again by the sweep, which runs per tenant every sweep-interval. Only modules with a privacy task handler are listed
# (a listed module without one would hold every request in_progress); retention runs go to the same modules
mysms.privacy.erasure.modules=${MYSMS_PRIVACY_ERASURE_MODULES:iam,comms,people,sis,hr,payroll,time_attendance,admission,attendance,assessment,academics,careers,finance,frontoffice,library,platform,transport}
mysms.privacy.erasure.first-wave=${MYSMS_PRIVACY_ERASURE_FIRST_WAVE:iam,comms}
mysms.privacy.erasure.redispatch-after=${MYSMS_PRIVACY_ERASURE_REDISPATCH_AFTER:PT24H}
# a failed answer waits retry-delay, doubled per attempt (at most redispatch-after), before the sweep dispatches it
# again
mysms.privacy.erasure.retry-delay=${MYSMS_PRIVACY_ERASURE_RETRY_DELAY:PT5M}
mysms.privacy.erasure.sweep-interval=${MYSMS_PRIVACY_ERASURE_SWEEP_INTERVAL:15m}
# how often each tenant's retention policies send their cutoffs to the modules holding the data (design §10)
mysms.privacy.retention-job.interval=${MYSMS_PRIVACY_RETENTION_JOB_INTERVAL:24h}

# the module's database: its own variable first, then the shared one (DEPLOYMENT.md §4); the application role gets
# DML grants only, Flyway runs as the schema owner, the outbox relay as mysms_relay; a blank replica = every read on
# the primary; statements slower than slow-statement are named in the log (0 = off)
mysms.privacy.datasource.url=${MYSMS_PRIVACY_DB_URL:${MYSMS_DB_URL:jdbc:postgresql://localhost:5432/mysms}}
mysms.privacy.datasource.username=${MYSMS_PRIVACY_DB_USER:${MYSMS_DB_USER:mysms}}
mysms.privacy.datasource.password=${MYSMS_PRIVACY_DB_PASSWORD:${MYSMS_DB_PASSWORD:}}
mysms.privacy.datasource.maximum-pool-size=${MYSMS_PRIVACY_DB_POOL_SIZE:10}
mysms.privacy.datasource.slow-statement=${MYSMS_PRIVACY_DB_SLOW_STATEMENT:${MYSMS_DB_SLOW_STATEMENT:200ms}}
mysms.privacy.datasource.replica-url=${MYSMS_PRIVACY_DB_REPLICA_URL:${MYSMS_DB_REPLICA_URL:}}
mysms.privacy.datasource.replica-username=${MYSMS_PRIVACY_DB_REPLICA_USER:${MYSMS_DB_REPLICA_USER:}}
mysms.privacy.datasource.replica-password=${MYSMS_PRIVACY_DB_REPLICA_PASSWORD:${MYSMS_DB_REPLICA_PASSWORD:}}
mysms.privacy.datasource.migrate-username=${MYSMS_PRIVACY_DB_MIGRATE_USER:${MYSMS_DB_MIGRATE_USER:}}
mysms.privacy.datasource.migrate-password=${MYSMS_PRIVACY_DB_MIGRATE_PASSWORD:${MYSMS_DB_MIGRATE_PASSWORD:}}
mysms.privacy.datasource.relay-username=${MYSMS_PRIVACY_DB_RELAY_USER:${MYSMS_DB_RELAY_USER:}}
mysms.privacy.datasource.relay-password=${MYSMS_PRIVACY_DB_RELAY_PASSWORD:${MYSMS_DB_RELAY_PASSWORD:}}
