// MySMS gRPC contract of the privacy module (Privacy and Consent Centre).
syntax = "proto3";

package mysms.privacy.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "mysms/common/v1/common.proto";

option java_multiple_files = true;
option java_outer_classname = "PrivacyProto";
option java_package = "com.mysms.privacy.v1";

// PurposeService: the purpose catalogue with the calling tenant's setting of each purpose.
service PurposeService {
  // List Purposes.
  rpc ListPurposes(ListPurposesRequest) returns (ListPurposesResponse);
  // Get Purpose.
  rpc GetPurpose(GetPurposeRequest) returns (GetPurposeResponse);
  // Update the tenant's setting of a purpose.
  rpc UpdatePurpose(UpdatePurposeRequest) returns (UpdatePurposeResponse);
}

// ConsentDecisionService: whether a subject's data may be processed for a processing activity at a width.
service ConsentDecisionService {
  // Check Consent.
  rpc CheckConsent(CheckConsentRequest) returns (CheckConsentResponse);
  // Batch Check Consent (up to 1000 subjects).
  rpc BatchCheckConsent(BatchCheckConsentRequest) returns (BatchCheckConsentResponse);
  // Get Purpose Status.
  rpc GetPurposeStatus(GetPurposeStatusRequest) returns (GetPurposeStatusResponse);
  // List Subjects With Consent.
  rpc ListSubjectsWithConsent(ListSubjectsWithConsentRequest) returns (ListSubjectsWithConsentResponse);
}

// ProcessingActivityService: the processing register (RoPA-lite), the platform's catalogue of processing activities.
service ProcessingActivityService {
  // List Processing Activities.
  rpc ListProcessingActivities(ListProcessingActivitiesRequest) returns (ListProcessingActivitiesResponse);
  // The whole register (RoPA) as CSV.
  rpc GetProcessingRegisterExport(GetProcessingRegisterExportRequest) returns (GetProcessingRegisterExportResponse);
}

// NoticeService: the tenant's privacy notices, their versions and the versions' translations.
service NoticeService {
  // List Notices.
  rpc ListNotices(ListNoticesRequest) returns (ListNoticesResponse);
  // Get Notice.
  rpc GetNotice(GetNoticeRequest) returns (GetNoticeResponse);
  // Create Notice.
  rpc CreateNotice(CreateNoticeRequest) returns (CreateNoticeResponse);
  // Update Notice.
  rpc UpdateNotice(UpdateNoticeRequest) returns (UpdateNoticeResponse);
  // Soft-delete Notice.
  rpc DeleteNotice(DeleteNoticeRequest) returns (DeleteNoticeResponse);
  // List NoticeVersions.
  rpc ListNoticeVersions(ListNoticeVersionsRequest) returns (ListNoticeVersionsResponse);
  // Get NoticeVersion.
  rpc GetNoticeVersion(GetNoticeVersionRequest) returns (GetNoticeVersionResponse);
  // Create NoticeVersion (a draft).
  rpc CreateNoticeVersion(CreateNoticeVersionRequest) returns (CreateNoticeVersionResponse);
  // Update a draft NoticeVersion.
  rpc UpdateNoticeVersion(UpdateNoticeVersionRequest) returns (UpdateNoticeVersionResponse);
  // Publish a draft NoticeVersion; the previously active version is retired.
  rpc PublishNoticeVersion(PublishNoticeVersionRequest) returns (PublishNoticeVersionResponse);
  // List NoticeTranslations.
  rpc ListNoticeTranslations(ListNoticeTranslationsRequest) returns (ListNoticeTranslationsResponse);
  // Get NoticeTranslation.
  rpc GetNoticeTranslation(GetNoticeTranslationRequest) returns (GetNoticeTranslationResponse);
  // Create NoticeTranslation.
  rpc CreateNoticeTranslation(CreateNoticeTranslationRequest) returns (CreateNoticeTranslationResponse);
  // Update NoticeTranslation.
  rpc UpdateNoticeTranslation(UpdateNoticeTranslationRequest) returns (UpdateNoticeTranslationResponse);
  // Soft-delete NoticeTranslation.
  rpc DeleteNoticeTranslation(DeleteNoticeTranslationRequest) returns (DeleteNoticeTranslationResponse);
}

// ConsentService: the signed-in person's consent centre, and the staff's consent records of the tenant.
service ConsentService {
  // List the caller's consents: per subject they may decide for and purpose the tenant has switched on.
  rpc ListMyConsents(ListMyConsentsRequest) returns (ListMyConsentsResponse);
  // Record the caller's decision for themself (an adult) or a minor they are the legal guardian of.
  rpc RecordMyConsent(RecordMyConsentRequest) returns (RecordMyConsentResponse);
  // Withdraw one of the caller's own live decisions.
  rpc WithdrawMyConsent(WithdrawMyConsentRequest) returns (WithdrawMyConsentResponse);
  // The active version of a notice of the tenant, in a language (English when it has no such translation).
  rpc GetMyNotice(GetMyNoticeRequest) returns (GetMyNoticeResponse);
  // List ConsentRecords.
  rpc ListConsentRecords(ListConsentRecordsRequest) returns (ListConsentRecordsResponse);
  // Get ConsentRecord.
  rpc GetConsentRecord(GetConsentRecordRequest) returns (GetConsentRecordResponse);
  // Record a signed paper form on its giver's behalf (unverified until another staff member verifies it).
  rpc RecordConsentOnBehalf(RecordConsentOnBehalfRequest) returns (RecordConsentOnBehalfResponse);
  // Verify an unverified paper consent recorded by another staff member.
  rpc VerifyConsentRecord(VerifyConsentRecordRequest) returns (VerifyConsentRecordResponse);
}

// RightsRequestService: the signed-in person's own rights requests, and the staff's rights requests of the tenant.
service RightsRequestService {
  // Submit a rights request for oneself (an adult) or a minor one is the legal guardian of.
  rpc SubmitMyRequest(SubmitMyRequestRequest) returns (SubmitMyRequestResponse);
  // List the caller's own rights requests, newest first.
  rpc ListMyRequests(ListMyRequestsRequest) returns (ListMyRequestsResponse);
  // Get one of the caller's own rights requests.
  rpc GetMyRequest(GetMyRequestRequest) returns (GetMyRequestResponse);
  // The access summary the school sent in answer to one of the caller's own access requests, once fulfilled.
  rpc GetMyAccessSummary(GetMyAccessSummaryRequest) returns (GetMyAccessSummaryResponse);
  // List RightsRequests.
  rpc ListRightsRequests(ListRightsRequestsRequest) returns (ListRightsRequestsResponse);
  // Get RightsRequest.
  rpc GetRightsRequest(GetRightsRequestRequest) returns (GetRightsRequestResponse);
  // The access summary of an access request: the one kept on it once fulfilled, until then a preview.
  rpc GetAccessSummary(GetAccessSummaryRequest) returns (GetAccessSummaryResponse);
  // Record that the requester of a submitted request was verified in person or by document.
  rpc VerifyRightsRequestIdentity(VerifyRightsRequestIdentityRequest) returns (VerifyRightsRequestIdentityResponse);
  // Assign a verified request, or reassign one in progress, to a staff member.
  rpc AssignRightsRequest(AssignRightsRequestRequest) returns (AssignRightsRequestResponse);
  // Move an open request's response deadline later, with the reason.
  rpc ExtendRightsRequest(ExtendRightsRequestRequest) returns (ExtendRightsRequestResponse);
  // Reject a submitted or verified request with a reason code.
  rpc RejectRightsRequest(RejectRightsRequestRequest) returns (RejectRightsRequestResponse);
  // Close a request in progress with its outcome.
  rpc CloseRightsRequest(CloseRightsRequestRequest) returns (CloseRightsRequestResponse);
  // Answer an access request in progress with the subject's access summary and close it as fulfilled.
  rpc FulfilAccessRequest(FulfilAccessRequestRequest) returns (FulfilAccessRequestResponse);
  // Start fulfilling an erasure or export request in progress: one task per module holding personal data.
  rpc StartRightsRequestFulfilment(StartRightsRequestFulfilmentRequest) returns (StartRightsRequestFulfilmentResponse);
  // Answer a withdraw-all request in progress by withdrawing every live consent the requester gave about the subject.
  rpc FulfilWithdrawAllRequest(FulfilWithdrawAllRequestRequest) returns (FulfilWithdrawAllRequestResponse);
  // Dispatch a failed or unanswered task of an erasure or export request to its module again.
  rpc RetryRightsRequestTask(RetryRightsRequestTaskRequest) returns (RetryRightsRequestTaskResponse);
}

// NomineeService: the signed-in adult's nominee, who may exercise their rights on their death or incapacity.
service NomineeService {
  // Get the caller's active nominee.
  rpc GetMyNominee(GetMyNomineeRequest) returns (GetMyNomineeResponse);
  // Name the caller's nominee, replacing the active one.
  rpc SetMyNominee(SetMyNomineeRequest) returns (SetMyNomineeResponse);
  // Revoke the caller's active nominee.
  rpc RevokeMyNominee(RevokeMyNomineeRequest) returns (RevokeMyNomineeResponse);
}

// BreachService: the tenant's breach register, kept by the data protection officer.
service BreachService {
  // List Breaches.
  rpc ListBreaches(ListBreachesRequest) returns (ListBreachesResponse);
  // Get Breach.
  rpc GetBreach(GetBreachRequest) returns (GetBreachResponse);
  // Report a breach into the register; its Board report is due 72 hours after the school became aware.
  rpc ReportBreach(ReportBreachRequest) returns (ReportBreachResponse);
  // Update what is known of an open breach.
  rpc UpdateBreach(UpdateBreachRequest) returns (UpdateBreachResponse);
  // Record that a reported breach was triaged.
  rpc TriageBreach(TriageBreachRequest) returns (TriageBreachResponse);
  // Record that a triaged breach is contained.
  rpc ContainBreach(ContainBreachRequest) returns (ContainBreachResponse);
  // Record a notice about the breach sent outside MySMS.
  rpc RecordBreachNotification(RecordBreachNotificationRequest) returns (RecordBreachNotificationResponse);
  // Close a breach once the Board's detailed report and the principals' notice are recorded.
  rpc CloseBreach(CloseBreachRequest) returns (CloseBreachResponse);
  // Record that triage found a triaged breach not to be a personal data breach.
  rpc MarkBreachNotABreach(MarkBreachNotABreachRequest) returns (MarkBreachNotABreachResponse);
}

// ConsentCoverageService: how far a purpose is covered by consent, in counts only.
service ConsentCoverageService {
  // Per width, how many data principals are allowed, denied by reason and not answered.
  rpc GetConsentCoverage(GetConsentCoverageRequest) returns (GetConsentCoverageResponse);
}

// LegalHoldService: what erasure and retention must keep, and the modules' check of the holds that apply.
service LegalHoldService {
  // List LegalHolds.
  rpc ListLegalHolds(ListLegalHoldsRequest) returns (ListLegalHoldsResponse);
  // Get LegalHold.
  rpc GetLegalHold(GetLegalHoldRequest) returns (GetLegalHoldResponse);
  // Place a legal hold on a subject's data, a data category or a set of records.
  rpc PlaceLegalHold(PlaceLegalHoldRequest) returns (PlaceLegalHoldResponse);
  // Move an active hold's review date.
  rpc UpdateLegalHold(UpdateLegalHoldRequest) returns (UpdateLegalHoldResponse);
  // Release an active legal hold.
  rpc ReleaseLegalHold(ReleaseLegalHoldRequest) returns (ReleaseLegalHoldResponse);
  // The active holds that may cover a subject's data (internal: called with a service token).
  rpc ListActiveHolds(ListActiveHoldsRequest) returns (ListActiveHoldsResponse);
}

// RetentionService: the retention policies with the tenant's setting of each, and the daily retention runs.
service RetentionService {
  // List RetentionPolicies.
  rpc ListRetentionPolicies(ListRetentionPoliciesRequest) returns (ListRetentionPoliciesResponse);
  // Get RetentionPolicy.
  rpc GetRetentionPolicy(GetRetentionPolicyRequest) returns (GetRetentionPolicyResponse);
  // Set the tenant's own period and action of a retention policy, never below its legal floor.
  rpc UpdateRetentionPolicy(UpdateRetentionPolicyRequest) returns (UpdateRetentionPolicyResponse);
  // List RetentionRuns.
  rpc ListRetentionRuns(ListRetentionRunsRequest) returns (ListRetentionRunsResponse);
}

message ListPurposesRequest {
  // Filter expression (AIP-160 subset).
  string filter = 3;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 5;
}
message ListPurposesResponse {
  repeated Purpose items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 4;
}

message ListProcessingActivitiesRequest {
  // Filter expression (AIP-160 subset).
  string filter = 3;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 5;
}
message ListProcessingActivitiesResponse {
  repeated ProcessingActivity items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 4;
}

message GetPurposeRequest {
  // Purpose id (UUID).
  string id = 1;
}
message GetPurposeResponse {
  Purpose purpose = 1;
}

message UpdatePurposeRequest {
  // Purpose with id and etag set ("0" while the tenant has never set it).
  Purpose purpose = 1;
  // Fields to update (enabled, max_scope, notice_id); empty = all fields present.
  google.protobuf.FieldMask update_mask = 2;
  // Validate without persisting.
  bool validate_only = 3;
}
message UpdatePurposeResponse {
  Purpose purpose = 1;
}

message ListNoticesRequest {
  // Filter expression (AIP-160 subset).
  string filter = 3;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 5;
}
message ListNoticesResponse {
  repeated Notice items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 4;
}

message GetNoticeRequest {
  // Notice id (UUID).
  string id = 1;
}
message GetNoticeResponse {
  Notice notice = 1;
}

message CreateNoticeRequest {
  Notice notice = 1;
  // Idempotency key (UUID); retries with the same key return the original result.
  string request_id = 2;
  // Validate without persisting.
  bool validate_only = 3;
}
message CreateNoticeResponse {
  Notice notice = 1;
}

message UpdateNoticeRequest {
  // Resource with id and etag set.
  Notice notice = 1;
  // Fields to update; empty = all fields present.
  google.protobuf.FieldMask update_mask = 2;
  // Validate without persisting.
  bool validate_only = 3;
}
message UpdateNoticeResponse {
  Notice notice = 1;
}

message DeleteNoticeRequest {
  // Notice id (UUID).
  string id = 1;
  // ETag from the last read.
  string etag = 2;
}
message DeleteNoticeResponse {
}

message ListNoticeVersionsRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // Filter expression (AIP-160 subset).
  string filter = 4;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 6;
}
message ListNoticeVersionsResponse {
  repeated NoticeVersion items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 4;
}

message GetNoticeVersionRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // NoticeVersion id (UUID).
  string id = 2;
}
message GetNoticeVersionResponse {
  NoticeVersion notice_version = 1;
}

message CreateNoticeVersionRequest {
  // Notice id (UUID).
  string notice_id = 1;
  NoticeVersion notice_version = 2;
  // Idempotency key (UUID); retries with the same key return the original result.
  string request_id = 3;
  // Validate without persisting.
  bool validate_only = 4;
}
message CreateNoticeVersionResponse {
  NoticeVersion notice_version = 1;
}

message UpdateNoticeVersionRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // Resource with id and etag set.
  NoticeVersion notice_version = 2;
  // Fields to update; empty = all fields present.
  google.protobuf.FieldMask update_mask = 3;
  // Validate without persisting.
  bool validate_only = 4;
}
message UpdateNoticeVersionResponse {
  NoticeVersion notice_version = 1;
}

message PublishNoticeVersionRequest {
  // Path parameter noticeId.
  string notice_id = 1;
  // Path parameter noticeVersionId.
  string notice_version_id = 2;
  // Concurrency token from the last read (optional but recommended).
  optional string etag = 3;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 4;
}
message PublishNoticeVersionResponse {
  NoticeVersion notice_version = 1;
}

message ListNoticeTranslationsRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // NoticeVersion id (UUID).
  string notice_version_id = 2;
  // Filter expression (AIP-160 subset).
  string filter = 5;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 7;
}
message ListNoticeTranslationsResponse {
  repeated NoticeTranslation items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 4;
}

message GetNoticeTranslationRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // NoticeVersion id (UUID).
  string notice_version_id = 2;
  // NoticeTranslation id (UUID).
  string id = 3;
}
message GetNoticeTranslationResponse {
  NoticeTranslation notice_translation = 1;
}

message CreateNoticeTranslationRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // NoticeVersion id (UUID).
  string notice_version_id = 2;
  NoticeTranslation notice_translation = 3;
  // Idempotency key (UUID); retries with the same key return the original result.
  string request_id = 4;
  // Validate without persisting.
  bool validate_only = 5;
}
message CreateNoticeTranslationResponse {
  NoticeTranslation notice_translation = 1;
}

message UpdateNoticeTranslationRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // NoticeVersion id (UUID).
  string notice_version_id = 2;
  // Resource with id and etag set.
  NoticeTranslation notice_translation = 3;
  // Fields to update; empty = all fields present.
  google.protobuf.FieldMask update_mask = 4;
  // Validate without persisting.
  bool validate_only = 5;
}
message UpdateNoticeTranslationResponse {
  NoticeTranslation notice_translation = 1;
}

message DeleteNoticeTranslationRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // NoticeVersion id (UUID).
  string notice_version_id = 2;
  // NoticeTranslation id (UUID).
  string id = 3;
  // ETag from the last read.
  string etag = 4;
}
message DeleteNoticeTranslationResponse {
}

// Why personal data is processed: a catalogue purpose and the calling tenant's setting of it.
message Purpose {
  // Stable id of the catalogue purpose, the same in every environment. [UUID] Output only.
  string id = 1;
  // Purpose code, e.g. photo_video_publication. Output only.
  string code = 2;
  // Whether a consent names a width (class to public) or covers the whole tenant. Output only.
  ScopeKind scope_kind = 3;
  // Who decides the processing: the school or MySMS on its own account. Output only.
  Fiduciary fiduciary = 4;
  // Never allowed for a minor, not even with a guardian's consent. Output only.
  bool forbidden_for_minors = 5;
  // What a guardian's consent still covers once the student turns 18. Output only.
  MajorityGrace majority_grace = 6;
  // How long a consent lasts unless the notice says otherwise; absent = until withdrawn. Output only.
  optional int32 default_valid_months = 7;
  // Lifecycle of the catalogue purpose. Output only.
  Status status = 8;
  // Version of the catalogue purpose; incremented on a material change. Output only.
  int32 version = 9;
  // Whether the tenant processes data for the purpose.
  bool enabled = 10;
  // The widest width the tenant allows for a width purpose; absent = no ceiling.
  MaxScope max_scope = 11;
  // The notice shown when asking for consent to the purpose. [UUID]
  optional string notice_id = 12;
  // When the tenant last changed its setting; absent while it never has. Output only.
  google.protobuf.Timestamp update_time = 13;
  // Entity tag (version of the tenant's setting). Output only on reads; send back on update.
  string etag = 14;
  // Allowed values of scope_kind; REST/JSON uses the lowercase value shown in each comment.
  enum ScopeKind {
    SCOPE_KIND_UNSPECIFIED = 0;
    // "tenant"
    SCOPE_KIND_TENANT = 1;
    // "width"
    SCOPE_KIND_WIDTH = 2;
  }
  // Allowed values of fiduciary; REST/JSON uses the lowercase value shown in each comment.
  enum Fiduciary {
    FIDUCIARY_UNSPECIFIED = 0;
    // "platform"
    FIDUCIARY_PLATFORM = 1;
    // "tenant"
    FIDUCIARY_TENANT = 2;
  }
  // Allowed values of majority_grace; REST/JSON uses the lowercase value shown in each comment.
  enum MajorityGrace {
    MAJORITY_GRACE_UNSPECIFIED = 0;
    // "keep_narrow_widths"
    MAJORITY_GRACE_KEEP_NARROW_WIDTHS = 1;
    // "keep_published"
    MAJORITY_GRACE_KEEP_PUBLISHED = 2;
    // "none"
    MAJORITY_GRACE_NONE = 3;
  }
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "active"
    STATUS_ACTIVE = 1;
    // "deprecated"
    STATUS_DEPRECATED = 2;
    // "retired"
    STATUS_RETIRED = 3;
  }
  // Allowed values of max_scope; REST/JSON uses the lowercase value shown in each comment.
  enum MaxScope {
    MAX_SCOPE_UNSPECIFIED = 0;
    // "class"
    MAX_SCOPE_CLASS = 1;
    // "institution"
    MAX_SCOPE_INSTITUTION = 2;
    // "inter_school"
    MAX_SCOPE_INTER_SCHOOL = 3;
    // "public"
    MAX_SCOPE_PUBLIC = 4;
  }
}

// One entry of the processing register: what a module does with personal data, for which purpose and on which legal
// basis, whether it reaches minors, and which data categories it touches. Platform catalogue, read-only.
message ProcessingActivity {
  // Stable id of the activity, the same in every environment. [UUID] Output only.
  string id = 1;
  // The module that processes the data. Output only.
  string module = 2;
  // Activity code <module>.<activity>, e.g. comms.marketing_broadcast. Output only.
  string code = 3;
  // Code of the catalogue purpose the activity serves. Output only.
  string purpose_code = 4;
  // The legal basis of the processing. Output only.
  LegalBasis legal_basis = 5;
  // The Fourth Schedule clause relied on when the basis is education_exemption. Output only.
  optional string education_exemption_clause = 6;
  // Whether the activity processes data of minors. Output only.
  bool targets_minors = 7;
  // Whether the data leaves India. Output only.
  bool cross_border = 8;
  // The retention policy that applies; absent while none is set. Output only.
  optional string retention_policy_code = 9;
  // Version of the activity; incremented on a material change. Output only.
  int32 version = 10;
  // Codes of the data categories the activity touches. Output only.
  repeated string categories = 11;
  // Allowed values of legal_basis; REST/JSON uses the lowercase value shown in each comment.
  enum LegalBasis {
    LEGAL_BASIS_UNSPECIFIED = 0;
    // "consent"
    LEGAL_BASIS_CONSENT = 1;
    // "contract"
    LEGAL_BASIS_CONTRACT = 2;
    // "education_exemption"
    LEGAL_BASIS_EDUCATION_EXEMPTION = 3;
    // "employment"
    LEGAL_BASIS_EMPLOYMENT = 4;
    // "legal_obligation"
    LEGAL_BASIS_LEGAL_OBLIGATION = 5;
    // "legitimate_use"
    LEGAL_BASIS_LEGITIMATE_USE = 6;
    // "legitimate_use_voluntary"
    LEGAL_BASIS_LEGITIMATE_USE_VOLUNTARY = 7;
    // "medical_emergency"
    LEGAL_BASIS_MEDICAL_EMERGENCY = 8;
  }
}

// A privacy notice of the tenant: the text shown when consent is asked for one purpose or a bundle of purposes.
message Notice {
  // Surrogate primary key (UUIDv7 generated by the application). [UUID] Output only.
  string id = 1;
  // Code of the notice within the tenant, e.g. community_photos; set at creation, never changed.
  string code = 2;
  // Title shown to tenant administrators.
  string title = 3;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 4;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 5;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 6;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 7;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 8;
}

// The school's grievance officer a notice version names.
message GrievanceContact {
  // Name of the officer.
  string name = 1;
  // Role of the officer, e.g. Data Protection Officer.
  optional string role = 2;
  // E-mail address complaints are sent to.
  string email = 3;
  // Telephone number.
  optional string phone = 4;
}

// One version of a notice: edited while a draft, frozen with its translations once published.
message NoticeVersion {
  // Surrogate primary key (UUIDv7 generated by the application). [UUID] Output only.
  string id = 1;
  // The notice this is a version of. [UUID] Set from the parent path on create.
  string notice_id = 2;
  // Version number within the notice (1, 2, 3 in creation order). Output only.
  int32 version = 3;
  // draft, active (published, one per notice) or retired. Output only.
  Status status = 4;
  // Whether consents given under earlier versions must be asked for again once this version is published.
  bool requires_reconsent = 5;
  // Codes of the active catalogue purposes the version asks consent for.
  repeated string purpose_codes = 6;
  // The school's grievance officer the version names.
  GrievanceContact grievance_contact = 7;
  // Optional signed PDF of the version (a platform file). [UUID]
  optional string document_file_id = 8;
  // When the version was published; absent while a draft. Output only.
  google.protobuf.Timestamp published_at = 9;
  // The version that retired this one. [UUID] Output only.
  optional string superseded_by_id = 10;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 11;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 12;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 13;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 14;
  // Entity tag (row version). Output only on reads; send back on update and publish.
  string etag = 15;
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "active"
    STATUS_ACTIVE = 1;
    // "draft"
    STATUS_DRAFT = 2;
    // "retired"
    STATUS_RETIRED = 3;
  }
}

// The wording of a notice version in one language; changes only while its version is a draft.
message NoticeTranslation {
  // Surrogate primary key (UUIDv7 generated by the application). [UUID] Output only.
  string id = 1;
  // The version this is a translation of. [UUID] Set from the parent path on create.
  string notice_version_id = 2;
  // BCP 47 language code: en, hi, ta, mr-IN ...; one per version.
