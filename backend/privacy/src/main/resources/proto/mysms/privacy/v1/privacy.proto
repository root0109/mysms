// One of the caller's own rights requests as the caller sees it: what was asked, where it stands, by when it is due
// and how it ended; never who handles it, how identity was checked or the staff's notes.
message MyRightsRequest {
  // The request's id. [UUID] Output only.
  string id = 1;
  // The request's number, PRV-<year>-<six digits>, quoted in every letter about it.
  string number = 2;
  // The right exercised.
  Type type = 3;
  // The person the request is about: the caller, or a child the caller is the legal guardian of. [UUID]
  string subject_person_id = 4;
  // self (for oneself as an adult) or guardian (for a minor).
  RequesterCapacity requester_capacity = 5;
  // submitted, verified, in_progress, action_required (a module's task failed), rejected or closed.
  Status status = 6;
  // What the caller asked.
  string description = 7;
  // When the request was submitted.
  google.protobuf.Timestamp submitted_at = 8;
  // By when the school must respond.
  google.protobuf.Timestamp due_at = 9;
  // Still open past due_at.
  bool overdue = 10;
  // When the request was closed or rejected; absent while open.
  google.protobuf.Timestamp closed_at = 11;
  // How it ended (closed: fulfilled, partially_fulfilled, declined; rejected: identity_not_verified, not_entitled,
  // duplicate, other — a rejection may be appealed as a grievance); absent while open.
  OutcomeCode outcome_code = 12;
  // For a correction: the record and the fields to correct.
  RightsRequestCorrection correction = 13;
  // For a grievance: what it is about.
  GrievanceCategory grievance_category = 14;
  // The school's answer to the request, given when it was closed; absent while open and when none was given.
  optional string response = 15;
  // Allowed values of type; REST/JSON uses the lowercase value shown in each comment.
  enum Type {
    TYPE_UNSPECIFIED = 0;
    // "access"
    TYPE_ACCESS = 1;
    // "correction"
    TYPE_CORRECTION = 2;
    // "grievance"
    TYPE_GRIEVANCE = 3;
    // "nomination"
    TYPE_NOMINATION = 4;
    // "erasure"
    TYPE_ERASURE = 5;
    // "export"
    TYPE_EXPORT = 6;
    // "withdraw_all"
    TYPE_WITHDRAW_ALL = 7;
  }
  // Allowed values of requester_capacity; REST/JSON uses the lowercase value shown in each comment.
  enum RequesterCapacity {
    REQUESTER_CAPACITY_UNSPECIFIED = 0;
    // "guardian"
    REQUESTER_CAPACITY_GUARDIAN = 1;
    // "self"
    REQUESTER_CAPACITY_SELF = 2;
    // "nominee"
    REQUESTER_CAPACITY_NOMINEE = 3;
  }
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "closed"
    STATUS_CLOSED = 1;
    // "in_progress"
    STATUS_IN_PROGRESS = 2;
    // "rejected"
    STATUS_REJECTED = 3;
    // "submitted"
    STATUS_SUBMITTED = 4;
    // "verified"
    STATUS_VERIFIED = 5;
    // "action_required"
    STATUS_ACTION_REQUIRED = 6;
  }
  // Allowed values of outcome_code; REST/JSON uses the lowercase value shown in each comment.
  enum OutcomeCode {
    OUTCOME_CODE_UNSPECIFIED = 0;
    // "declined"
    OUTCOME_CODE_DECLINED = 1;
    // "duplicate"
    OUTCOME_CODE_DUPLICATE = 2;
    // "fulfilled"
    OUTCOME_CODE_FULFILLED = 3;
    // "identity_not_verified"
    OUTCOME_CODE_IDENTITY_NOT_VERIFIED = 4;
    // "not_entitled"
    OUTCOME_CODE_NOT_ENTITLED = 5;
    // "other"
    OUTCOME_CODE_OTHER = 6;
    // "partially_fulfilled"
    OUTCOME_CODE_PARTIALLY_FULFILLED = 7;
  }
  // Allowed values of grievance_category; REST/JSON uses the lowercase value shown in each comment.
  enum GrievanceCategory {
    GRIEVANCE_CATEGORY_UNSPECIFIED = 0;
    // "access"
    GRIEVANCE_CATEGORY_ACCESS = 1;
    // "communication"
    GRIEVANCE_CATEGORY_COMMUNICATION = 2;
    // "consent"
    GRIEVANCE_CATEGORY_CONSENT = 3;
    // "correction"
    GRIEVANCE_CATEGORY_CORRECTION = 4;
    // "data_security"
    GRIEVANCE_CATEGORY_DATA_SECURITY = 5;
    // "other"
    GRIEVANCE_CATEGORY_OTHER = 6;
  }
}

// A rights request as the school's privacy staff see it: who asked what for whom, how identity was checked, who
// handles it, the deadline and the outcome.
message RightsRequest {
  // Surrogate primary key (UUIDv7 generated by the application). [UUID] Output only.
  string id = 1;
  // The request's number, PRV-<year>-<six digits>.
  string number = 2;
  // The right exercised.
  Type type = 3;
  // The data principal the request is about. [UUID]
  string subject_person_id = 4;
  // The person who submitted it. [UUID]
  string requester_person_id = 5;
  // self (an adult for themself) or guardian (the active legal guardian of a minor).
  RequesterCapacity requester_capacity = 6;
  // submitted, verified, in_progress, action_required (a module's task failed), rejected or closed.
  Status status = 7;
  // How the requester's identity was established; absent while submitted.
  IdentityCheck identity_check = 8;
  // What the requester asked, in their own words.
  string description = 9;
  // The staff member handling the request; absent until assigned. [UUID]
  optional string assignee_user_id = 10;
  // When the request was submitted.
  google.protobuf.Timestamp submitted_at = 11;
  // The response deadline.
  google.protobuf.Timestamp due_at = 12;
  // Still open past due_at.
  bool overdue = 13;
  // Why the deadline was last extended; absent when never extended.
  optional string extended_reason = 14;
  // When the request was closed or rejected; absent while open.
  google.protobuf.Timestamp closed_at = 15;
  // How it ended (closed: fulfilled, partially_fulfilled, declined; rejected: identity_not_verified, not_entitled,
  // duplicate, other); absent while open.
  OutcomeCode outcome_code = 16;
  // The staff's note on closing; absent when none.
  optional string outcome_note = 17;
  // Entity tag (row version); send back on each step.
  string etag = 18;
  // For a correction: the record and the fields to correct.
  RightsRequestCorrection correction = 19;
  // For a grievance: what it is about.
  GrievanceCategory grievance_category = 20;
  // The school's answer the requester sees, given when the request was closed.
  optional string response = 21;
  // The modules' tasks of an erasure or export request once its fulfilment started; empty otherwise. Output only.
  repeated RightsRequestTask tasks = 22;
  // Allowed values of type; REST/JSON uses the lowercase value shown in each comment.
  enum Type {
    TYPE_UNSPECIFIED = 0;
    // "access"
    TYPE_ACCESS = 1;
    // "correction"
    TYPE_CORRECTION = 2;
    // "grievance"
    TYPE_GRIEVANCE = 3;
    // "nomination"
    TYPE_NOMINATION = 4;
    // "erasure"
    TYPE_ERASURE = 5;
    // "export"
    TYPE_EXPORT = 6;
    // "withdraw_all"
    TYPE_WITHDRAW_ALL = 7;
  }
  // Allowed values of requester_capacity; REST/JSON uses the lowercase value shown in each comment.
  enum RequesterCapacity {
    REQUESTER_CAPACITY_UNSPECIFIED = 0;
    // "guardian"
    REQUESTER_CAPACITY_GUARDIAN = 1;
    // "self"
    REQUESTER_CAPACITY_SELF = 2;
    // "nominee"
    REQUESTER_CAPACITY_NOMINEE = 3;
  }
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "closed"
    STATUS_CLOSED = 1;
    // "in_progress"
    STATUS_IN_PROGRESS = 2;
    // "rejected"
    STATUS_REJECTED = 3;
    // "submitted"
    STATUS_SUBMITTED = 4;
    // "verified"
    STATUS_VERIFIED = 5;
    // "action_required"
    STATUS_ACTION_REQUIRED = 6;
  }
  // Allowed values of identity_check; REST/JSON uses the lowercase value shown in each comment.
  enum IdentityCheck {
    IDENTITY_CHECK_UNSPECIFIED = 0;
    // "document"
    IDENTITY_CHECK_DOCUMENT = 1;
    // "in_person"
    IDENTITY_CHECK_IN_PERSON = 2;
    // "signed_in_session"
    IDENTITY_CHECK_SIGNED_IN_SESSION = 3;
  }
  // Allowed values of outcome_code; REST/JSON uses the lowercase value shown in each comment.
  enum OutcomeCode {
    OUTCOME_CODE_UNSPECIFIED = 0;
    // "declined"
    OUTCOME_CODE_DECLINED = 1;
    // "duplicate"
    OUTCOME_CODE_DUPLICATE = 2;
    // "fulfilled"
    OUTCOME_CODE_FULFILLED = 3;
    // "identity_not_verified"
    OUTCOME_CODE_IDENTITY_NOT_VERIFIED = 4;
    // "not_entitled"
    OUTCOME_CODE_NOT_ENTITLED = 5;
    // "other"
    OUTCOME_CODE_OTHER = 6;
    // "partially_fulfilled"
    OUTCOME_CODE_PARTIALLY_FULFILLED = 7;
  }
  // Allowed values of grievance_category; REST/JSON uses the lowercase value shown in each comment.
  enum GrievanceCategory {
    GRIEVANCE_CATEGORY_UNSPECIFIED = 0;
    // "access"
    GRIEVANCE_CATEGORY_ACCESS = 1;
    // "communication"
    GRIEVANCE_CATEGORY_COMMUNICATION = 2;
    // "consent"
    GRIEVANCE_CATEGORY_CONSENT = 3;
    // "correction"
    GRIEVANCE_CATEGORY_CORRECTION = 4;
    // "data_security"
    GRIEVANCE_CATEGORY_DATA_SECURITY = 5;
    // "other"
    GRIEVANCE_CATEGORY_OTHER = 6;
  }
}
// What a correction request is about: the record, in the module that holds it, and the fields to correct.
message RightsRequestCorrection {
  // The module that holds the record (people, sis, hr, admission …).
  string module = 1;
  // The kind of record (person, student, guardian, staff …).
  string record_type = 2;
  // The record's id when the requester knows it. [UUID]
  optional string record_id = 3;
  // The fields to correct (1 to 20).
  repeated RightsRequestCorrectionField fields = 4;
}
// One field a correction request asks to change, with the value asked for.
message RightsRequestCorrectionField {
  // The field as the requester names it.
  string field = 1;
  // The value the requester asks for.
  string requested_value = 2;
}

// What the school's processing register says it does with one data principal's personal data, the answer to an access
// request (DPDP Act s.11). Generated by privacy from its own data only: no other module's records or counts.
message AccessSummary {
  // The data principal the summary is about. [UUID]
  string subject_person_id = 1;
  // minor, adult or unknown (no birth date known; treated as a minor) when the summary was generated.
  SubjectStatus subject_status = 2;
  // When the summary was generated.
  google.protobuf.Timestamp generated_at = 3;
  // The tenant's register activities that may concern the subject, by activity code.
  repeated AccessSummaryActivity activities = 4;
  // The subject's roles at the school that the summary was filtered by (student, guardian, staff); empty when privacy
  // knew no role, and then every activity that may concern them is listed.
  repeated string subject_roles = 5;
  // Allowed values of subject_status; REST/JSON uses the lowercase value shown in each comment.
  enum SubjectStatus {
    SUBJECT_STATUS_UNSPECIFIED = 0;
    // "adult"
    SUBJECT_STATUS_ADULT = 1;
    // "minor"
    SUBJECT_STATUS_MINOR = 2;
    // "unknown"
    SUBJECT_STATUS_UNKNOWN = 3;
  }
}

// One activity of the tenant's register that may concern the data principal of an access summary.
message AccessSummaryActivity {
  // Activity code <module>.<activity>, e.g. comms.operational_notice.
  string activity_code = 1;
  // The module that processes the data.
  string module = 2;
  // Code of the catalogue purpose the activity serves.
  string purpose_code = 3;
  // The legal basis of the processing.
  LegalBasis legal_basis = 4;
  // Codes of the data categories the activity touches, sorted.
  repeated string data_categories = 5;
  // Who receives the data, as the register names them; empty while none is named.
  repeated AccessSummaryRecipient recipients = 6;
  // Whether the data leaves India.
  bool cross_border = 7;
  // The retention policy that applies; absent while none is set.
  optional string retention_policy_code = 8;
  // For an activity on the consent basis, the widths the subject's effective consent allows when the summary was
  // generated, narrowest first (class, institution, inter_school, public, or tenant); empty = not allowed. Empty for
  // any other legal basis (REST omits it).
  repeated string consent_allowed_scopes = 9;
  // Allowed values of legal_basis; REST/JSON uses the lowercase value shown in each comment.
  enum LegalBasis {
    LEGAL_BASIS_UNSPECIFIED = 0;
    // "consent"
    LEGAL_BASIS_CONSENT = 1;
    // "contract"
    LEGAL_BASIS_CONTRACT = 2;
    // "education_exemption"
    LEGAL_BASIS_EDUCATION_EXEMPTION = 3;
    // "employment"
    LEGAL_BASIS_EMPLOYMENT = 4;
    // "legal_obligation"
    LEGAL_BASIS_LEGAL_OBLIGATION = 5;
    // "legitimate_use"
    LEGAL_BASIS_LEGITIMATE_USE = 6;
    // "legitimate_use_voluntary"
    LEGAL_BASIS_LEGITIMATE_USE_VOLUNTARY = 7;
    // "medical_emergency"
    LEGAL_BASIS_MEDICAL_EMERGENCY = 8;
  }
}

// A recipient of a processing activity's data, as the processing register names it.
message AccessSummaryRecipient {
  // processor (processes the data on the school's behalf) or fiduciary (decides on its own account).
  string kind = 1;
  // The recipient's name.
  string name = 2;
  // Where the recipient processes the data; absent when the register does not say.
  optional string country = 3;
}

