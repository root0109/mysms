// A personal data breach in the tenant's register: when it was detected and the school became aware, the Board's
// 72-hour clock, what was affected in ids and counts, where it stands and every notice recorded.
message Breach {
  // Surrogate primary key (UUIDv7 generated by the application). [UUID] Output only.
  string id = 1;
  // The breach's number, PRB-<year>-<six digits>. Output only.
  string number = 2;
  // reported, triaged, contained, board_initial_sent, board_report_sent, principals_notified, closed or not_a_breach.
  // Output only.
  Status status = 3;
  // When the breach was detected (or, when known, happened); fixed once reported.
  google.protobuf.Timestamp detected_at = 4;
  // When the school became aware, the start of the Board's 72-hour clock; fixed once reported.
  google.protobuf.Timestamp became_aware_at = 5;
  // became_aware_at plus 72 hours. Output only.
  google.protobuf.Timestamp board_report_due_at = 6;
  // The Board's detailed report is not sent and board_report_due_at has passed. Output only.
  bool overdue = 7;
  // Whole hours left until board_report_due_at, negative once past; absent once the report is sent. Output only.
  optional int32 hours_remaining = 8;
  // What happened, in ids and counts only, never a name or contact.
  string description = 9;
  // Codes of the data categories affected.
  repeated string categories = 10;
  // The MySMS modules whose data is affected.
  repeated string modules = 11;
  // How many data principals are estimated to be affected; absent while unknown.
  optional int32 estimated_principals = 12;
  // The likely consequences for the principals, in ids and counts only.
  optional string likely_consequences = 13;
  // What was done or is planned to contain the breach, in ids and counts only.
  optional string mitigation = 14;
  // The staff member handling the breach. [UUID]
  optional string owner_user_id = 15;
  // When the detailed report to the Board was sent; absent until then. Output only.
  google.protobuf.Timestamp board_report_sent_at = 16;
  // Why triage found it was not a personal data breach. Output only.
  optional string not_a_breach_reason = 17;
  // When the breach was closed or found not to be one; absent while open. Output only.
  google.protobuf.Timestamp closed_at = 18;
  // The notices recorded about the breach, in the order they were sent. Output only.
  repeated BreachNotification notifications = 19;
  // Entity tag (row version). Output only on reads; send back on update and in a step.
  string etag = 20;
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "board_initial_sent"
    STATUS_BOARD_INITIAL_SENT = 1;
    // "board_report_sent"
    STATUS_BOARD_REPORT_SENT = 2;
    // "closed"
    STATUS_CLOSED = 3;
    // "contained"
    STATUS_CONTAINED = 4;
    // "not_a_breach"
    STATUS_NOT_A_BREACH = 5;
    // "principals_notified"
    STATUS_PRINCIPALS_NOTIFIED = 6;
    // "reported"
    STATUS_REPORTED = 7;
    // "triaged"
    STATUS_TRIAGED = 8;
  }
}

// A notice about a breach the school sent and recorded. Output only.
message BreachNotification {
  // Surrogate primary key. [UUID]
  string id = 1;
  // board, principals, processor or tenant.
  Audience audience = 2;
  // initial, detailed or update.
  Kind kind = 3;
  // When the notice was sent.
  google.protobuf.Timestamp sent_at = 4;
  // The notice as sent (a platform file); absent when not attached. [UUID]
  optional string document_file_id = 5;
  // Allowed values of audience; REST/JSON uses the lowercase value shown in each comment.
  enum Audience {
    AUDIENCE_UNSPECIFIED = 0;
    // "board"
    AUDIENCE_BOARD = 1;
    // "principals"
    AUDIENCE_PRINCIPALS = 2;
    // "processor"
    AUDIENCE_PROCESSOR = 3;
    // "tenant"
    AUDIENCE_TENANT = 4;
  }
  // Allowed values of kind; REST/JSON uses the lowercase value shown in each comment.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // "detailed"
    KIND_DETAILED = 1;
    // "initial"
    KIND_INITIAL = 2;
    // "update"
    KIND_UPDATE = 3;
  }
}

message GetConsentCoverageRequest {
  // The catalogue purpose, e.g. photo_video_publication.
  string purpose_code = 1;
  // Only this width: class, institution, inter_school, public or tenant; absent = every width the purpose takes.
  optional string scope = 2;
  // Only the students of this institution; absent = every data principal of the tenant. [UUID]
  optional string institution_id = 3;
}
message GetConsentCoverageResponse {
  ConsentCoverage consent_coverage = 1;
}

// How far a purpose is covered by consent, in the tenant or one institution: counts per width, never person ids.
message ConsentCoverage {
  // The catalogue purpose.
  string purpose_code = 1;
  // The institution the counts are narrowed to; absent = every data principal of the tenant. [UUID]
  optional string institution_id = 2;
  // How many data principals are counted.
  int32 subjects = 3;
  // The counts per width, narrowest first.
  repeated ConsentCoverageScope scopes = 4;
}

// The coverage of a purpose at one width.
message ConsentCoverageScope {
  // The width.
  Scope scope = 1;
  // Subjects whose effective consent allows the purpose at the width.
  int32 allowed = 2;
  // Subjects with no decision that counts.
  int32 not_answered = 3;
  // Subjects denied for another reason, one entry per reason (zero included).
  repeated ConsentCoverageDenial denied = 4;
  // Allowed values of scope; REST/JSON uses the lowercase value shown in each comment.
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    // "class"
    SCOPE_CLASS = 1;
    // "institution"
    SCOPE_INSTITUTION = 2;
    // "inter_school"
    SCOPE_INTER_SCHOOL = 3;
    // "public"
    SCOPE_PUBLIC = 4;
    // "tenant"
    SCOPE_TENANT = 5;
  }
}

// How many subjects are denied a purpose at a width for one reason.
message ConsentCoverageDenial {
  // The reason.
  Reason reason = 1;
  // How many subjects.
  int32 subjects = 2;
  // Allowed values of reason; REST/JSON uses the lowercase value shown in each comment.
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // "expired"
    REASON_EXPIRED = 1;
    // "forbidden_for_minor"
    REASON_FORBIDDEN_FOR_MINOR = 2;
    // "narrower_grant"
    REASON_NARROWER_GRANT = 3;
    // "purpose_disabled"
    REASON_PURPOSE_DISABLED = 4;
    // "reconsent_required"
    REASON_RECONSENT_REQUIRED = 5;
    // "refused"
    REASON_REFUSED = 6;
  }
}

// ---- RightsRequestService: the fulfilment of erasure, export and withdraw-all requests ----

message StartRightsRequestFulfilmentRequest {
  // Path parameter rightsRequestId.
  string rights_request_id = 1;
  // Concurrency token from the last read (required: the request fulfilled is the version the staff reviewed).
  string etag = 2;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 3;
}
message StartRightsRequestFulfilmentResponse {
  RightsRequest rights_request = 1;
}

message FulfilWithdrawAllRequestRequest {
  // Path parameter rightsRequestId.
  string rights_request_id = 1;
  // Concurrency token from the last read (required: the request fulfilled is the version the staff reviewed).
  string etag = 2;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 3;
}
message FulfilWithdrawAllRequestResponse {
  RightsRequest rights_request = 1;
}

message RetryRightsRequestTaskRequest {
  // Path parameter rightsRequestId.
  string rights_request_id = 1;
  // Path parameter taskId.
  string task_id = 2;
  // Concurrency token from the last read of the request (optional but recommended).
  optional string etag = 3;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 4;
}
message RetryRightsRequestTaskResponse {
  RightsRequest rights_request = 1;
}

// One module's part of fulfilling an erasure or export request, in counts only. Output only.
message RightsRequestTask {
  // Surrogate primary key. [UUID]
  string id = 1;
  // The request the task fulfils. [UUID]
  string rights_request_id = 2;
  // The module that carries the task out.
  string module = 3;
  // erase or export.
  Action action = 4;
  // 1 (comms and iam first for an erasure; every export task) or 2.
  int32 wave = 5;
  // pending, dispatched, done, partial, failed or not_applicable.
  Status status = 6;
  // How many times the task was dispatched.
  int32 attempts = 7;
  // When the task was last dispatched.
  google.protobuf.Timestamp dispatched_at = 8;
  // When the module answered; absent while it has not.
  google.protobuf.Timestamp completed_at = 9;
  // Rows erased or exported over all the module's tables; absent until answered.
  optional int32 affected_rows = 10;
  // Rows kept under a legal hold or a legal-retention policy; absent until answered.
  optional int32 held_items = 11;
  // The retention policies that kept rows.
  repeated string policy_codes = 12;
  // The module's export part (a platform file). [UUID]
  optional string file_id = 13;
  // Why the module's last attempt failed.
  optional string last_error_code = 14;
  // Entity tag (row version).
  string etag = 15;
  // When privacy dispatches the failed task again; absent unless it waits for its next attempt. Output only.
  google.protobuf.Timestamp next_attempt_at = 16;
  // Allowed values of action; REST/JSON uses the lowercase value shown in each comment.
  enum Action {
    ACTION_UNSPECIFIED = 0;
    // "erase"
    ACTION_ERASE = 1;
    // "export"
    ACTION_EXPORT = 2;
  }
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "dispatched"
    STATUS_DISPATCHED = 1;
    // "done"
    STATUS_DONE = 2;
    // "failed"
    STATUS_FAILED = 3;
    // "not_applicable"
    STATUS_NOT_APPLICABLE = 4;
    // "partial"
    STATUS_PARTIAL = 5;
    // "pending"
    STATUS_PENDING = 6;
  }
}

// ---- LegalHoldService ----

message ListLegalHoldsRequest {
  // Filter expression (AIP-160 subset).
  string filter = 1;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 2;
}
message ListLegalHoldsResponse {
  repeated LegalHold items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 2;
}

message GetLegalHoldRequest {
  // Legal hold id (UUID).
  string id = 1;
}
message GetLegalHoldResponse {
  LegalHold legal_hold = 1;
}

message PlaceLegalHoldRequest {
  LegalHold legal_hold = 1;
  // Idempotency key (UUID); retries with the same key return the original result.
  string request_id = 2;
}
message PlaceLegalHoldResponse {
  LegalHold legal_hold = 1;
}

message UpdateLegalHoldRequest {
  // Legal hold with id and etag set.
  LegalHold legal_hold = 1;
  // Fields to update (review_by); empty = all fields present.
  google.protobuf.FieldMask update_mask = 2;
}
message UpdateLegalHoldResponse {
  LegalHold legal_hold = 1;
}

message ReleaseLegalHoldRequest {
  // Path parameter legalHoldId.
  string legal_hold_id = 1;
  // Concurrency token from the last read (optional but recommended).
  optional string etag = 2;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 3;
}
message ReleaseLegalHoldResponse {
  LegalHold legal_hold = 1;
}

message ListActiveHoldsRequest {
  // The data principal whose data the module is about to remove. [UUID]
  string subject_person_id = 1;
  // Only record-set holds of this module; absent = every module's.
  optional string module = 2;
}
message ListActiveHoldsResponse {
  // The holds, oldest first.
  repeated ActiveLegalHold holds = 1;
}

// A legal hold: what no erasure or retention may remove until it is released, reviewed by a set date.
message LegalHold {
  // Surrogate primary key (UUIDv7 generated by the application). [UUID] Output only.
  string id = 1;
  // safeguarding, litigation, regulator or audit.
  ReasonCode reason_code = 2;
  // subject, category or records; fixed once placed.
  Scope scope = 3;
  // The data principal held: required for subject, optional for category and records. [UUID]
  optional string subject_person_id = 4;
  // The data category held (scope category).
  optional string category_code = 5;
  // The module holding the records (scope records).
  optional string module = 6;
  // The kind of record held (scope records).
  optional string entity_type = 7;
  // The records held, 1-1000 (scope records). [UUID]
  repeated string entity_ids = 8;
  // When the hold must be reviewed: today or later. [ISO-8601 date (YYYY-MM-DD)]
  string review_by = 9;
  // Active and its review date has come. Output only.
  bool review_due = 10;
  // active or released. Output only.
  Status status = 11;
  // Who placed the hold. [UUID] Output only.
  string placed_by_user_id = 12;
  // When the hold was placed. Output only.
  google.protobuf.Timestamp placed_at = 13;
  // When the hold was released; absent while active. Output only.
  google.protobuf.Timestamp released_at = 14;
  // Who released the hold. [UUID] Output only.
  optional string released_by_user_id = 15;
  // Entity tag (row version). Output only on reads; send back on update and in a release.
  string etag = 16;
  // Allowed values of reason_code; REST/JSON uses the lowercase value shown in each comment.
  enum ReasonCode {
    REASON_CODE_UNSPECIFIED = 0;
    // "audit"
    REASON_CODE_AUDIT = 1;
    // "litigation"
    REASON_CODE_LITIGATION = 2;
    // "regulator"
    REASON_CODE_REGULATOR = 3;
    // "safeguarding"
    REASON_CODE_SAFEGUARDING = 4;
  }
  // Allowed values of scope; REST/JSON uses the lowercase value shown in each comment.
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    // "category"
    SCOPE_CATEGORY = 1;
    // "records"
    SCOPE_RECORDS = 2;
    // "subject"
    SCOPE_SUBJECT = 3;
  }
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "active"
    STATUS_ACTIVE = 1;
    // "released"
    STATUS_RELEASED = 2;
  }
}

// What one active legal hold covers, for a module erasing or sweeping a subject's data.
message ActiveLegalHold {
  // The hold. [UUID]
  string id = 1;
  // safeguarding, litigation, regulator or audit.
  ReasonCode reason_code = 2;
  // subject, category or records.
  Scope scope = 3;
  // The data principal held; absent = everyone's. [UUID]
  optional string subject_person_id = 4;
  // The data category held (scope category).
  optional string category_code = 5;
  // The module holding the records (scope records).
  optional string module = 6;
  // The kind of record held (scope records).
  optional string entity_type = 7;
  // The records held (scope records). [UUID]
  repeated string entity_ids = 8;
  // Allowed values of reason_code; REST/JSON uses the lowercase value shown in each comment.
  enum ReasonCode {
    REASON_CODE_UNSPECIFIED = 0;
    // "audit"
    REASON_CODE_AUDIT = 1;
    // "litigation"
    REASON_CODE_LITIGATION = 2;
    // "regulator"
    REASON_CODE_REGULATOR = 3;
    // "safeguarding"
    REASON_CODE_SAFEGUARDING = 4;
  }
  // Allowed values of scope; REST/JSON uses the lowercase value shown in each comment.
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    // "category"
    SCOPE_CATEGORY = 1;
    // "records"
    SCOPE_RECORDS = 2;
    // "subject"
    SCOPE_SUBJECT = 3;
  }
}

// ---- RetentionService ----

message ListRetentionPoliciesRequest {
  // Filter expression (AIP-160 subset).
  string filter = 1;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 2;
}
message ListRetentionPoliciesResponse {
  repeated RetentionPolicy items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 2;
}

message GetRetentionPolicyRequest {
  // Retention policy id (UUID).
  string id = 1;
}
message GetRetentionPolicyResponse {
  RetentionPolicy retention_policy = 1;
}

message UpdateRetentionPolicyRequest {
  // Retention policy with id and etag set ("0" while the tenant has never set it).
  RetentionPolicy retention_policy = 1;
  // Fields to update (period_days, action); empty = all fields present.
  google.protobuf.FieldMask update_mask = 2;
}
message UpdateRetentionPolicyResponse {
  RetentionPolicy retention_policy = 1;
}

message ListRetentionRunsRequest {
  // Filter expression (AIP-160 subset).
  string filter = 1;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 2;
}
message ListRetentionRunsResponse {
  repeated RetentionRun items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 2;
}

// A retention policy of the catalogue with the tenant's own period and action, never below the legal floor.
message RetentionPolicy {
  // The catalogue policy. [UUID] Output only.
  string id = 1;
  // Policy code, e.g. attendance.after_leaving. Output only.
  string code = 2;
  // The data category kept. Output only.
  string category_code = 3;
  // The module holding the data. Output only.
  string module = 4;
  // When the period starts. Output only.
  Trigger trigger = 5;
  // Days the data is kept after the trigger: the tenant's own when set, the catalogue's otherwise.
  int32 period_days = 6;
  // The legal floor in days. Output only.
  int32 minimum_period_days = 7;
  // delete, anonymise or archive.
  Action action = 8;
  // Days before the sweep the person is told; absent = not told. Output only.
  optional int32 notify_before_days = 9;
  // The law or rule the floor comes from (to verify). Output only.
  string legal_reference = 10;
  // The tenant set its own period or action. Output only.
  bool overridden = 11;
  // Entity tag (the tenant setting's row version, 0 while never set).
  string etag = 12;
  // Allowed values of trigger; REST/JSON uses the lowercase value shown in each comment.
  enum Trigger {
    TRIGGER_UNSPECIFIED = 0;
    // "after_inactivity"
    TRIGGER_AFTER_INACTIVITY = 1;
    // "after_leaving"
    TRIGGER_AFTER_LEAVING = 2;
    // "after_purpose_end"
    TRIGGER_AFTER_PURPOSE_END = 3;
    // "after_record_date"
    TRIGGER_AFTER_RECORD_DATE = 4;
  }
  // Allowed values of action; REST/JSON uses the lowercase value shown in each comment.
  enum Action {
    ACTION_UNSPECIFIED = 0;
    // "anonymise"
    ACTION_ANONYMISE = 1;
    // "archive"
    ACTION_ARCHIVE = 2;
    // "delete"
    ACTION_DELETE = 3;
  }
}

// One daily run of a retention policy, in counts only. Output only.
message RetentionRun {
  // Surrogate primary key. [UUID]
  string id = 1;
  // The policy run.
  string policy_code = 2;
  // The data category swept.
  string category_code = 3;
  // The module asked to sweep.
  string module = 4;
  // delete, anonymise or archive.
  Action action = 5;
  // Data whose trigger lies before this instant is past its period.
  google.protobuf.Timestamp cutoff = 6;
  // dispatched, done, partial or failed.
  Status status = 7;
  // Rows the module removed; absent until it reports.
  optional int32 affected = 8;
  // Rows kept under a legal hold; absent until it reports.
  optional int32 held = 9;
  // When the run was dispatched.
  google.protobuf.Timestamp started_at = 10;
  // When the module reported; absent until then.
  google.protobuf.Timestamp completed_at = 11;
  // Allowed values of action; REST/JSON uses the lowercase value shown in each comment.
  enum Action {
    ACTION_UNSPECIFIED = 0;
    // "anonymise"
    ACTION_ANONYMISE = 1;
    // "archive"
    ACTION_ARCHIVE = 2;
    // "delete"
    ACTION_DELETE = 3;
  }
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "dispatched"
    STATUS_DISPATCHED = 1;
    // "done"
    STATUS_DONE = 2;
    // "failed"
    STATUS_FAILED = 3;
    // "partial"
    STATUS_PARTIAL = 4;
  }
}
