// One consent decision as staff see it: how it was given and whether it was verified.
message ConsentRecord {
  // Surrogate primary key (UUIDv7 generated by the application). [UUID] Output only.
  string id = 1;
  // The person the decision is about. [UUID]
  string subject_person_id = 2;
  // The person who decided. [UUID]
  string giver_person_id = 3;
