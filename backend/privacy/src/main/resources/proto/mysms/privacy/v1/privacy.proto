  // Filter expression (AIP-160 subset).
  string filter = 4;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 6;
}
message ListNoticeVersionsResponse {
  repeated NoticeVersion items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 4;
}

message GetNoticeVersionRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // NoticeVersion id (UUID).
  string id = 2;
}
message GetNoticeVersionResponse {
  NoticeVersion notice_version = 1;
}

message CreateNoticeVersionRequest {
  // Notice id (UUID).
  string notice_id = 1;
  NoticeVersion notice_version = 2;
  // Idempotency key (UUID); retries with the same key return the original result.
  string request_id = 3;
  // Validate without persisting.
  bool validate_only = 4;
}
message CreateNoticeVersionResponse {
  NoticeVersion notice_version = 1;
}

message UpdateNoticeVersionRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // Resource with id and etag set.
  NoticeVersion notice_version = 2;
  // Fields to update; empty = all fields present.
  google.protobuf.FieldMask update_mask = 3;
  // Validate without persisting.
  bool validate_only = 4;
}
message UpdateNoticeVersionResponse {
  NoticeVersion notice_version = 1;
}

message PublishNoticeVersionRequest {
  // Path parameter noticeId.
  string notice_id = 1;
  // Path parameter noticeVersionId.
  string notice_version_id = 2;
  // Concurrency token from the last read (optional but recommended).
  optional string etag = 3;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 4;
}
message PublishNoticeVersionResponse {
  NoticeVersion notice_version = 1;
}

message ListNoticeTranslationsRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // NoticeVersion id (UUID).
  string notice_version_id = 2;
  // Filter expression (AIP-160 subset).
  string filter = 5;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 7;
}
message ListNoticeTranslationsResponse {
  repeated NoticeTranslation items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 4;
}

message GetNoticeTranslationRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // NoticeVersion id (UUID).
  string notice_version_id = 2;
  // NoticeTranslation id (UUID).
  string id = 3;
}
message GetNoticeTranslationResponse {
  NoticeTranslation notice_translation = 1;
}

message CreateNoticeTranslationRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // NoticeVersion id (UUID).
  string notice_version_id = 2;
  NoticeTranslation notice_translation = 3;
  // Idempotency key (UUID); retries with the same key return the original result.
  string request_id = 4;
  // Validate without persisting.
  bool validate_only = 5;
}
message CreateNoticeTranslationResponse {
  NoticeTranslation notice_translation = 1;
}

message UpdateNoticeTranslationRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // NoticeVersion id (UUID).
  string notice_version_id = 2;
  // Resource with id and etag set.
  NoticeTranslation notice_translation = 3;
  // Fields to update; empty = all fields present.
  google.protobuf.FieldMask update_mask = 4;
  // Validate without persisting.
  bool validate_only = 5;
}
message UpdateNoticeTranslationResponse {
  NoticeTranslation notice_translation = 1;
}

message DeleteNoticeTranslationRequest {
  // Notice id (UUID).
  string notice_id = 1;
  // NoticeVersion id (UUID).
  string notice_version_id = 2;
  // NoticeTranslation id (UUID).
  string id = 3;
  // ETag from the last read.
  string etag = 4;
}
message DeleteNoticeTranslationResponse {
}

// Why personal data is processed: a catalogue purpose and the calling tenant's setting of it.
message Purpose {
  // Stable id of the catalogue purpose, the same in every environment. [UUID] Output only.
  string id = 1;
  // Purpose code, e.g. photo_video_publication. Output only.
  string code = 2;
  // Whether a consent names a width (class to public) or covers the whole tenant. Output only.
  ScopeKind scope_kind = 3;
  // Who decides the processing: the school or MySMS on its own account. Output only.
  Fiduciary fiduciary = 4;
  // Never allowed for a minor, not even with a guardian's consent. Output only.
  bool forbidden_for_minors = 5;
  // What a guardian's consent still covers once the student turns 18. Output only.
  MajorityGrace majority_grace = 6;
  // How long a consent lasts unless the notice says otherwise; absent = until withdrawn. Output only.
  optional int32 default_valid_months = 7;
  // Lifecycle of the catalogue purpose. Output only.
  Status status = 8;
  // Version of the catalogue purpose; incremented on a material change. Output only.
  int32 version = 9;
  // Whether the tenant processes data for the purpose.
  bool enabled = 10;
  // The widest width the tenant allows for a width purpose; absent = no ceiling.
  MaxScope max_scope = 11;
  // The notice shown when asking for consent to the purpose. [UUID]
  optional string notice_id = 12;
  // When the tenant last changed its setting; absent while it never has. Output only.
  google.protobuf.Timestamp update_time = 13;
  // Entity tag (version of the tenant's setting). Output only on reads; send back on update.
  string etag = 14;
  // Allowed values of scope_kind; REST/JSON uses the lowercase value shown in each comment.
  enum ScopeKind {
    SCOPE_KIND_UNSPECIFIED = 0;
    // "tenant"
    SCOPE_KIND_TENANT = 1;
    // "width"
    SCOPE_KIND_WIDTH = 2;
  }
  // Allowed values of fiduciary; REST/JSON uses the lowercase value shown in each comment.
  enum Fiduciary {
    FIDUCIARY_UNSPECIFIED = 0;
    // "platform"
    FIDUCIARY_PLATFORM = 1;
    // "tenant"
    FIDUCIARY_TENANT = 2;
  }
  // Allowed values of majority_grace; REST/JSON uses the lowercase value shown in each comment.
  enum MajorityGrace {
    MAJORITY_GRACE_UNSPECIFIED = 0;
    // "keep_narrow_widths"
    MAJORITY_GRACE_KEEP_NARROW_WIDTHS = 1;
    // "keep_published"
    MAJORITY_GRACE_KEEP_PUBLISHED = 2;
    // "none"
    MAJORITY_GRACE_NONE = 3;
  }
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "active"
    STATUS_ACTIVE = 1;
    // "deprecated"
    STATUS_DEPRECATED = 2;
    // "retired"
    STATUS_RETIRED = 3;
  }
  // Allowed values of max_scope; REST/JSON uses the lowercase value shown in each comment.
  enum MaxScope {
    MAX_SCOPE_UNSPECIFIED = 0;
    // "class"
    MAX_SCOPE_CLASS = 1;
    // "institution"
    MAX_SCOPE_INSTITUTION = 2;
    // "inter_school"
    MAX_SCOPE_INTER_SCHOOL = 3;
    // "public"
    MAX_SCOPE_PUBLIC = 4;
  }
}

// A privacy notice of the tenant: the text shown when consent is asked for one purpose or a bundle of purposes.
message Notice {
  // Surrogate primary key (UUIDv7 generated by the application). [UUID] Output only.
  string id = 1;
  // Code of the notice within the tenant, e.g. community_photos; set at creation, never changed.
  string code = 2;
  // Title shown to tenant administrators.
  string title = 3;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 4;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 5;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 6;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 7;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 8;
}

// The school's grievance officer a notice version names.
message GrievanceContact {
  // Name of the officer.
  string name = 1;
  // Role of the officer, e.g. Data Protection Officer.
  optional string role = 2;
  // E-mail address complaints are sent to.
  string email = 3;
  // Telephone number.
  optional string phone = 4;
}

// One version of a notice: edited while a draft, frozen with its translations once published.
message NoticeVersion {
  // Surrogate primary key (UUIDv7 generated by the application). [UUID] Output only.
  string id = 1;
  // The notice this is a version of. [UUID] Set from the parent path on create.
  string notice_id = 2;
  // Version number within the notice (1, 2, 3 in creation order). Output only.
  int32 version = 3;
  // draft, active (published, one per notice) or retired. Output only.
  Status status = 4;
  // Whether consents given under earlier versions must be asked for again once this version is published.
  bool requires_reconsent = 5;
  // Codes of the active catalogue purposes the version asks consent for.
  repeated string purpose_codes = 6;
  // The school's grievance officer the version names.
  GrievanceContact grievance_contact = 7;
  // Optional signed PDF of the version (a platform file). [UUID]
  optional string document_file_id = 8;
  // When the version was published; absent while a draft. Output only.
  google.protobuf.Timestamp published_at = 9;
  // The version that retired this one. [UUID] Output only.
  optional string superseded_by_id = 10;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 11;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 12;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 13;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 14;
  // Entity tag (row version). Output only on reads; send back on update and publish.
  string etag = 15;
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "active"
    STATUS_ACTIVE = 1;
    // "draft"
    STATUS_DRAFT = 2;
    // "retired"
    STATUS_RETIRED = 3;
  }
}

// The wording of a notice version in one language; changes only while its version is a draft.
message NoticeTranslation {
  // Surrogate primary key (UUIDv7 generated by the application). [UUID] Output only.
  string id = 1;
  // The version this is a translation of. [UUID] Set from the parent path on create.
  string notice_version_id = 2;
  // BCP 47 language code: en, hi, ta, mr-IN ...; one per version.
  string language = 3;
  // The notice in Markdown: the data processed, the purposes, how to withdraw and how to complain.
  string body_markdown = 4;
  // Short plain version shown to a minor alongside the notice.
  optional string summary_for_children = 5;
  // Lowercase hex SHA-256 of the body, a blank line and the summary. Output only.
  string content_sha256 = 6;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 7;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 8;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 9;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 10;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 11;
}

message ListMyConsentsRequest {
}
message ListMyConsentsResponse {
  repeated MyConsent items = 1;
  // The whole centre is one page (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 2;
}

message RecordMyConsentRequest {
  // The caller, or a minor the caller is the active legal guardian of. [UUID]
  string subject_person_id = 1;
  // The catalogue purpose decided on.
  string purpose_code = 2;
  // The width decided at; tenant for a tenant-scoped purpose.
  Scope scope = 3;
  // granted or refused.
  Decision decision = 4;
  // The active notice version shown. [UUID]
  string notice_version_id = 5;
  // The language of the translation shown (BCP 47).
  string notice_language = 6;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 7;
  // Allowed values of scope; REST/JSON uses the lowercase value shown in each comment.
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    // "class"
    SCOPE_CLASS = 1;
    // "institution"
    SCOPE_INSTITUTION = 2;
    // "inter_school"
    SCOPE_INTER_SCHOOL = 3;
    // "public"
    SCOPE_PUBLIC = 4;
    // "tenant"
    SCOPE_TENANT = 5;
  }
  // Allowed values of decision; REST/JSON uses the lowercase value shown in each comment.
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    // "granted"
    DECISION_GRANTED = 1;
    // "refused"
    DECISION_REFUSED = 2;
  }
}
message RecordMyConsentResponse {
  MyConsent my_consent = 1;
}

message WithdrawMyConsentRequest {
  // Path parameter consentRecordId.
  string consent_record_id = 1;
  // Concurrency token from the last read (optional but recommended).
  optional string etag = 2;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 3;
}
message WithdrawMyConsentResponse {
  MyConsent my_consent = 1;
}

message GetMyNoticeRequest {
  // Code of the notice within the tenant.
  string notice_code = 1;
  // BCP 47 language of the wording wanted, e.g. hi.
  string language = 2;
}
message GetMyNoticeResponse {
  MyNotice my_notice = 1;
}

message ListConsentRecordsRequest {
  // Filter expression (AIP-160 subset).
  string filter = 1;
  // The page to read: number, size, sort and the cursor of a next page (api/README "Pagination").
  mysms.common.v1.PageableRequest pageable = 2;
}
message ListConsentRecordsResponse {
  repeated ConsentRecord items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 2;
}

message GetConsentRecordRequest {
  // ConsentRecord id (UUID).
  string id = 1;
}
message GetConsentRecordResponse {
  ConsentRecord consent_record = 1;
}

message RecordConsentOnBehalfRequest {
  // The person the decision is about. [UUID]
  string subject_person_id = 1;
  // The person who signed the form: the subject (an adult) or an active legal guardian of the minor. [UUID]
  string giver_person_id = 2;
  // self (an adult subject) or guardian (a legal guardian of a minor).
  GiverCapacity giver_capacity = 3;
  // The catalogue purpose decided on.
  string purpose_code = 4;
  // The width decided at; tenant for a tenant-scoped purpose.
  Scope scope = 5;
  // granted or refused.
  Decision decision = 6;
  // The active notice version printed on the form. [UUID]
  string notice_version_id = 7;
  // The language of the translation printed on the form (BCP 47).
  string notice_language = 8;
  // The scanned signed form (a platform file). [UUID]
  string evidence_file_id = 9;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 10;
  // Allowed values of giver_capacity; REST/JSON uses the lowercase value shown in each comment.
  enum GiverCapacity {
    GIVER_CAPACITY_UNSPECIFIED = 0;
    // "guardian"
    GIVER_CAPACITY_GUARDIAN = 1;
    // "self"
    GIVER_CAPACITY_SELF = 2;
  }
  // Allowed values of scope; REST/JSON uses the lowercase value shown in each comment.
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    // "class"
    SCOPE_CLASS = 1;
    // "institution"
    SCOPE_INSTITUTION = 2;
    // "inter_school"
    SCOPE_INTER_SCHOOL = 3;
    // "public"
    SCOPE_PUBLIC = 4;
    // "tenant"
    SCOPE_TENANT = 5;
  }
  // Allowed values of decision; REST/JSON uses the lowercase value shown in each comment.
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    // "granted"
    DECISION_GRANTED = 1;
    // "refused"
    DECISION_REFUSED = 2;
  }
}
message RecordConsentOnBehalfResponse {
  ConsentRecord consent_record = 1;
}

message VerifyConsentRecordRequest {
  // Path parameter consentRecordId.
  string consent_record_id = 1;
  // Concurrency token from the last read (optional but recommended).
  optional string etag = 2;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 3;
}
message VerifyConsentRecordResponse {
  ConsentRecord consent_record = 1;
}

// One row of the consent centre: the caller's own decision about one subject and one purpose, and the effective
// result; never another giver's decision.
message MyConsent {
  // The caller's live consent record; absent while the caller has not decided. [UUID] Output only.
  optional string id = 1;
  // The person the decision is about: the caller, or a child the caller is the legal guardian of. [UUID]
  string subject_person_id = 2;
  // The catalogue purpose.
  string purpose_code = 3;
  // The width the caller decided at; absent while undecided.
  Scope scope = 4;
  // The caller's own decision.
  MyStatus my_status = 5;
  // The widest width processing is currently allowed at, every legal guardian's decision taken together.
  Scope effective_widest_scope = 6;
  // When the caller decided; absent while undecided.
  google.protobuf.Timestamp decided_at = 7;
  // Number of the notice version the caller decided under; absent while undecided.
  optional int32 notice_version = 8;
  // How the caller's decision was given (web, paper_form ...); absent while undecided.
  optional string channel = 9;
  // Entity tag of the caller's consent record; send back on withdraw.
  optional string etag = 10;
  // Allowed values of scope; REST/JSON uses the lowercase value shown in each comment.
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    // "class"
    SCOPE_CLASS = 1;
    // "institution"
    SCOPE_INSTITUTION = 2;
    // "inter_school"
    SCOPE_INTER_SCHOOL = 3;
    // "public"
    SCOPE_PUBLIC = 4;
    // "tenant"
    SCOPE_TENANT = 5;
  }
  // Allowed values of my_status; REST/JSON uses the lowercase value shown in each comment.
  enum MyStatus {
    MY_STATUS_UNSPECIFIED = 0;
    // "expired"
    MY_STATUS_EXPIRED = 1;
    // "granted"
    MY_STATUS_GRANTED = 2;
    // "not_answered"
    MY_STATUS_NOT_ANSWERED = 3;
    // "reconsent_required"
    MY_STATUS_RECONSENT_REQUIRED = 4;
    // "refused"
    MY_STATUS_REFUSED = 5;
  }
}

// A privacy notice as the consent centre shows it: the active version in the language asked for.
message MyNotice {
  // The active version shown; send it back when deciding. [UUID]
  string notice_version_id = 1;
  // Code of the notice within the tenant.
  string notice_code = 2;
  // Number of the version.
  int32 version = 3;
  // The language of the wording returned (BCP 47); send it back when deciding.
  string language = 4;
  // The purposes the notice asks consent for.
  repeated string purpose_codes = 5;
  // Whether consents given under earlier versions must be given again.
  bool requires_reconsent = 6;
  // The school's grievance officer.
  GrievanceContact grievance_contact = 7;
  // The notice in Markdown.
  string body_markdown = 8;
  // Short plain version shown to a minor alongside the notice.
  optional string summary_for_children = 9;
  // Lowercase hex SHA-256 of the body, a blank line and the summary.
  string content_sha256 = 10;
  // When the version was published.
  google.protobuf.Timestamp published_at = 11;
}

// One consent decision as staff see it: how it was given and whether it was verified.
message ConsentRecord {
  // Surrogate primary key (UUIDv7 generated by the application). [UUID] Output only.
  string id = 1;
  // The person the decision is about. [UUID]
  string subject_person_id = 2;
  // The person who decided. [UUID]
  string giver_person_id = 3;
  // self, guardian or nominee.
  GiverCapacity giver_capacity = 4;
  // The catalogue purpose.
  string purpose_code = 5;
  // The width decided at; tenant for a tenant-scoped purpose.
  Scope scope = 6;
  // granted or refused.
  Decision decision = 7;
  // The notice version shown. [UUID]
  string notice_version_id = 8;
  // The language of the translation shown.
  string notice_language = 9;
  // When the decision was recorded.
  google.protobuf.Timestamp valid_from = 10;
  // Last day the decision counts; absent = until withdrawn. [ISO-8601 date (YYYY-MM-DD)]
  optional string valid_until = 11;
  // When the giver withdrew it; absent = not withdrawn.
  google.protobuf.Timestamp withdrawn_at = 12;
  // The giver's newer decision that replaced it. [UUID]
  optional string superseded_by_id = 13;
  // How the decision was given.
  Channel channel = 14;
  // verified (counts), unverified (awaiting a second staff member) or rejected.
  VerificationStatus verification_status = 15;
  // How the giver was established (existing_record, paper_form_countersigned ...).
  optional string verification_method = 16;
  // The staff member who verified a paper form. [UUID]
  optional string verified_by_user_id = 17;
  // When the record became verified.
  google.protobuf.Timestamp verified_at = 18;
  // The staff member who recorded a paper form. [UUID]
  optional string recorded_by_user_id = 19;
  // The scanned signed form (a platform file). [UUID]
  optional string evidence_file_id = 20;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 21;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 22;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 23;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 24;
  // Entity tag (row version); send back on verify.
  string etag = 25;
  // Allowed values of giver_capacity; REST/JSON uses the lowercase value shown in each comment.
  enum GiverCapacity {
    GIVER_CAPACITY_UNSPECIFIED = 0;
    // "guardian"
    GIVER_CAPACITY_GUARDIAN = 1;
    // "nominee"
    GIVER_CAPACITY_NOMINEE = 2;
    // "self"
    GIVER_CAPACITY_SELF = 3;
  }
  // Allowed values of scope; REST/JSON uses the lowercase value shown in each comment.
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    // "class"
    SCOPE_CLASS = 1;
    // "institution"
    SCOPE_INSTITUTION = 2;
    // "inter_school"
    SCOPE_INTER_SCHOOL = 3;
    // "public"
    SCOPE_PUBLIC = 4;
    // "tenant"
    SCOPE_TENANT = 5;
  }
  // Allowed values of decision; REST/JSON uses the lowercase value shown in each comment.
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    // "granted"
    DECISION_GRANTED = 1;
    // "refused"
    DECISION_REFUSED = 2;
  }
  // Allowed values of channel; REST/JSON uses the lowercase value shown in each comment.
  enum Channel {
    CHANNEL_UNSPECIFIED = 0;
    // "consent_manager"
    CHANNEL_CONSENT_MANAGER = 1;
    // "email"
    CHANNEL_EMAIL = 2;
    // "import"
    CHANNEL_IMPORT = 3;
    // "in_person"
    CHANNEL_IN_PERSON = 4;
    // "mobile_app"
    CHANNEL_MOBILE_APP = 5;
    // "paper_form"
    CHANNEL_PAPER_FORM = 6;
    // "web"
    CHANNEL_WEB = 7;
  }
  // Allowed values of verification_status; REST/JSON uses the lowercase value shown in each comment.
  enum VerificationStatus {
    VERIFICATION_STATUS_UNSPECIFIED = 0;
    // "rejected"
    VERIFICATION_STATUS_REJECTED = 1;
    // "unverified"
    VERIFICATION_STATUS_UNVERIFIED = 2;
    // "verified"
    VERIFICATION_STATUS_VERIFIED = 3;
  }
}
