// Whether one subject's data may be processed for an activity at a width. Output only.
message ConsentDecision {
  // The person the decision is about. [UUID]
  string subject_person_id = 1;
  // Whether the processing may go ahead.
  bool allowed = 2;
  // Why the decision allows or denies.
  Reason reason = 3;
  // The activity's legal basis; absent for an unknown activity.
  optional string legal_basis = 4;
  // The subject's consent state version; a cached decision older than an event's state version is stale.
  int64 state_version = 5;
  // Allowed values of reason; REST/JSON uses the lowercase value shown in each comment.
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // "consent"
    REASON_CONSENT = 1;
    // "expired"
    REASON_EXPIRED = 2;
    // "forbidden_for_minor"
    REASON_FORBIDDEN_FOR_MINOR = 3;
    // "narrower_grant"
    REASON_NARROWER_GRANT = 4;
    // "non_consent_basis"
    REASON_NON_CONSENT_BASIS = 5;
    // "not_answered"
    REASON_NOT_ANSWERED = 6;
    // "purpose_disabled"
    REASON_PURPOSE_DISABLED = 7;
    // "reconsent_required"
    REASON_RECONSENT_REQUIRED = 8;
    // "refused"
    REASON_REFUSED = 9;
    // "unknown_activity"
    REASON_UNKNOWN_ACTIVITY = 10;
  }
}

// How the calling tenant stands on an activity's purpose. Output only.
message PurposeStatus {
  // The processing activity.
  string activity_code = 1;
  // The purpose the activity serves.
  string purpose_code = 2;
  // The activity's legal basis.
  string legal_basis = 3;
  // Whether the tenant has switched the purpose on.
  bool enabled = 4;
  // The widest width the tenant allows for a width purpose; absent = no ceiling.
  optional string max_scope = 5;
  // The active version of the notice the tenant asks consent under; absent while none is active. [UUID]
  optional string active_notice_version_id = 6;
}

// A person whose data may be processed for an activity at a width. Output only.
message ConsentedSubject {
  // The person. [UUID]
  string subject_person_id = 1;
}

