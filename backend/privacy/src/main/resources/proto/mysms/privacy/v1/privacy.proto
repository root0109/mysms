// One row of the consent centre: the caller's own decision about one subject and one purpose, and the effective
// result; never another giver's decision.
message MyConsent {
  // The caller's live consent record; absent while the caller has not decided. [UUID] Output only.
  optional string id = 1;
  // The person the decision is about: the caller, or a child the caller is the legal guardian of. [UUID]
  string subject_person_id = 2;
  // The catalogue purpose.
  string purpose_code = 3;
  // The width the caller decided at; absent while undecided.
  Scope scope = 4;
  // The caller's own decision; absent on a minor_self row (the caller does not decide).
  MyStatus my_status = 5;
  // The widest width processing is currently allowed at, every legal guardian's decision taken together.
  Scope effective_widest_scope = 6;
  // When the caller decided; absent while undecided.
  google.protobuf.Timestamp decided_at = 7;
  // Number of the notice version the caller decided under; absent while undecided.
  optional int32 notice_version = 8;
  // How the caller's decision was given (web, paper_form ...); absent while undecided.
  optional string channel = 9;
  // Entity tag of the caller's consent record; send back on withdraw.
  optional string etag = 10;
  // How the caller stands to the subject: self (an adult deciding for themself), guardian (for a minor they are the
  // active legal guardian of) or minor_self (a minor's own row: read only, their legal guardians decide).
  Capacity capacity = 11;
  // Code of the school's notice for the purpose, to read with GetMyNotice; absent while the notice has no published
  // version (nothing can be decided then).
  optional string notice_code = 12;
  // The notice's active version, the one a decision is recorded under; absent with notice_code. [UUID]
  optional string notice_version_id = 13;
  // The widths the purpose can be decided at within the school's ceiling, narrowest first (tenant alone for a
  // tenant-scoped purpose).
  repeated Scope allowed_scopes = 14;
  // On a minor_self row only: the day the caller comes of age and decides for themself. [ISO-8601 date (YYYY-MM-DD)]
  optional string decides_from = 15;
  // Allowed values of capacity; REST/JSON uses the lowercase value shown in each comment.
  enum Capacity {
    CAPACITY_UNSPECIFIED = 0;
    // "guardian"
    CAPACITY_GUARDIAN = 1;
    // "minor_self"
    CAPACITY_MINOR_SELF = 2;
    // "self"
    CAPACITY_SELF = 3;
  }
  // Allowed values of scope; REST/JSON uses the lowercase value shown in each comment.
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    // "class"
    SCOPE_CLASS = 1;
    // "institution"
    SCOPE_INSTITUTION = 2;
    // "inter_school"
    SCOPE_INTER_SCHOOL = 3;
    // "public"
    SCOPE_PUBLIC = 4;
    // "tenant"
    SCOPE_TENANT = 5;
  }
  // Allowed values of my_status; REST/JSON uses the lowercase value shown in each comment.
  enum MyStatus {
    MY_STATUS_UNSPECIFIED = 0;
    // "expired"
    MY_STATUS_EXPIRED = 1;
    // "granted"
    MY_STATUS_GRANTED = 2;
    // "not_answered"
    MY_STATUS_NOT_ANSWERED = 3;
    // "reconsent_required"
    MY_STATUS_RECONSENT_REQUIRED = 4;
    // "refused"
    MY_STATUS_REFUSED = 5;
  }
}

// A privacy notice as the consent centre shows it: the active version in the language asked for.
message MyNotice {
  // The active version shown; send it back when deciding. [UUID]
  string notice_version_id = 1;
