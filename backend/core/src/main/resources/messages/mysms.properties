# Error sentences of the MySMS API by code (core's MessageUtil and ConstraintMapper). This base bundle is English.
# Another language: messages/mysms_<language>.properties with the same keys, UTF-8.
constraint.NotNull=must not be null
constraint.NotBlank=must not be blank
constraint.NotEmpty=must not be empty
# privacy: switching a purpose on, and the purposes a notice version names
constraint.CONSENT_NOTICE_NOT_ACTIVE=must name a notice whose active version lists this purpose
constraint.PURPOSE_NOT_ACTIVE=must name an active purpose of the catalogue
constraint.PURPOSE_PLATFORM_FIDUCIARY=is decided by the platform and cannot be switched on by a school
constraint.MAX_SCOPE_NOT_APPLICABLE=applies only to a purpose whose consents name a width
# privacy: recording a consent decision
constraint.CONSENT_PURPOSE_DISABLED=must name a purpose the school has switched on
constraint.CONSENT_SCOPE_ABOVE_TENANT_MAX=must be a width the purpose takes and the school allows
constraint.CONSENT_FORBIDDEN_FOR_MINOR=cannot be consented to for a minor, not even by a guardian
# privacy: extending a rights request's response deadline
constraint.RIGHTS_REQUEST_DUE_AT_NOT_LATER=must be later than the request's current due date
# privacy: submitting and closing a rights request
constraint.RIGHTS_REQUEST_DETAILS_REQUIRED=is required for this type of request
constraint.RIGHTS_REQUEST_DETAILS_NOT_ALLOWED=does not apply to this type of request
constraint.RIGHTS_REQUEST_TYPE_NOT_ALLOWED=only the principal's nominee submits a nomination request
constraint.RIGHTS_REQUEST_NOMINEE_NOT_ACTIVE=is open to a nominee only once their nomination request is fulfilled
constraint.RIGHTS_REQUEST_RESPONSE_REQUIRED=must answer the requester: a grievance always, a declined correction with its reason
# privacy: the breach register
constraint.BREACH_TIME_IN_FUTURE=must not be in the future
constraint.BREACH_AWARE_BEFORE_DETECTED=must not be earlier than when the breach was detected
constraint.BREACH_NOTICE_BEFORE_AWARE=must not be earlier than when the school became aware of the breach
constraint.BREACH_CATEGORY_UNKNOWN=must name data categories of the catalogue
constraint.BREACH_MODULE_INVALID=must name MySMS modules by their codes
# privacy: legal holds
constraint.LEGAL_HOLD_TARGET_REQUIRED=is required for this scope of hold
constraint.LEGAL_HOLD_TARGET_NOT_ALLOWED=does not apply to this scope of hold
constraint.LEGAL_HOLD_CATEGORY_UNKNOWN=must name a data category of the catalogue
constraint.LEGAL_HOLD_MODULE_INVALID=must name a MySMS module by its code
constraint.LEGAL_HOLD_REVIEW_BY_PAST=must be today or later
# privacy: retention policies
constraint.RETENTION_BELOW_LEGAL_FLOOR=must not be shorter than the policy's legal floor
# privacy: consent coverage
constraint.SCOPE_NOT_APPLICABLE=is not a width the purpose takes
# a processing that needs the person's consent (privacy-client)
constraint.CONSENT_REQUIRED=needs the person's consent, which has not been given
