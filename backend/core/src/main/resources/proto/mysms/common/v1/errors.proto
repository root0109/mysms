// The error a MySMS gRPC server adds to the trailers of every refused call (key error-message-bin, packed in a
// google.protobuf.Any), next to the google.rpc.Status details of api/README "Errors": the REST problem of the same
// refusal, which a MySMS gRPC client unwraps into its integration exception (core IntegrationGrpcClientException).
syntax = "proto3";

package mysms.common.v1;

option java_multiple_files = true;
option java_outer_classname = "ErrorsProto";
option java_package = "com.mysms.common.v1";

// A refused call, as the REST problem+json of the same refusal states it.
message ErrorMessage {
  // The problem code (VALIDATION_FAILED, NOT_FOUND, PERMISSION_DENIED ...).
  string code = 1;
  // The HTTP status REST answers the same refusal with.
  int32 status = 2;
  // The sentence the server wrote on purpose; never an exception's message.
  string detail = 3;
  // The trace the refusal was logged under.
  string trace_id = 4;
  // One entry per refused field.
  repeated ErrorField errors = 5;
}

// One refused field of an ErrorMessage.
message ErrorField {
  string field = 1;
  string message = 2;
  string code = 3;
}
