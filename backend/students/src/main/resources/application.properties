# The students service's configuration (JAVA-CODING-RULES §2.1). Every value is a default over an
# environment variable of DEPLOYMENT.md §4: an operator's application.properties beside the jar, environment
# variables, system properties and the command line override any of it. In the monolith, app combines this file
# with every other module's and sets the process-wide keys in its own application.properties.

spring.application.name=students
spring.threads.virtual.enabled=true
server.port=${PORT:8080}
server.shutdown=graceful
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# authentication (auth-client): the OIDC issuer has no default, a service refuses to start without it; the OpenAPI
# document and Swagger UI stay closed unless the operator opens them
mysms.auth.issuer=${MYSMS_AUTH_ISSUER}
mysms.auth.jwk-set-uri=${MYSMS_AUTH_JWK_SET_URI:}
mysms.auth.api-docs=${MYSMS_API_DOCS:false}
mysms.auth.modules[0]=sis
mysms.auth.modules[1]=admission
mysms.auth.modules[2]=careers
# the deployed release, published with this module's API-permission catalogue (JAVA-CODING-RULES §16.2)
mysms.auth.release=${MYSMS_RELEASE:development}
# how often the catalogue is published again, so iam can retire what no running release serves (below iam's
# mysms.iam.api-permission.retire-after)
mysms.auth.catalogue-interval=${MYSMS_CATALOGUE_INTERVAL:6h}
# how long the permissions filter keeps a role's permission codes before asking iam again (a token issued after a
# role change refreshes it at once)
mysms.auth.role-cache-ttl=${MYSMS_ROLE_CACHE_TTL:PT1M}
# service identity: where iam issues service tokens (blank = no service calls), and this module's client secret
mysms.auth.token-uri=${MYSMS_AUTH_TOKEN_URI:}
mysms.sis.service-client.secret=${MYSMS_SIS_SERVICE_CLIENT_SECRET:}
# privacy (privacy-client): privacy's service, called with this module's service identity; consent checks (how long
# one answer may take, how long an answer is kept) and privacy tasks and retention runs (how long privacy's answer on
# the legal holds may take: without one nothing is erased and the task answers failed; how often the module's job runs
# the tasks received)
grpc.client.privacy-service.address=${MYSMS_PRIVACY_GRPC_ADDRESS:dns:///privacy-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_PRIVACY_SERVICE_PORT_RPC:9112}}
grpc.client.privacy-service.negotiationType=PLAINTEXT
mysms.privacy-client.deadline=${MYSMS_PRIVACY_CLIENT_DEADLINE:300ms}
mysms.privacy-client.cache-ttl=${MYSMS_PRIVACY_CLIENT_CACHE_TTL:60s}
mysms.privacy-client.holds-deadline=${MYSMS_PRIVACY_CLIENT_HOLDS_DEADLINE:2s}
mysms.privacy-client.task-interval=${MYSMS_PRIVACY_CLIENT_TASK_INTERVAL:5m}

# gRPC server (JAVA-CODING-RULES §10.4): health on, reflection only when the operator opens it, REST's 10 MB body limit
grpc.server.port=${MYSMS_GRPC_SERVER_PORT:9112}
grpc.server.health-service-enabled=true
grpc.server.reflection-service-enabled=${MYSMS_GRPC_REFLECTION:false}
grpc.server.shutdown-grace-period=20s
grpc.server.max-inbound-message-size=10MB
# gRPC clients: every call waits at most this long when its stub sets no deadline
mysms.grpc.client.deadline=${MYSMS_GRPC_CLIENT_DEADLINE:10s}
# the services sis calls, by Kubernetes DNS name unless MYSMS_<MODULE>_GRPC_ADDRESS names another target;
# plaintext: TLS ends at the mesh or proxy, as for REST
grpc.client.academics-service.address=${MYSMS_ACADEMICS_GRPC_ADDRESS:dns:///academics-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_ACADEMICS_SERVICE_PORT_RPC:9112}}
grpc.client.academics-service.negotiationType=PLAINTEXT
grpc.client.iam-service.address=${MYSMS_IAM_GRPC_ADDRESS:dns:///identity-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_IDENTITY_SERVICE_PORT_RPC:9112}}
grpc.client.iam-service.negotiationType=PLAINTEXT
grpc.client.org-service.address=${MYSMS_ORG_GRPC_ADDRESS:dns:///platform-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_PLATFORM_SERVICE_PORT_RPC:9112}}
grpc.client.org-service.negotiationType=PLAINTEXT
grpc.client.people-service.address=${MYSMS_PEOPLE_GRPC_ADDRESS:dns:///identity-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_IDENTITY_SERVICE_PORT_RPC:9112}}
grpc.client.people-service.negotiationType=PLAINTEXT

# events: rabbitmq (default) | google-pubsub | in-process (one JVM) | none (tests only); a microservice publishes as
# its module's broker user (blank = mysms-<module>)
mysms.events.bus=${MYSMS_EVENTS_BUS:rabbitmq}
mysms.events.rabbitmq.uri=${MYSMS_RABBITMQ_URI:}
mysms.events.rabbitmq.publisher-user=${MYSMS_RABBITMQ_PUBLISHER_USER:}
mysms.events.google-pubsub.project-id=${MYSMS_EVENTS_GCP_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
mysms.events.google-pubsub.emulator-host=${PUBSUB_EMULATOR_HOST:}

# background work (core): monthly partitions of the module's database (DEPLOYMENT.md §5.6) and the scheduled-job
# runtime (ROADMAP ARC-4); a replica with jobs off leaves the module's scheduled runs to the others
mysms.partitions.enabled=${MYSMS_PARTITIONS_ENABLED:true}
mysms.partitions.interval=${MYSMS_PARTITIONS_INTERVAL:24h}
mysms.partitions.months-ahead=${MYSMS_PARTITIONS_MONTHS_AHEAD:3}
mysms.partitions.retention-months=${MYSMS_PARTITIONS_RETENTION_MONTHS:0}
mysms.jobs.enabled=${MYSMS_JOBS_ENABLED:true}
mysms.jobs.poll-interval=${MYSMS_JOBS_POLL_INTERVAL:1m}
mysms.jobs.lease=${MYSMS_JOBS_LEASE:30m}
mysms.jobs.batch-size=${MYSMS_JOBS_BATCH_SIZE:20}

# the module's database: its own variable first, then the shared one (DEPLOYMENT.md §4); the application role gets
# DML grants only, Flyway runs as the schema owner, the outbox relay as mysms_relay; a blank replica = every read on
# the primary; statements slower than slow-statement are named in the log (0 = off)
mysms.sis.datasource.url=${MYSMS_SIS_DB_URL:${MYSMS_DB_URL:jdbc:postgresql://localhost:5432/mysms}}
mysms.sis.datasource.username=${MYSMS_SIS_DB_USER:${MYSMS_DB_USER:mysms}}
mysms.sis.datasource.password=${MYSMS_SIS_DB_PASSWORD:${MYSMS_DB_PASSWORD:}}
mysms.sis.datasource.maximum-pool-size=${MYSMS_SIS_DB_POOL_SIZE:10}
mysms.sis.datasource.slow-statement=${MYSMS_SIS_DB_SLOW_STATEMENT:${MYSMS_DB_SLOW_STATEMENT:200ms}}
mysms.sis.datasource.replica-url=${MYSMS_SIS_DB_REPLICA_URL:${MYSMS_DB_REPLICA_URL:}}
mysms.sis.datasource.replica-username=${MYSMS_SIS_DB_REPLICA_USER:${MYSMS_DB_REPLICA_USER:}}
mysms.sis.datasource.replica-password=${MYSMS_SIS_DB_REPLICA_PASSWORD:${MYSMS_DB_REPLICA_PASSWORD:}}
mysms.sis.datasource.migrate-username=${MYSMS_SIS_DB_MIGRATE_USER:${MYSMS_DB_MIGRATE_USER:}}
mysms.sis.datasource.migrate-password=${MYSMS_SIS_DB_MIGRATE_PASSWORD:${MYSMS_DB_MIGRATE_PASSWORD:}}
mysms.sis.datasource.relay-username=${MYSMS_SIS_DB_RELAY_USER:${MYSMS_DB_RELAY_USER:}}
mysms.sis.datasource.relay-password=${MYSMS_SIS_DB_RELAY_PASSWORD:${MYSMS_DB_RELAY_PASSWORD:}}

# admission (an area of students: its own schema, pool and configuration namespace mysms.admission.*)
mysms.admission.service-client.secret=${MYSMS_ADMISSION_SERVICE_CLIENT_SECRET:}
# the module's database: its own variable first, then the shared one (DEPLOYMENT.md §4); the application role gets
# DML grants only, Flyway runs as the schema owner, the outbox relay as mysms_relay; a blank replica = every read on
# the primary; statements slower than slow-statement are named in the log (0 = off)
mysms.admission.datasource.url=${MYSMS_ADMISSION_DB_URL:${MYSMS_DB_URL:jdbc:postgresql://localhost:5432/mysms}}
mysms.admission.datasource.username=${MYSMS_ADMISSION_DB_USER:${MYSMS_DB_USER:mysms}}
mysms.admission.datasource.password=${MYSMS_ADMISSION_DB_PASSWORD:${MYSMS_DB_PASSWORD:}}
mysms.admission.datasource.maximum-pool-size=${MYSMS_ADMISSION_DB_POOL_SIZE:10}
mysms.admission.datasource.slow-statement=${MYSMS_ADMISSION_DB_SLOW_STATEMENT:${MYSMS_DB_SLOW_STATEMENT:200ms}}
mysms.admission.datasource.replica-url=${MYSMS_ADMISSION_DB_REPLICA_URL:${MYSMS_DB_REPLICA_URL:}}
mysms.admission.datasource.replica-username=${MYSMS_ADMISSION_DB_REPLICA_USER:${MYSMS_DB_REPLICA_USER:}}
mysms.admission.datasource.replica-password=${MYSMS_ADMISSION_DB_REPLICA_PASSWORD:${MYSMS_DB_REPLICA_PASSWORD:}}
mysms.admission.datasource.migrate-username=${MYSMS_ADMISSION_DB_MIGRATE_USER:${MYSMS_DB_MIGRATE_USER:}}
mysms.admission.datasource.migrate-password=${MYSMS_ADMISSION_DB_MIGRATE_PASSWORD:${MYSMS_DB_MIGRATE_PASSWORD:}}
mysms.admission.datasource.relay-username=${MYSMS_ADMISSION_DB_RELAY_USER:${MYSMS_DB_RELAY_USER:}}
mysms.admission.datasource.relay-password=${MYSMS_ADMISSION_DB_RELAY_PASSWORD:${MYSMS_DB_RELAY_PASSWORD:}}

# careers (an area of students: its own schema, pool and configuration namespace mysms.careers.*)
mysms.careers.service-client.secret=${MYSMS_CAREERS_SERVICE_CLIENT_SECRET:}
# the module's database: its own variable first, then the shared one (DEPLOYMENT.md §4); the application role gets
# DML grants only, Flyway runs as the schema owner, the outbox relay as mysms_relay; a blank replica = every read on
# the primary; statements slower than slow-statement are named in the log (0 = off)
mysms.careers.datasource.url=${MYSMS_CAREERS_DB_URL:${MYSMS_DB_URL:jdbc:postgresql://localhost:5432/mysms}}
mysms.careers.datasource.username=${MYSMS_CAREERS_DB_USER:${MYSMS_DB_USER:mysms}}
mysms.careers.datasource.password=${MYSMS_CAREERS_DB_PASSWORD:${MYSMS_DB_PASSWORD:}}
mysms.careers.datasource.maximum-pool-size=${MYSMS_CAREERS_DB_POOL_SIZE:10}
mysms.careers.datasource.slow-statement=${MYSMS_CAREERS_DB_SLOW_STATEMENT:${MYSMS_DB_SLOW_STATEMENT:200ms}}
mysms.careers.datasource.replica-url=${MYSMS_CAREERS_DB_REPLICA_URL:${MYSMS_DB_REPLICA_URL:}}
mysms.careers.datasource.replica-username=${MYSMS_CAREERS_DB_REPLICA_USER:${MYSMS_DB_REPLICA_USER:}}
mysms.careers.datasource.replica-password=${MYSMS_CAREERS_DB_REPLICA_PASSWORD:${MYSMS_DB_REPLICA_PASSWORD:}}
mysms.careers.datasource.migrate-username=${MYSMS_CAREERS_DB_MIGRATE_USER:${MYSMS_DB_MIGRATE_USER:}}
mysms.careers.datasource.migrate-password=${MYSMS_CAREERS_DB_MIGRATE_PASSWORD:${MYSMS_DB_MIGRATE_PASSWORD:}}
mysms.careers.datasource.relay-username=${MYSMS_CAREERS_DB_RELAY_USER:${MYSMS_DB_RELAY_USER:}}
mysms.careers.datasource.relay-password=${MYSMS_CAREERS_DB_RELAY_PASSWORD:${MYSMS_DB_RELAY_PASSWORD:}}
# outgoing e-mail (core MailDelivery): SMTP with STARTTLS; a blank host = no mail (the operations that send answer 503
# NOT_CONFIGURED); STARTTLS may be made optional only for a local relay
mysms.careers.smtp.host=${MYSMS_SMTP_HOST:}
mysms.careers.smtp.port=${MYSMS_SMTP_PORT:587}
mysms.careers.smtp.username=${MYSMS_SMTP_USERNAME:}
mysms.careers.smtp.password=${MYSMS_SMTP_PASSWORD:}
mysms.careers.smtp.from=${MYSMS_SMTP_FROM:}
mysms.careers.smtp.starttls-required=${MYSMS_SMTP_STARTTLS_REQUIRED:true}
