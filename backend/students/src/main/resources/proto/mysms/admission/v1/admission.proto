message GetOperationRequest {
  // Path parameter operationId.
  string operation_id = 1;
}

message GetOperationResponse {
  mysms.common.v1.Operation result = 1;
}

message ListOperationsRequest {
  // Filter by kind.
  optional string kind = 1;
  // The page to read: number, size and the cursor of a next page (api/README "Pagination"). Its sort is not taken:
  // the rows come in their one fixed order, as over REST, which has no sort parameter here.
  mysms.common.v1.PageableRequest pageable = 4;
  // Fields 2 (page_size), 3 (page_token) replaced by pageable: one-based pages, repeated sort
  // criteria and a cursor carried by the response's pagination.
  reserved 2, 3;
  reserved "page_size", "page_token";
}

message ListOperationsResponse {
  repeated mysms.common.v1.Operation items = 1;
  // Where this page is and how to reach the next one (api/README "Pagination").
  mysms.common.v1.Pagination pagination = 3;
  // Fields 2 (next_page_token) replaced by pagination; lists no longer count their
  // rows.
  reserved 2;
  reserved "next_page_token";
}

message CancelOperationRequest {
  // Path parameter operationId.
  string operation_id = 1;
  // Idempotency key (UUID); same as the Idempotency-Key header on REST. Retries with the same key return the original result.
  optional string request_id = 2;
}

message CancelOperationResponse {
  mysms.common.v1.Operation result = 1;
}
