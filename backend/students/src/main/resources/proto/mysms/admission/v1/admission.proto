// An admission window for a program, course or grade in an academic year.
message AdmissionCycle {
  // Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback). [UUID] Output only.
  string id = 1;
  // Institution. [UUID]
  string institution_id = 2;
  // Cycle name.
  string name = 3;
  // What applicants apply for.
  AdmissionBasis admission_basis = 4;
  // Program (basis = program). [UUID]
  optional string program_id = 5;
  // Course (basis = course). [UUID]
  optional string course_id = 6;
  // Grade (basis = grade_level). [UUID]
  optional string grade_level_id = 7;
  // Academic year. [UUID]
  optional string academic_year_id = 8;
  // Term. [UUID]
  optional string academic_term_id = 9;
  // Opens. [ISO-8601 date (YYYY-MM-DD)]
  string start_date = 10;
  // Closes. [ISO-8601 date (YYYY-MM-DD)]
  optional string end_date = 11;
  // Minimum applications to run the cycle.
  optional int32 min_applications = 12;
  // Seat / application cap.
  optional int32 max_applications = 13;
  // Minimum age at admission.
  optional int32 minimum_age_years = 14;
  // Fee head charged on application. [UUID]
  optional string application_fee_head_id = 15;
  // Cycle state. Changed only through the workflow operations. Output only.
  Status status = 16;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 17;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 18;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 19;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 20;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 21;
  // Allowed values of admission_basis; REST/JSON uses the lowercase value shown in each comment.
  enum AdmissionBasis {
    ADMISSION_BASIS_UNSPECIFIED = 0;
    // "program"
    ADMISSION_BASIS_PROGRAM = 1;
    // "course"
    ADMISSION_BASIS_COURSE = 2;
    // "grade_level"
    ADMISSION_BASIS_GRADE_LEVEL = 3;
  }
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "draft"
    STATUS_DRAFT = 1;
    // "confirmed"
    STATUS_CONFIRMED = 2;
    // "open"
    STATUS_OPEN = 3;
    // "admission"
