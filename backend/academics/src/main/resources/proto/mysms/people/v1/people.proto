// The changes of UpdateMyPerson (PATCH, JAVA-CODING-RULES §7.2): a field left unset keeps its value, a
// Nullable* wrapper holding null clears it (an enum: its _UNSPECIFIED value), a value sets it.
message MyPersonUpdate {
  // Fields 1-8 were the body of the update-mask request (ARC-9: replaced by this message).
  reserved 1 to 8;
  reserved "photo_file_id";
  // ETag from the last read; required (If-Match).
  string etag = 9;
  // Validate without persisting.
  bool validate_only = 10;
  // Personal e-mail.
  mysms.common.v1.NullableString primary_email = 11;
  // Personal phone.
  mysms.common.v1.NullableString primary_phone = 12;
  // Alternate phone.
  mysms.common.v1.NullableString alternate_phone = 13;
  // Office / work phone.
