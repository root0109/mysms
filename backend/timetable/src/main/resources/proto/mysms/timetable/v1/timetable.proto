// Scheduled teaching session (one class meeting).
message Session {
  // Surrogate primary key (UUIDv7 generated by the application; database default is a v4 fallback). [UUID] Output only.
  string id = 1;
  // Institution. [UUID]
  string institution_id = 2;
  // Period. [UUID]
  optional string period_id = 3;
  // Start.
  google.protobuf.Timestamp start_at = 4;
  // End.
  google.protobuf.Timestamp end_at = 5;
  // ISO weekday (1 = Monday).
  optional int32 weekday = 6;
  // Class section (K-12). [UUID]
  optional string class_section_id = 7;
  // Course (higher education). [UUID]
  optional string course_id = 8;
  // Batch (higher education). [UUID]
  optional string batch_id = 9;
  // Subject taught. [UUID]
  string subject_id = 10;
  // Teacher. [UUID]
  string staff_id = 11;
  // Room. [UUID]
  optional string room_id = 12;
  // Display title.
  optional string title = 13;
  // Session type (lecture, lab, tutorial...).
  optional string session_type = 14;
  // Calendar colour index.
  optional int32 color = 15;
  // Session state. Changed only through the workflow operations. Output only.
  Status status = 16;
  // Row creation time. Output only.
  google.protobuf.Timestamp create_time = 17;
  // User account that created the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string created_by = 18;
  // Last update time. Output only.
  google.protobuf.Timestamp update_time = 19;
  // User account that last updated the row (audit reference to iam.user_account; not FK-constrained). [UUID] Output only.
  optional string updated_by = 20;
  // Entity tag (row version). Output only on reads; send back on update/delete.
  string etag = 21;
  // Allowed values of status; REST/JSON uses the lowercase value shown in each comment.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // "draft"
    STATUS_DRAFT = 1;
    // "confirmed"
    STATUS_CONFIRMED = 2;
    // "done"
    STATUS_DONE = 3;
    // "cancelled"
    STATUS_CANCELLED = 4;
  }
}

