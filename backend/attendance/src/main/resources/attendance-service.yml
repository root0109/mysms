# GENERATED by tools/backend/gen_backend_modules.py
# The attendance microservice (Attendance).
spring:
  application:
    name: attendance
  config:
    import: classpath:mysms-attendance.yml
  threads:
    virtual:
      enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
mysms:
  auth:
    # the OIDC issuer (the iam module, or an external IdP); no default: the service refuses to start without it
    issuer: ${MYSMS_AUTH_ISSUER}
    jwk-set-uri: ${MYSMS_AUTH_JWK_SET_URI:}
    modules:
      - attendance
  events:
    # rabbitmq (default) | google-pubsub | in-process (one JVM) | none (tests only: nothing relayed or consumed)
    bus: ${MYSMS_EVENTS_BUS:rabbitmq}
    rabbitmq:
      uri: ${MYSMS_RABBITMQ_URI:}
      # the broker user each module publishes as ({module} = the event's source); blank = mysms-{module}
      publisher-user: ${MYSMS_RABBITMQ_PUBLISHER_USER:}
    google-pubsub:
      project-id: ${MYSMS_EVENTS_GCP_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
      emulator-host: ${PUBSUB_EMULATOR_HOST:}
