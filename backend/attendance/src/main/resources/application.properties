# The attendance service's configuration (JAVA-CODING-RULES §2.1). Every value is a default over an
# environment variable of DEPLOYMENT.md §3: an operator's application.properties beside the jar, environment
# variables, system properties and the command line override any of it. In the monolith, app combines this file
# with every other module's and sets the process-wide keys in its own application.properties.

spring.application.name=attendance
spring.threads.virtual.enabled=true
server.port=${PORT:8080}
server.shutdown=graceful
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# authentication (auth-client): the OIDC issuer has no default, a service refuses to start without it; the OpenAPI
# document and Swagger UI stay closed unless the operator opens them
mysms.auth.issuer=${MYSMS_AUTH_ISSUER}
mysms.auth.jwk-set-uri=${MYSMS_AUTH_JWK_SET_URI:}
mysms.auth.api-docs=${MYSMS_API_DOCS:false}
mysms.auth.modules[0]=attendance
# service identity: where iam issues service tokens (blank = no service calls), and this module's client secret
mysms.auth.token-uri=${MYSMS_AUTH_TOKEN_URI:}
mysms.attendance.service-client.secret=${MYSMS_ATTENDANCE_SERVICE_CLIENT_SECRET:}

# gRPC server (JAVA-CODING-RULES §10.4): health on, reflection only when the operator opens it, REST's 10 MB body limit
grpc.server.port=${MYSMS_GRPC_SERVER_PORT:9112}
grpc.server.health-service-enabled=true
grpc.server.reflection-service-enabled=${MYSMS_GRPC_REFLECTION:false}
grpc.server.shutdown-grace-period=20s
grpc.server.max-inbound-message-size=10MB
# gRPC clients: every call waits at most this long when its stub sets no deadline
mysms.grpc.client.deadline=${MYSMS_GRPC_CLIENT_DEADLINE:10s}
# the services attendance calls, by Kubernetes DNS name unless MYSMS_<MODULE>_GRPC_ADDRESS names another target;
# plaintext: TLS ends at the mesh or proxy, as for REST
grpc.client.org-service.address=${MYSMS_ORG_GRPC_ADDRESS:dns:///org-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_ORG_SERVICE_PORT_RPC:9112}}
grpc.client.org-service.negotiationType=PLAINTEXT
grpc.client.sis-service.address=${MYSMS_SIS_GRPC_ADDRESS:dns:///sis-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_SIS_SERVICE_PORT_RPC:9112}}
grpc.client.sis-service.negotiationType=PLAINTEXT
grpc.client.timetable-service.address=${MYSMS_TIMETABLE_GRPC_ADDRESS:dns:///timetable-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_TIMETABLE_SERVICE_PORT_RPC:9112}}
grpc.client.timetable-service.negotiationType=PLAINTEXT

# events: rabbitmq (default) | google-pubsub | in-process (one JVM) | none (tests only); a microservice publishes as
# its module's broker user (blank = mysms-<module>)
mysms.events.bus=${MYSMS_EVENTS_BUS:rabbitmq}
mysms.events.rabbitmq.uri=${MYSMS_RABBITMQ_URI:}
mysms.events.rabbitmq.publisher-user=${MYSMS_RABBITMQ_PUBLISHER_USER:}
mysms.events.google-pubsub.project-id=${MYSMS_EVENTS_GCP_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
mysms.events.google-pubsub.emulator-host=${PUBSUB_EMULATOR_HOST:}

# the module's database: its own variable first, then the shared one (DEPLOYMENT.md §3); the application role gets
# DML grants only, Flyway runs as the schema owner, the outbox relay as mysms_relay; a blank replica = every read on
# the primary; statements slower than slow-statement are named in the log (0 = off)
mysms.attendance.datasource.url=${MYSMS_ATTENDANCE_DB_URL:${MYSMS_DB_URL:jdbc:postgresql://localhost:5432/mysms}}
mysms.attendance.datasource.username=${MYSMS_ATTENDANCE_DB_USER:${MYSMS_DB_USER:mysms}}
mysms.attendance.datasource.password=${MYSMS_ATTENDANCE_DB_PASSWORD:${MYSMS_DB_PASSWORD:}}
mysms.attendance.datasource.maximum-pool-size=${MYSMS_ATTENDANCE_DB_POOL_SIZE:10}
mysms.attendance.datasource.slow-statement=${MYSMS_ATTENDANCE_DB_SLOW_STATEMENT:${MYSMS_DB_SLOW_STATEMENT:200ms}}
mysms.attendance.datasource.replica-url=${MYSMS_ATTENDANCE_DB_REPLICA_URL:${MYSMS_DB_REPLICA_URL:}}
mysms.attendance.datasource.replica-username=${MYSMS_ATTENDANCE_DB_REPLICA_USER:${MYSMS_DB_REPLICA_USER:}}
mysms.attendance.datasource.replica-password=${MYSMS_ATTENDANCE_DB_REPLICA_PASSWORD:${MYSMS_DB_REPLICA_PASSWORD:}}
mysms.attendance.datasource.migrate-username=${MYSMS_ATTENDANCE_DB_MIGRATE_USER:${MYSMS_DB_MIGRATE_USER:}}
mysms.attendance.datasource.migrate-password=${MYSMS_ATTENDANCE_DB_MIGRATE_PASSWORD:${MYSMS_DB_MIGRATE_PASSWORD:}}
mysms.attendance.datasource.relay-username=${MYSMS_ATTENDANCE_DB_RELAY_USER:${MYSMS_DB_RELAY_USER:}}
mysms.attendance.datasource.relay-password=${MYSMS_ATTENDANCE_DB_RELAY_PASSWORD:${MYSMS_DB_RELAY_PASSWORD:}}
