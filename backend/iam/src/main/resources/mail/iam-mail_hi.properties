# हिंदी: iam के खाता ई-मेल (AccountMessages)। {0} = एक बार का कोड, {1} = लिंक वाली पंक्ति (या कुछ नहीं), {2} = कोड की वैधता।
mail.link=या यह लिंक खोलें: {0}
mail.passwordReset.subject=अपना MySMS पासवर्ड रीसेट करें
mail.passwordReset.body=आपके MySMS खाते का पासवर्ड रीसेट करने का अनुरोध किया गया है।\n\nआपका रीसेट कोड:\n{0}\n\n{1}यह कोड एक बार, {2} मिनट तक काम करता है। यदि आपने यह अनुरोध नहीं किया, तो इस संदेश को अनदेखा करें: आपका पासवर्ड नहीं बदलेगा।
mail.forcedReset.subject=नया MySMS पासवर्ड चुनें
mail.forcedReset.body=एक व्यवस्थापक ने आपसे अपने MySMS खाते के लिए नया पासवर्ड चुनने को कहा है। आपको साइन आउट कर दिया गया है।\n\nआपका रीसेट कोड:\n{0}\n\n{1}यह कोड एक बार, {2} मिनट तक काम करता है।
mail.signUp.subject=अपना MySMS खाता बनाना पूरा करें
mail.signUp.body=साइन अप करने के लिए धन्यवाद। खाता बनाना पूरा करने के लिए इस कोड से अपना पासवर्ड चुनें; इससे यह ई-मेल पता भी पुष्ट हो जाता है।\n\nआपका कोड:\n{0}\n\n{1}यह कोड एक बार, {2} घंटे तक काम करता है। यदि आपने साइन अप नहीं किया, तो इस संदेश को अनदेखा करें।
mail.signUpExisting.subject=आपका MySMS खाता
mail.signUpExisting.body=इस ई-मेल पते से साइन अप करने का प्रयास किया गया, जिसका MySMS खाता पहले से है। साइन इन करें, या इस कोड से नया पासवर्ड चुनें:\n{0}\n\n{1}यह कोड एक बार, {2} मिनट तक काम करता है। यदि यह आप नहीं थे, तो इस संदेश को अनदेखा करें: कुछ नहीं बदलेगा।
mail.verification.subject=अपना ई-मेल पता पुष्ट करें
mail.verification.body=नीचे दिए गए कोड से अपने MySMS खाते के लिए यह ई-मेल पता पुष्ट करें।\n\nआपका कोड:\n{0}\n\n{1}यह कोड एक बार, {2} घंटे तक काम करता है। यदि आपने यह अनुरोध नहीं किया, तो इस संदेश को अनदेखा करें।
