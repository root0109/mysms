# Account e-mails of iam (AccountMessages). {0} = the one-time code, {1} = the "open this link" line (or nothing),
# {2} = how long the code works. MessageFormat: a single quote is written ''.
mail.link=Or open this link: {0}
mail.passwordReset.subject=Reset your MySMS password
mail.passwordReset.body=Someone asked to reset the password of your MySMS account.\n\nYour reset code:\n{0}\n\n{1}The code works once, for {2} minutes. If you did not ask for it, ignore this message: your password stays as it is.
mail.forcedReset.subject=Choose a new MySMS password
mail.forcedReset.body=An administrator asked you to choose a new password for your MySMS account. You have been signed out.\n\nYour reset code:\n{0}\n\n{1}The code works once, for {2} minutes.
mail.signUp.subject=Finish creating your MySMS account
mail.signUp.body=Thank you for signing up. Choose your password with this code to finish creating your account; it also confirms this e-mail address.\n\nYour code:\n{0}\n\n{1}The code works once, for {2} hours. If you did not sign up, ignore this message.
mail.signUpExisting.subject=Your MySMS account
mail.signUpExisting.body=Someone tried to sign up with this e-mail address, which already has a MySMS account. Sign in, or choose a new password with this code:\n{0}\n\n{1}The code works once, for {2} minutes. If this was not you, ignore this message: nothing changes.
mail.verification.subject=Confirm your e-mail address
mail.verification.body=Confirm this e-mail address for your MySMS account with the code below.\n\nYour code:\n{0}\n\n{1}The code works once, for {2} hours. If you did not ask for it, ignore this message.
