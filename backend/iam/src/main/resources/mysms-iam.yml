# GENERATED by tools/backend/gen_backend_modules.py
# Module configuration of iam (Identity & Access). Imported by iam-service.yml (microservice) and by the monolith, so the
# module's settings move with it unchanged when it is split out (JAVA-CODING-RULES §2). Secrets come from the
# environment, never from this file.
mysms:
  iam:
    datasource:
      url: ${MYSMS_IAM_DB_URL:${MYSMS_DB_URL:jdbc:postgresql://localhost:5432/mysms}}
      username: ${MYSMS_IAM_DB_USER:${MYSMS_DB_USER:mysms}}
      password: ${MYSMS_IAM_DB_PASSWORD:${MYSMS_DB_PASSWORD:}}
      maximum-pool-size: ${MYSMS_IAM_DB_POOL_SIZE:10}
      # the schema owner Flyway runs as; the application role above only gets DML grants (database/README "Roles")
      migrate-username: ${MYSMS_IAM_DB_MIGRATE_USER:${MYSMS_DB_MIGRATE_USER:}}
      migrate-password: ${MYSMS_IAM_DB_MIGRATE_PASSWORD:${MYSMS_DB_MIGRATE_PASSWORD:}}
      # the outbox relay's role (database/README "Roles": mysms_platform_admin, BYPASSRLS), granted the outbox only
      relay-username: ${MYSMS_IAM_DB_RELAY_USER:${MYSMS_DB_RELAY_USER:}}
      relay-password: ${MYSMS_IAM_DB_RELAY_PASSWORD:${MYSMS_DB_RELAY_PASSWORD:}}
    # the token issuer (sign-in): the private signing key is a secret and comes only from the environment
    token:
      # the same issuer every module verifies (mysms.auth.issuer)
      issuer: ${mysms.auth.issuer}
      signing-key: ${MYSMS_IAM_SIGNING_KEY:}
      key-id: ${MYSMS_IAM_SIGNING_KEY_ID:}
      access-token-ttl: ${MYSMS_IAM_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${MYSMS_IAM_REFRESH_TOKEN_TTL:P30D}
      # key rotation: the retiring key's public half stays in the JWKS until the access tokens it signed expire
      previous-public-key: ${MYSMS_IAM_PREVIOUS_PUBLIC_KEY:}
    # where iam.GetMe reads the caller's person record (the people service, or the monolith itself); empty = omitted
    people-base-url: ${MYSMS_PEOPLE_URL:}
    # first start of a new installation: creates the tenant and its administrator when all three are set
    bootstrap:
      tenant-code: ${MYSMS_IAM_BOOTSTRAP_TENANT_CODE:}
      admin-username: ${MYSMS_IAM_BOOTSTRAP_ADMIN_USERNAME:}
      admin-password: ${MYSMS_IAM_BOOTSTRAP_ADMIN_PASSWORD:}
