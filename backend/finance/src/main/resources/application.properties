# The finance service's configuration (JAVA-CODING-RULES §2.1). Every value is a default over an
# environment variable of DEPLOYMENT.md §3: an operator's application.properties beside the jar, environment
# variables, system properties and the command line override any of it. In the monolith, app combines this file
# with every other module's and sets the process-wide keys in its own application.properties.

spring.application.name=finance
spring.threads.virtual.enabled=true
server.port=${PORT:8080}
server.shutdown=graceful
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# authentication (auth-client): the OIDC issuer has no default, a service refuses to start without it; the OpenAPI
# document and Swagger UI stay closed unless the operator opens them
mysms.auth.issuer=${MYSMS_AUTH_ISSUER}
mysms.auth.jwk-set-uri=${MYSMS_AUTH_JWK_SET_URI:}
mysms.auth.api-docs=${MYSMS_API_DOCS:false}
mysms.auth.modules[0]=finance
# service identity: where iam issues service tokens (blank = no service calls), and this module's client secret
mysms.auth.token-uri=${MYSMS_AUTH_TOKEN_URI:}
mysms.finance.service-client.secret=${MYSMS_FINANCE_SERVICE_CLIENT_SECRET:}

# gRPC server (JAVA-CODING-RULES §10.4): health on, reflection only when the operator opens it, REST's 10 MB body limit
grpc.server.port=${MYSMS_GRPC_SERVER_PORT:9112}
grpc.server.health-service-enabled=true
grpc.server.reflection-service-enabled=${MYSMS_GRPC_REFLECTION:false}
grpc.server.shutdown-grace-period=20s
grpc.server.max-inbound-message-size=10MB
# gRPC clients: every call waits at most this long when its stub sets no deadline
mysms.grpc.client.deadline=${MYSMS_GRPC_CLIENT_DEADLINE:10s}
# the services finance calls, by Kubernetes DNS name unless MYSMS_<MODULE>_GRPC_ADDRESS names another target;
# plaintext: TLS ends at the mesh or proxy, as for REST
grpc.client.academics-service.address=${MYSMS_ACADEMICS_GRPC_ADDRESS:dns:///academics-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_ACADEMICS_SERVICE_PORT_RPC:9112}}
grpc.client.academics-service.negotiationType=PLAINTEXT
grpc.client.iam-service.address=${MYSMS_IAM_GRPC_ADDRESS:dns:///iam-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_IAM_SERVICE_PORT_RPC:9112}}
grpc.client.iam-service.negotiationType=PLAINTEXT
grpc.client.master-service.address=${MYSMS_MASTER_GRPC_ADDRESS:dns:///master-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_MASTER_SERVICE_PORT_RPC:9112}}
grpc.client.master-service.negotiationType=PLAINTEXT
grpc.client.org-service.address=${MYSMS_ORG_GRPC_ADDRESS:dns:///org-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_ORG_SERVICE_PORT_RPC:9112}}
grpc.client.org-service.negotiationType=PLAINTEXT
grpc.client.sis-service.address=${MYSMS_SIS_GRPC_ADDRESS:dns:///sis-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_SIS_SERVICE_PORT_RPC:9112}}
grpc.client.sis-service.negotiationType=PLAINTEXT

# events: rabbitmq (default) | google-pubsub | in-process (one JVM) | none (tests only); a microservice publishes as
# its module's broker user (blank = mysms-<module>)
mysms.events.bus=${MYSMS_EVENTS_BUS:rabbitmq}
mysms.events.rabbitmq.uri=${MYSMS_RABBITMQ_URI:}
mysms.events.rabbitmq.publisher-user=${MYSMS_RABBITMQ_PUBLISHER_USER:}
mysms.events.google-pubsub.project-id=${MYSMS_EVENTS_GCP_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
mysms.events.google-pubsub.emulator-host=${PUBSUB_EMULATOR_HOST:}

# the module's database: its own variable first, then the shared one (DEPLOYMENT.md §3); the application role gets
# DML grants only, Flyway runs as the schema owner, the outbox relay as mysms_relay; a blank replica = every read on
# the primary; statements slower than slow-statement are named in the log (0 = off)
mysms.finance.datasource.url=${MYSMS_FINANCE_DB_URL:${MYSMS_DB_URL:jdbc:postgresql://localhost:5432/mysms}}
mysms.finance.datasource.username=${MYSMS_FINANCE_DB_USER:${MYSMS_DB_USER:mysms}}
mysms.finance.datasource.password=${MYSMS_FINANCE_DB_PASSWORD:${MYSMS_DB_PASSWORD:}}
mysms.finance.datasource.maximum-pool-size=${MYSMS_FINANCE_DB_POOL_SIZE:10}
mysms.finance.datasource.slow-statement=${MYSMS_FINANCE_DB_SLOW_STATEMENT:${MYSMS_DB_SLOW_STATEMENT:200ms}}
mysms.finance.datasource.replica-url=${MYSMS_FINANCE_DB_REPLICA_URL:${MYSMS_DB_REPLICA_URL:}}
mysms.finance.datasource.replica-username=${MYSMS_FINANCE_DB_REPLICA_USER:${MYSMS_DB_REPLICA_USER:}}
mysms.finance.datasource.replica-password=${MYSMS_FINANCE_DB_REPLICA_PASSWORD:${MYSMS_DB_REPLICA_PASSWORD:}}
mysms.finance.datasource.migrate-username=${MYSMS_FINANCE_DB_MIGRATE_USER:${MYSMS_DB_MIGRATE_USER:}}
mysms.finance.datasource.migrate-password=${MYSMS_FINANCE_DB_MIGRATE_PASSWORD:${MYSMS_DB_MIGRATE_PASSWORD:}}
mysms.finance.datasource.relay-username=${MYSMS_FINANCE_DB_RELAY_USER:${MYSMS_DB_RELAY_USER:}}
mysms.finance.datasource.relay-password=${MYSMS_FINANCE_DB_RELAY_PASSWORD:${MYSMS_DB_RELAY_PASSWORD:}}

# finance's own settings
mysms.finance.razorpay-url=${MYSMS_RAZORPAY_URL:}
mysms.finance.razorpay-timeout=${MYSMS_RAZORPAY_TIMEOUT:PT20S}
# a gateway refund the gateway does not know this long after it was opened never reached it: it fails and its amount
# is released (long enough for a request still on its way, beyond razorpay-timeout)
mysms.finance.refund-reconcile-after=${MYSMS_FINANCE_REFUND_RECONCILE_AFTER:PT15M}
