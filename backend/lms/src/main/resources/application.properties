# The lms service's configuration (JAVA-CODING-RULES §2.1). Every value is a default over an
# environment variable of DEPLOYMENT.md §4: an operator's application.properties beside the jar, environment
# variables, system properties and the command line override any of it. In the monolith, app combines this file
# with every other module's and sets the process-wide keys in its own application.properties.

spring.application.name=lms
spring.threads.virtual.enabled=true
server.port=${PORT:8080}
server.shutdown=graceful
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# authentication (auth-client): the OIDC issuer has no default, a service refuses to start without it; the OpenAPI
# document and Swagger UI stay closed unless the operator opens them
mysms.auth.issuer=${MYSMS_AUTH_ISSUER}
mysms.auth.jwk-set-uri=${MYSMS_AUTH_JWK_SET_URI:}
mysms.auth.api-docs=${MYSMS_API_DOCS:false}
mysms.auth.modules[0]=lms
# the deployed release, published with this module's API-permission catalogue (JAVA-CODING-RULES §16.2)
mysms.auth.release=${MYSMS_RELEASE:development}
# how often the catalogue is published again, so iam can retire what no running release serves (below iam's
# mysms.iam.api-permission.retire-after)
mysms.auth.catalogue-interval=${MYSMS_CATALOGUE_INTERVAL:6h}
# how long the permissions filter keeps a role's permission codes before asking iam again (a token issued after a
# role change refreshes it at once)
mysms.auth.role-cache-ttl=${MYSMS_ROLE_CACHE_TTL:PT1M}
# service identity: where iam issues service tokens (blank = no service calls), and this module's client secret
mysms.auth.token-uri=${MYSMS_AUTH_TOKEN_URI:}
mysms.lms.service-client.secret=${MYSMS_LMS_SERVICE_CLIENT_SECRET:}

# gRPC server (JAVA-CODING-RULES §10.4): health on, reflection only when the operator opens it, REST's 10 MB body limit
grpc.server.port=${MYSMS_GRPC_SERVER_PORT:9112}
grpc.server.health-service-enabled=true
grpc.server.reflection-service-enabled=${MYSMS_GRPC_REFLECTION:false}
grpc.server.shutdown-grace-period=20s
grpc.server.max-inbound-message-size=10MB
# gRPC clients: every call waits at most this long when its stub sets no deadline
mysms.grpc.client.deadline=${MYSMS_GRPC_CLIENT_DEADLINE:10s}
# one client per service lms calls; split deployment (Kubernetes DNS)
grpc.client.assessment-service.address=${MYSMS_ASSESSMENT_GRPC_ADDRESS:dns:///assessment-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_ASSESSMENT_SERVICE_PORT_RPC:9112}}
grpc.client.assessment-service.negotiationType=PLAINTEXT
grpc.client.iam-service.address=${MYSMS_IAM_GRPC_ADDRESS:dns:///iam-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_IAM_SERVICE_PORT_RPC:9112}}
grpc.client.iam-service.negotiationType=PLAINTEXT
grpc.client.platform-service.address=${MYSMS_PLATFORM_GRPC_ADDRESS:dns:///platform-service.${MYSMS_NAMESPACE:mysms}.svc.cluster.local:${MYSMS_PLATFORM_SERVICE_PORT_RPC:9112}}
grpc.client.platform-service.negotiationType=PLAINTEXT

# events: rabbitmq (default) | google-pubsub | in-process (one JVM) | none (tests only); a microservice publishes as
# its module's broker user (blank = mysms-<module>)
mysms.events.bus=${MYSMS_EVENTS_BUS:rabbitmq}
mysms.events.rabbitmq.uri=${MYSMS_RABBITMQ_URI:}
mysms.events.rabbitmq.publisher-user=${MYSMS_RABBITMQ_PUBLISHER_USER:}
mysms.events.google-pubsub.project-id=${MYSMS_EVENTS_GCP_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
mysms.events.google-pubsub.emulator-host=${PUBSUB_EMULATOR_HOST:}

# background work (core): monthly partitions of the module's database (DEPLOYMENT.md §5.6) and the scheduled-job
# runtime (ROADMAP ARC-4); a replica with jobs off leaves the module's scheduled runs to the others
mysms.partitions.enabled=${MYSMS_PARTITIONS_ENABLED:true}
mysms.partitions.interval=${MYSMS_PARTITIONS_INTERVAL:24h}
mysms.partitions.months-ahead=${MYSMS_PARTITIONS_MONTHS_AHEAD:3}
mysms.partitions.retention-months=${MYSMS_PARTITIONS_RETENTION_MONTHS:0}
mysms.jobs.enabled=${MYSMS_JOBS_ENABLED:true}
mysms.jobs.poll-interval=${MYSMS_JOBS_POLL_INTERVAL:1m}
mysms.jobs.lease=${MYSMS_JOBS_LEASE:30m}
mysms.jobs.batch-size=${MYSMS_JOBS_BATCH_SIZE:20}

# the module's database: its own variable first, then the shared one (DEPLOYMENT.md §4); the application role gets
# DML grants only, Flyway runs as the schema owner, the outbox relay as mysms_relay; a blank replica = every read on
# the primary; statements slower than slow-statement are named in the log (0 = off)
mysms.lms.datasource.url=${MYSMS_LMS_DB_URL:${MYSMS_DB_URL:jdbc:postgresql://localhost:5432/mysms}}
mysms.lms.datasource.username=${MYSMS_LMS_DB_USER:${MYSMS_DB_USER:mysms}}
mysms.lms.datasource.password=${MYSMS_LMS_DB_PASSWORD:${MYSMS_DB_PASSWORD:}}
mysms.lms.datasource.maximum-pool-size=${MYSMS_LMS_DB_POOL_SIZE:10}
mysms.lms.datasource.slow-statement=${MYSMS_LMS_DB_SLOW_STATEMENT:${MYSMS_DB_SLOW_STATEMENT:200ms}}
mysms.lms.datasource.replica-url=${MYSMS_LMS_DB_REPLICA_URL:${MYSMS_DB_REPLICA_URL:}}
mysms.lms.datasource.replica-username=${MYSMS_LMS_DB_REPLICA_USER:${MYSMS_DB_REPLICA_USER:}}
mysms.lms.datasource.replica-password=${MYSMS_LMS_DB_REPLICA_PASSWORD:${MYSMS_DB_REPLICA_PASSWORD:}}
mysms.lms.datasource.migrate-username=${MYSMS_LMS_DB_MIGRATE_USER:${MYSMS_DB_MIGRATE_USER:}}
mysms.lms.datasource.migrate-password=${MYSMS_LMS_DB_MIGRATE_PASSWORD:${MYSMS_DB_MIGRATE_PASSWORD:}}
mysms.lms.datasource.relay-username=${MYSMS_LMS_DB_RELAY_USER:${MYSMS_DB_RELAY_USER:}}
mysms.lms.datasource.relay-password=${MYSMS_LMS_DB_RELAY_PASSWORD:${MYSMS_DB_RELAY_PASSWORD:}}

# files lms stores for or reads from the caller (grade exports, syllabi, certificates, member imports, course
# packages, question files, submission archives) through the platform service's pre-signed URLs: the connect and
# transfer timeout of one file
mysms.lms.files.timeout=${MYSMS_LMS_FILES_TIMEOUT:PT60S}

# evaluator calendars: Google OAuth (authorization code); a blank client id leaves the provider unconfigured, and
# connecting a calendar answers 503 CALENDAR_NOT_CONFIGURED
mysms.lms.calendar.google.auth-url=${MYSMS_GOOGLE_CALENDAR_AUTH_URL:https://accounts.google.com/o/oauth2/v2/auth}
mysms.lms.calendar.google.client-id=${MYSMS_GOOGLE_CALENDAR_CLIENT_ID:}
mysms.lms.calendar.google.scope=${MYSMS_GOOGLE_CALENDAR_SCOPE:https://www.googleapis.com/auth/calendar.events}
mysms.lms.calendar.state-lifetime=${MYSMS_CALENDAR_STATE_LIFETIME:PT15M}

# video meetings of live classes: Zoom (Server-to-Server OAuth, credentials per tenant in lms.conferencing_account);
# a blank address leaves the provider unconfigured, and live classes on it answer 503 CONFERENCING_NOT_CONFIGURED
mysms.lms.conferencing.zoom.api-url=${MYSMS_ZOOM_API_URL:https://api.zoom.us/v2/}
mysms.lms.conferencing.zoom.oauth-url=${MYSMS_ZOOM_OAUTH_URL:https://zoom.us/oauth/token}
mysms.lms.conferencing.timeout=${MYSMS_CONFERENCING_TIMEOUT:PT20S}

# plagiarism checks: the name and version lms gives itself towards the provider (Turnitin's integration headers);
# the provider, its API URL and key are each tenant's plagiarism account
mysms.lms.plagiarism.integration-name=${MYSMS_LMS_PLAGIARISM_INTEGRATION_NAME:MySMS}
mysms.lms.plagiarism.integration-version=${MYSMS_LMS_PLAGIARISM_INTEGRATION_VERSION:1}

# LTI 1.1 grade return: the public URL of lms.ReceiveToolOutcome that launches hand to tools (blank = launches carry
# no outcome service and tools cannot send grades back)
mysms.lms.lti.outcome-url=${MYSMS_LMS_LTI_OUTCOME_URL:}

# e-book conversion: the deployment's document-conversion service (blank provider = conversion answers 503); the
# callback secret signs lms.ReceiveEbookConversion the MySMS way; wait = how long ConvertEbook waits for a quick job
mysms.lms.conversion.provider=${MYSMS_LMS_CONVERSION_PROVIDER:}
mysms.lms.conversion.api-url=${MYSMS_LMS_CONVERSION_API_URL:}
mysms.lms.conversion.api-key=${MYSMS_LMS_CONVERSION_API_KEY:}
mysms.lms.conversion.callback-secret=${MYSMS_LMS_CONVERSION_CALLBACK_SECRET:}
mysms.lms.conversion.wait=${MYSMS_LMS_CONVERSION_WAIT:45s}
# outgoing e-mail (core MailDelivery): SMTP with STARTTLS; a blank host = no mail (the operations that send answer 503
# NOT_CONFIGURED); STARTTLS may be made optional only for a local relay
mysms.lms.smtp.host=${MYSMS_SMTP_HOST:}
mysms.lms.smtp.port=${MYSMS_SMTP_PORT:587}
mysms.lms.smtp.username=${MYSMS_SMTP_USERNAME:}
mysms.lms.smtp.password=${MYSMS_SMTP_PASSWORD:}
mysms.lms.smtp.from=${MYSMS_SMTP_FROM:}
mysms.lms.smtp.starttls-required=${MYSMS_SMTP_STARTTLS_REQUIRED:true}

# SCORM packages: the address their extracted files are served from (a static host or CDN in front of the file
# store); a chapter's launch URL is <base>/<package path>/<launch file>. Blank = SCORM launch answers 503 NOT_CONFIGURED
mysms.lms.scorm.content-base-url=${MYSMS_LMS_SCORM_CONTENT_BASE_URL:}
