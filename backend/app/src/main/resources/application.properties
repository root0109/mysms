# The monolith's configuration (JAVA-CODING-RULES §2.1): every module's own application.properties is combined into
# this process by core's ModulePropertiesEnvironmentPostProcessor, below this file. This file sets what differs when
# all modules run in one process: the application's name, the modules it serves, and in-process gRPC clients.
# An operator's application.properties beside the jar, environment variables and the command line override it.

spring.application.name=mysms
mysms.auth.modules[0]=academics
mysms.auth.modules[1]=admission
mysms.auth.modules[2]=assessment
mysms.auth.modules[3]=attendance
mysms.auth.modules[4]=careers
mysms.auth.modules[5]=comms
mysms.auth.modules[6]=facility
mysms.auth.modules[7]=finance
mysms.auth.modules[8]=frontoffice
mysms.auth.modules[9]=hr
mysms.auth.modules[10]=iam
mysms.auth.modules[11]=library
mysms.auth.modules[12]=lms
mysms.auth.modules[13]=master
mysms.auth.modules[14]=org
mysms.auth.modules[15]=payroll
mysms.auth.modules[16]=people
mysms.auth.modules[17]=platform
mysms.auth.modules[18]=sis
mysms.auth.modules[19]=timetable
mysms.auth.modules[20]=transport

# the monolith publishes for every module as one broker user of its own
mysms.events.rabbitmq.publisher-user=${MYSMS_RABBITMQ_PUBLISHER_USER:self}

# every module's clients call the in-process server (MYSMS_<MODULE>_GRPC_ADDRESS sends one elsewhere)
grpc.server.in-process-name=mysms
grpc.client.academics-service.address=${MYSMS_ACADEMICS_GRPC_ADDRESS:in-process:mysms}
grpc.client.admission-service.address=${MYSMS_ADMISSION_GRPC_ADDRESS:in-process:mysms}
grpc.client.assessment-service.address=${MYSMS_ASSESSMENT_GRPC_ADDRESS:in-process:mysms}
grpc.client.attendance-service.address=${MYSMS_ATTENDANCE_GRPC_ADDRESS:in-process:mysms}
grpc.client.careers-service.address=${MYSMS_CAREERS_GRPC_ADDRESS:in-process:mysms}
grpc.client.comms-service.address=${MYSMS_COMMS_GRPC_ADDRESS:in-process:mysms}
grpc.client.facility-service.address=${MYSMS_FACILITY_GRPC_ADDRESS:in-process:mysms}
grpc.client.finance-service.address=${MYSMS_FINANCE_GRPC_ADDRESS:in-process:mysms}
grpc.client.frontoffice-service.address=${MYSMS_FRONTOFFICE_GRPC_ADDRESS:in-process:mysms}
grpc.client.hr-service.address=${MYSMS_HR_GRPC_ADDRESS:in-process:mysms}
grpc.client.iam-service.address=${MYSMS_IAM_GRPC_ADDRESS:in-process:mysms}
grpc.client.library-service.address=${MYSMS_LIBRARY_GRPC_ADDRESS:in-process:mysms}
grpc.client.lms-service.address=${MYSMS_LMS_GRPC_ADDRESS:in-process:mysms}
grpc.client.master-service.address=${MYSMS_MASTER_GRPC_ADDRESS:in-process:mysms}
grpc.client.org-service.address=${MYSMS_ORG_GRPC_ADDRESS:in-process:mysms}
grpc.client.payroll-service.address=${MYSMS_PAYROLL_GRPC_ADDRESS:in-process:mysms}
grpc.client.people-service.address=${MYSMS_PEOPLE_GRPC_ADDRESS:in-process:mysms}
grpc.client.platform-service.address=${MYSMS_PLATFORM_GRPC_ADDRESS:in-process:mysms}
grpc.client.sis-service.address=${MYSMS_SIS_GRPC_ADDRESS:in-process:mysms}
grpc.client.timetable-service.address=${MYSMS_TIMETABLE_GRPC_ADDRESS:in-process:mysms}
grpc.client.transport-service.address=${MYSMS_TRANSPORT_GRPC_ADDRESS:in-process:mysms}
