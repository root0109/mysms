# GENERATED by tools/backend/gen_backend_modules.py
# The monolith: all 21 modules in one process. Every module's own configuration is imported unchanged.
spring:
  application:
    name: mysms
  config:
    import:
      - classpath:mysms-master.yml
      - classpath:mysms-platform.yml
      - classpath:mysms-iam.yml
      - classpath:mysms-org.yml
      - classpath:mysms-people.yml
      - classpath:mysms-academics.yml
      - classpath:mysms-sis.yml
      - classpath:mysms-hr.yml
      - classpath:mysms-payroll.yml
      - classpath:mysms-admission.yml
      - classpath:mysms-attendance.yml
      - classpath:mysms-facility.yml
      - classpath:mysms-timetable.yml
      - classpath:mysms-assessment.yml
      - classpath:mysms-lms.yml
      - classpath:mysms-finance.yml
      - classpath:mysms-library.yml
      - classpath:mysms-transport.yml
      - classpath:mysms-comms.yml
      - classpath:mysms-frontoffice.yml
      - classpath:mysms-careers.yml
  threads:
    virtual:
      enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
mysms:
  auth:
    issuer: ${MYSMS_AUTH_ISSUER}
    jwk-set-uri: ${MYSMS_AUTH_JWK_SET_URI:}
    modules:
      - master
      - platform
      - iam
      - org
      - people
      - academics
      - sis
      - hr
      - payroll
      - admission
      - attendance
      - facility
      - timetable
      - assessment
      - lms
      - finance
      - library
      - transport
      - comms
      - frontoffice
      - careers
  events:
    # rabbitmq (default) | in-process (one JVM) | none (tests only: nothing relayed or consumed)
    bus: ${MYSMS_EVENTS_BUS:rabbitmq}
    rabbitmq:
      uri: ${MYSMS_RABBITMQ_URI:}
      # one process publishes for every module, as its own broker user ("self")
      publisher-user: ${MYSMS_RABBITMQ_PUBLISHER_USER:self}
