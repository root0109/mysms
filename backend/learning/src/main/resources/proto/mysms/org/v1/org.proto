  optional string address_line1 = 9;
  // Street address line 2.
  optional string address_line2 = 10;
  // City. [UUID]
  optional string city_id = 11;
  // State / province. [UUID]
  optional string state_province_id = 12;
  // Country. [UUID]
  optional string country_id = 13;
  // Postal / PIN code.
  optional string postal_code = 14;
  // Time zone if different from the tenant.
  optional string timezone = 15;
  // Operating currency if different from the tenant. [UUID]
  optional string currency_id = 16;
  // Logo image. [UUID]
  optional string logo_file_id = 17;
